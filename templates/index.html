<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daasa Sāhitya — ದಾಸ ಸಾಹಿತ್ಯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+Kannada:wght@400;600;700&family=Noto+Serif+Tamil:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="brand-kn">दास साहित्य</span>
      <span class="brand-en">Daasa Sāhitya</span>
      <div class="site-subtitle">ಹರಿದಾಸ ಸಾಹಿತ್ಯ ಸಂಗ್ರಹ · A Treasury of Devotional Literature</div>
    </div>
  </header>

  <main class="index-page">
    <section class="filter-panel" aria-label="Filters">
      <div class="filter-bar">
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="search" class="search-input" id="search-input"
                 placeholder="Search title, author, lyric…" autocomplete="off">
        </div>
        <button type="button" class="search-button" id="search-button">Search</button>
      </div>

      <div class="filter-grid">
        <div class="filter-group filter-group-wide">
          <span class="filter-legend">On whom?</span>
          <div class="tag-input" id="filter-on"></div>
        </div>

        <div class="filter-group">
          <span class="filter-legend">Category</span>
          <div class="tag-input" id="filter-category"></div>
        </div>

        <div class="filter-group">
          <span class="filter-legend">Type</span>
          <div class="tag-input" id="filter-type"></div>
        </div>

        <div class="filter-group filter-group-wide">
          <span class="filter-legend">Festival / Vrata / Jayanti</span>
          <div class="tag-input" id="filter-festivals"></div>
        </div>

        <div class="filter-group">
          <span class="filter-legend">Author</span>
          <div class="tag-input" id="filter-author"></div>
        </div>

        <div class="filter-group">
          <span class="filter-legend">Ankita</span>
          <div class="tag-input" id="filter-ankita"></div>
        </div>

        <div class="filter-actions">
          <button type="button" class="reset-button" id="reset-filters">Reset</button>
        </div>
      </div>

      <p class="filter-status" id="filter-status" role="status" aria-live="polite"></p>
    </section>

    <ul class="song-list" id="song-list">
      {{SONGS}}
    </ul>

    <p class="empty-state" id="empty-state" hidden>No compositions match these filters.</p>
  </main>

  <footer class="site-footer">
    <p>ಶ್ರೀ ಕೃಷ್ಣಾರ್ಪಣಮಸ್ತು · Śrī Kṛṣṇārpaṇamastu</p>
    <p class="build-date">Updated: {{BUILD_DATE}} · {{TOTAL}} compositions</p>
  </footer>

  <script id="ds-index-data" type="application/json">{{INDEX_JSON}}</script>
  <script>
    window.DS_INDEX = JSON.parse(document.getElementById('ds-index-data').textContent);
  </script>
  <script src="js/tabs.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
