# ──────────────────────────────────────────────────────────────────
# Daasa Saahitya - New Song Template
#
# HOW TO USE:
# 1. Copy this file to lyrics/<category>/your-song-name.yml
# 2. Fill in the Kannada fields below
# 3. Commit → GitHub Actions auto-builds the site
#
# The build script auto-transliterates to Tamil, Devanagari, and IAST.
# Only add _ta, _hi, _en fields if you need to CORRECT an auto-transliteration.
# ──────────────────────────────────────────────────────────────────

# REQUIRED: Kannada title and author
title_kn: ಹಾಡಿನ ಹೆಸರು
author_kn: ಕವಿ/ದಾಸರ ಹೆಸರು

# OPTIONAL: Raga, Tala, Ankita
raga_kn:
tala_kn:
ankita_kn:

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಪಲ್ಲವಿ ಸಾಲುಗಳು ಇಲ್ಲಿ

  # ── Anupallavi ──
  - type: anupallavi
    kn: |
      ಅನುಪಲ್ಲವಿ ಸಾಲುಗಳು ಇಲ್ಲಿ

  # ── Caraṇa with tala name ──
  - type: None
    number: 1
    subtitle_kn: ಧ್ರುವತಾಳ
    kn: |
      ಮೊದಲ ಚರಣದ ಸಾಲುಗಳು
      ಇಲ್ಲಿ ಬರೆಯಿರಿ

  # ── Another Caraṇa ──
  - type: None
    number: 2
    subtitle_kn: ಮಟ್ಟತಾಳ
    kn: |
      ಎರಡನೆಯ ಚರಣದ ಸಾಲುಗಳು

  # ── Subtitle (mid-song heading) ──
  - type: subtitle
    subtitle_kn: ಚರಣಗಳು
    kn: ""

  # ── More Caraṇas ──
  - type: None
    number: 3
    subtitle_kn: ರೂಪಕತಾಳ
    kn: |
      ಮೂರನೆಯ ಚರಣ

  # ── Jāte (ending) ──
  - type: None
    subtitle_kn: ಜತೆ
    kn: |
      ಜತೆ ಸಾಲು
