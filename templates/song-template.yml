# ──────────────────────────────────────────────────────────────────
# Daasa Saahitya - New Song Template
#
# HOW TO USE:
# 1. Copy this file to lyrics/<folder>/your-song-name.yml
# 2. Fill in the Kannada fields below
# 3. Run: python scripts/align.py --apply   (normalises indentation)
# 4. Commit → GitHub Actions auto-builds the site
#
# YAML is indentation sensitive. `scripts/align.py` rewrites the file with
# canonical 2-space indentation and fills in the metadata below from the
# folder path and the title, so you only need to write what align.py cannot
# guess. It never overwrites values you have set by hand.
#
# The build script auto-transliterates to Tamil, Devanagari, and IAST.
# Only add _ta, _hi, _en fields if you need to CORRECT an auto-transliteration.
# ──────────────────────────────────────────────────────────────────

# REQUIRED: Kannada title and author
title_kn: ಹಾಡಿನ ಹೆಸರು
author_kn: ಕವಿ/ದಾಸರ ಹೆಸರು

# FILTERABLE METADATA - these drive the tag inputs on the index page.
# The lists in scripts/align.py are the canonical order shown in the dropdowns;
# any other wording still works and shows up in the list, but then it will not
# line up with the dropdown. Leave a field empty and align.py guesses it from
# the folder and title. It never overwrites values you set by hand.
category: []
#  - Haadu | Stuti | Suladi | Sloka | Stotra | Kavya | Gadya | Kathe

# Who the song is addressed to. One or more names from ON_WHO in
# scripts/align.py: Vishnu, Dashavatara, Varaha, Narasimha, Vamana, Parasurama,
# Rama, Krishna, Padmanabha, Kapila, Dattatreya, Keshavaadi Rupa, Venkatesha,
# Ranga, Hanuma, Bheema, Madhwacharya, Saraswati, Garuda, Sesha, Rudra, Ganesha,
# Subrahmanya, Bhutarajaru, Lakshmi, Durga, Parvati, Bharati,
# Padmanabha Teertharu, Rayaru, Vyasarajaru, Vadirajaru, Sripadarajaru,
# Jayateertharu, Purandara Dasaru, Vijaya Dasaru, Jagannatha Dasaru,
# Gopala Dasaru
on_who: []
#  - Lakshmi

# Ritual form. Zero or more of:
# Aavahana (Baaro/Baare), Aagamana (Banda/Bandalu), Namaskaara, Pooja, Naivedya,
# Udi Tumbuva, Uruttani, Aarati, Huva / Varava Kodu, Laali, Vairagya,
# Ninda Stuti, Parihara, others
types: []
#  - Aarati

# Festival, vrata or jayanti the song belongs to. Zero or more of the 28
# FESTIVALS in scripts/align.py (Rama Navami, Krishna Jayanti, Mangala Gowri,
# Vara Mahalakshmi, Guru Poornima, Navaratri, Deepavali, ...).
festivals: []
#  - Vara Mahalakshmi

# OPTIONAL: Raga, Tala, Ankita
# ankita_kn is also the Author/Ankita filter value and the column shown in the
# search results, so spell it the same way every time ("Purandara Vittala").
raga_kn:
tala_kn:
ankita_kn:

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಪಲ್ಲವಿ ಸಾಲುಗಳು ಇಲ್ಲಿ

  # ── Anupallavi ──
  - type: anupallavi
    kn: |
      ಅನುಪಲ್ಲವಿ ಸಾಲುಗಳು ಇಲ್ಲಿ

  # ── Caraṇa with tala name ──
  - type: None
    number: 1
    subtitle_kn: ಧ್ರುವತಾಳ
    kn: |
      ಮೊದಲ ಚರಣದ ಸಾಲುಗಳು
      ಇಲ್ಲಿ ಬರೆಯಿರಿ

  # ── Another Caraṇa ──
  - type: None
    number: 2
    subtitle_kn: ಮಟ್ಟತಾಳ
    kn: |
      ಎರಡನೆಯ ಚರಣದ ಸಾಲುಗಳು

  # ── Subtitle (mid-song heading) ──
  - type: subtitle
    subtitle_kn: ಚರಣಗಳು
    kn: ""

  # ── More Caraṇas ──
  - type: None
    number: 3
    subtitle_kn: ರೂಪಕತಾಳ
    kn: |
      ಮೂರನೆಯ ಚರಣ

  # ── Jāte (ending) ──
  - type: None
    subtitle_kn: ಜತೆ
    kn: |
      ಜತೆ ಸಾಲು
