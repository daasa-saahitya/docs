title_kn: ಆರತಿ ಜಯ ತುಳಸಿ ಕಾರ್ತಿಕ ದಾಮೋದರನರಸಿ
author_kn: ಪುರಂದರ ದಾಸರು
category: [Dasara Pada]
on_who: [Tulasi]
types: []
festivals: [Uttana Dwadashi]
raga_kn: ಸೌರಾಷ್ಟ್ರ
tala_kn:
ankita_kn: ಪುರಂದರ ವಿಠಲ

verses:
  - type: pallavi
    kn: |
      ಆರತಿ ಜಯ ತುಳಸಿ ಕಾರ್ತಿಕ ದಾಮೋದರನರಸಿ ||

  - type: anupallavi
    kn: |
      ನೀರನು ಎರೆದು ನೀರೆಯರ ಮನ್ನಿಸಿ ಭಾರಿ ಸುಖವ ಸುರಿಸಿ ಮೆರೆಯುವಿ || 

  - type: charana
    kn: |
      ಮನೆಯ ಹಿತ್ತಲದ ಅಂಗಳದೊಳ್ ನೆಲೆಸಿ ಸರ್ವ ಮಾನ್ಯಳೆನಿಸಿ ಮೆರೆಯುವಿ ||
      ರಾಧಾ ಮಾಧವರೊಂದಿಗೆ ವಾಸಿಪ ಇಂದಿರೇಶನ ರಾಣಿ ಎಂದೆನಿಸಿ ||  
