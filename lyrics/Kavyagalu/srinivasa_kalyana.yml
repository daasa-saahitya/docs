# Daasa Saahitya - lyrics (aligned by scripts/align.py)

title_kn: ಶ್ರೀನಿವಾಸ ಕಲ್ಯಾಣ
author_kn: ಪುರಂದರ ದಾಸರು
category:
  - Kavya
on_who: []
types: []
raga_kn: ರಾಗಮಾಲಿಕೆ (ಮೋಹನ, ಪೂರ್ವಿ ಕಲ್ಯಾಣಿ, ಬೃಂದಾವನ ಸಾರಂಗ)
tala_kn: ಆದಿ ತಾಳ
ankita_kn: ಪುರಂದರ ವಿಠ್ಠಲ
verses:
  - type: ''
    number: 1
    subtitle_kn: ಮೋಹನ
    kn:
    |
      ವೈಕುಂಠಪತಿ ತಾನು ವೈಕುಂಠವನೆ ಬಿಟ್ಟು ವೇಂಕಟಾದ್ರಿಗೆ ಹೋಗಿ ಶ್ರೀಕಾಂತ ನಿಂತ |
      ನಾಲ್ಕು ಕಡೆಯೂ ನೋಡಿ ವಲ್ಮೀಕವನೆ ಕಂಡು ಏಕಾಂತಸ್ಥಳವೆಂದು ಬಹುಕಾಲವಲ್ಲಿದ್ದ ||

  - type: ''
    number: 2
    kn:
    |
      ಚೋಳಭೃತ್ಯನು ಶಿರವನೊಡೆದ ಗಾಯವ ನೋಡಿ ತಾಳಲಾರದೆ ಸ್ವಾಮಿ ಗುರುಗಳನೆ ಕರೆಸಿ |
      ಹೇಳಿದೌಷದಮಾಡಿ ಕ್ರೋಢರೂಪಿಯ ಕಂಡು ಕೇಳಿ ಸ್ಥಳವನೆ ಕೊಂಡು ಲೀಲೆ ತೋರುತಲಿ ||

  - type: ''
    number: 3
    kn:
    |
      ಇರುತಿರಲು ಒಂದಿನ ತುರಗವನೆ ಸ್ಮರಿಸುತಲಿ ತುರಗ ಬರಲು ಕಂಡು ಮುದದಿ ತಾನೇರಿ |
      ಪರಿಪರಿ ಮೃಗಗಳ ಅಡವಿಯಲಿ ತಾ ಕೊಂದು ಕರುಣಾಸಾಗರ ಒಂದು ವನವ ಕಂಡನು ||

  - type: ''
    number: 4
    kn:
    |
      ವನದಲ್ಲಿ ವನಜಾಕ್ಷಿ ರಾಜಪುರ್ತಿಯ ಕಂಡು ಮನಕೆ ಬಂದಂತಾಡಿ ಕಲಹ ಮಾಡಿದರು |
      ಮನಸಿಜ ತಾನು ಅಶ್ವವ ಕಳಕೊಂಡು ಘನವಾದ ಗಿರಿ ಏರಿ ಮಲಗಿದ ಹರಿಯು ||

  - type: ''
    number: 5
    kn:
    |
      ನಗಧರ ಮಲಗಲು ಬಕುಳಾವತಿಯು ಆಗ ಬಗೆ ಬಗೆ ಕೇಳಲು ಶೋಕದಿಂ ನುಡಿದ |
      ಗಗರಾಜನ ಪುತ್ರಿ ಪದ್ಮಾವತಿಯ ಕಂಡು ಹಗಲು ಇರಳು ಆಕೆ ಮುಖವ ಸ್ಮರಿಸುವನು ||

  - type: ''
    number: 6
    subtitle_kn: ಪೂರ್ವಿ ಕಲ್ಯಾಣಿ
    kn:
    |
      ಅವಳಿಗೋಸುಗವಾಗಿ ಇದ್ದಲ್ಲಿಗೆ ಹೋದೆ ಅವಳಿಂದ ಎನ್ನಶ್ವ ಹತವಾಯಿತಮ್ಮ |
      ಅವಳ ಹೊರೆತು ಎನ್ನ ಪ್ರಾಣವೇ ನಿಲ್ಲದು ಅವಳ ಘಟನೆಯ ನೀನು ಮಾಡಬೇಕಮ್ಮ ||

  - type: ''
    number: 7
    kn:
    |
      ಅಂದ ಮಾತನು ಕೇಳಿ ಬಕುಳಾವತಿಯು ಆಗ ಆನಂದದಿಂ ರಾಜಪುರಕೆ ತೆರಳಿದಳು |
      ಸುಂದರಿಯರ ಕಾರ್ಯ ಸ್ಥಿರವಾಗದೆಂದು ಚೆಂದುಳ್ಳ ಸ್ತ್ರೀರೂಪ ಧರಿಸಿದನು ಹರಿಯು ||

  - type: ''
    number: 8
    kn:
    |
      ಕೊರವಂಜಿ ತಾನಾಗಿ ನೃಪನ ಪುರಕೆ ಹೋಗಿ ಧರಣಿದೇವಿಯ ಮುಂದೆ ಶಕುನ ಹೇಳಿದನು |
      ತಿರುಗಿ ಬರಲಾತಗೆ ಮಗಳ ಕೊಡುವೆನೆಂದು ಹರಿಗೆ ನಿಶ್ಚಯಮಾಡಿ ಶಂಕರ ಕಳುಹಿಸಿದನು ||

  - type: ''
    number: 9
    kn:
    |
      ತಾಪಸೋತ್ತಮ ಬಂದು ಪತ್ರವನೆ ಕೊಡಲು ಶ್ರೀಪತಿಯು ತಾನೋದಿ ಬೆನ್ಹಿಂದೆ ಬರೆದ |
      ಆ ಪರಮ ವಂದ್ಯ ತಾ ಸುರಸ್ತೋಮವನೆ ಕರೆಸಿ ಈ ಪರಿ ವೈಭೋಗ ಮಾಡಿದ ಹರಿಯು ||

  - type: ''
    number: 10
    kn:
    |
      ಆ ಕ್ಷಣದಲಿ ತಾನು ತರಣಿಯನ ಕರೆಸಿ ಇಕ್ಷುಚಾಪನ ಮಾತೆ ಬಳಿಗೆ ಪೋಗೆಂದ |
      ತಕ್ಷಣದಲಿ ಸೂರ್ಯ ಹೋಗಿ ನಿಲ್ಲಲು ಹರಿಯ ಆಕ್ಷೇಮವನೆ ಕೇಳಿ ತೆರಳಿದಳು ಬೇಗ ||

  - type: ''
    number: 11
    kn:
    |
      ಬಂದ ಸತಿಯಳ ಕೂಡಿ ಮಂದಿರಕೆ ಪೋಗಿ ಹಿಂದೆ ಹೇಳಿದ ವಾಕ್ಯ ನಡೆಸೆಂದ ಹರಿಯು |
      ಸಂದೇಹವಿಲ್ಲದೇ ಸ್ವಾಮಿ ನಡೆಸೆಂದು ಇಂದಿರಾದೇವಿಯು ನುಡಿದಳು ಹರಿಗೆ ||

  - type: ''
    number: 12
    subtitle_kn: ಬೃಂದಾವನ ಸಾರಂಗ
    kn:
    |
      ಸ್ವಸ್ತಿವಾಚನ ಮಾಡಿ ಕುಲದೇವರನಿಟ್ಟು ಪ್ರಸ್ಥವ ಮಾಡಿದ ದ್ವಿಜರ ಸ್ತೋಮಕ್ಕೆ |
      ಮರುದಿನ ಲಕ್ಷ್ಮೀಶ ರಾಜನ ಆ ಪುರಕೆ ಸುರಸ್ತೋಮವನೆ ಕೂಡಿ ತೆರಳಿ ಬಂದ ||

  - type: ''
    number: 13
    kn:
    |
      ಬರುವ ಕೃಷ್ಣನ ಕಂಡು ಶುಕಮುನಿ ಸಂಸ್ತುತಿಸಿ ಹರಿಗೆ ಭೋಜನವನ್ನು ಮುದದಿ ಮಾಡಿಸಿದ |
      ಆಕಳಂಕ ಮಹಿಮನು ಬಂದ ವಾರ್ತೆಯ ಕೇಳಿ ಸಕಲ ಜನರ ಕೂಡಿ ಕರೆಯೆ ರಾಜ ||

  - type: ''
    number: 14
    kn:
    |
      ಮುದದಿಂದ ಎದುರುಗೊಂಡು ಪರಿಮಳ ಪೂಸಿ ಸದಮಲ ಹೃದಯನ ಕರೆತಂದರು ಮನೆಗೆ |
      ಪದ್ಮನಾಭನ ಪೀಠದಲಿ ಕುಳ್ಳಿರಿಸಿ ಮಧುರ ಮಾತಿಲಿ ತನ್ನ ತರುಣಿ ಒಡಗೂಡಿ ||

  - type: ''
    number: 15
    kn:
    |
      ಹೇನ ಕುಂಭಗಳಿಂದ ದ್ವಿಜರ ಕೈಯೊಳು ಸ್ವಾಮಿಪುಷ್ಕರಣಿ ತೋಯವನ್ನೇ ತರಿಸಿ |
      ಹೇಮತಟ್ಟೆಯಲ್ಲಿ ಸ್ವಾಮಿ ಪಾದವನ್ನಿಟ್ಟು ಪ್ರೇಮದಿಂದಭಿಷೇಕ ಮಾಡಿದನು ರಾಜ ||

  - type: ''
    number: 16
    kn:
    |
      ಚಿನ್ನದ ಕಿರೀಟ ಆಭರಣವನ್ನಿಟ್ಟು ಕನ್ಯಾದಾನವ ಮಾಡಿ ಧನ್ಯನಾದ |
      ತನ್ನ ಮಗಳನೆ ಶ್ರೀನಿವಸಗೆ ಒಪ್ಪಿಸಿ ಉನ್ನತ ಪದವಿಯಂ ಚೆನ್ನಾಗಿ ಪಡೆದ ||

  - type: ''
    number: 17
    kn:
    |
      ಮಾವನಪ್ಪಣೆನೊಂಡು ಮೈದಗೊಸ್ತ್ರವ ಕೊಟ್ಟು ಭಾವಶುದ್ದದಿ ತನ್ನ ಮಾವಗೊಂದಿಸಿದ |
      ಯಾವಾಗ ಕರೆದರೂ ಬರುವೆನು ನಾನೆಂದು ಪಾವನ್ನ ಮಾಡೆಂದು ಧರಣೀಗೊಂದಿಸಿದ ||

  - type: ''
    number: 18
    kn:
    |
      ಅಷ್ಟಗೋಪುರ ಏರಿ ಕಣ್ಣಿಟ್ಟು ನೋಡುತಲಿ ಎಷ್ಟು ಹೇಳಲಿ ಈಕೆ ಸುಕೃತಫಲವೆಂತೋ |
      ಅಜ ರುದ್ರ ಮೊದಲಾದ ಸುರರು ದ್ವಿಜರೆಲ್ಲ ಸುಜನರಂದಣವೇರಿ ಪುರಕೆ ಸಾಗಿದರು ||

  - type: ''
    number: 19
    kn:
    |
      ಆರು ತಿಂಗಳು ಮೀರಿ ಗಿರಿಗೆ ಪೋಗುವೆನೆಂದು ಧೀರ ತಾ ನಿಂತಾನೆ ಕುಂಭಜರಾಶ್ರಮದಿ |
      ಧರೆಯೊಳು ಅಣಕೇರಿ ಸುರಪತಿ ಪ್ರಿಯನಾದ ಸುಗುಣವೇಂಕಟರನ್ನ ಪುರಂದರವಿಠಲ ||
