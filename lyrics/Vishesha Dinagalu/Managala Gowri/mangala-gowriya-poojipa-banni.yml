title_kn: ಮಂಗಳಗೌರಿಯ ಪೂಜಿಪ ಬನ್ನಿ
author_kn: ಮಧ್ವೇಶ ಕೃಷ್ಣನ

# OPTIONAL: Raga, Tala, Ankita
raga_kn:
