# ──────────────────────────────────────────────────────────────────
# Daasa Saahitya - New Song Template
#
# HOW TO USE:
# 1. Copy this file to lyrics/<category>/your-song-name.yml
# 2. Fill in the Kannada fields below
# 3. Commit → GitHub Actions auto-builds the site
#
# The build script auto-transliterates to Tamil, Devanagari, and IAST.
# Only add _ta, _hi, _en fields if you need to CORRECT an auto-transliteration.
# ──────────────────────────────────────────────────────────────────

# REQUIRED: Kannada title and author
title_kn: ರಕ್ಷಿಸೆನ್ನನು ನೀನು ಪಕ್ಷೀಂದ್ರನೆ
author_kn: ಶ್ಯಾಮ ಸುಂದರ ದಾಸರು

# OPTIONAL: Raga, Tala, Ankita
raga_kn: ಬಿಲಹರಿ
tala_kn:
ankita_kn: ಶ್ಯಾಮ ಸುಂದರ ವಿಠಲನ

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ರಕ್ಷಿಸೆನ್ನನು ನೀನು ಪಕ್ಷೀಂದ್ರನೆ 

  # ── Anupallavi ──
  - type: anupallavi
    kn: |
      ರಕ್ಷಿಸೆನ್ನನು | ಪಕ್ಷಿಪ ಕರುಣ ಕ
      ಟಾಕ್ಷದಿಂದೀಕ್ಷಿಸು | ತೀಕ್ಷಣ ಬಿಡದೆ

  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ತಂದೆಯನುಜ್ಞದಿ | ಸಿಂಧೂರ ಕೂರ್ಮ
      ದ್ವಂದ್ವ ಪ್ರಾಣಿಗಳ | ತಿಂದ ಮಹಾತ್ಮ [೧]
      ಅಂದು ಪೀಯೂಷವ | ತಂದು ಮಾತೆಯ
      ಬಂಧನ ಬಿಡಿಸಿದ ಬಂಧುರ ಮಹಿಮ [೨]

  # ── Another Caraṇa ──
  - type: None
    number: 2
    kn: |
      ಗಗನ ಗಮನ ಪನ್ನಗವಗೆ ಪ್ರಾರ್ಥಿಪೆ
      ಮಿಗೆ ಕರುಣದಿ ಯನ್ನಘ ದೂರೋಡಿಸಿ   [೩] 
      ಧಾರಣಿಯೊಳವತಾರ ರಹಿತ ಶೃಂ
      ಗಾರವಾದ ಬಂಗಾರ ಶರೀರ   [೪]

  # ── Subtitle (mid-song heading) ──
  - type: subtitle
  number: 3
    kn: |
      ವಂದಿಪೆ ವಿನುತ ನಂದನ ಶಾಮ
      ಸುಂದರವಿಠಲನ | ಶ್ಯಂದನ ಶೂರ   [೫]
