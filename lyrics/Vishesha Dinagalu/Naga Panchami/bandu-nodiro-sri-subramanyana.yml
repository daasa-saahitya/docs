# ──────────────────────────────────────────────────────────────────
# Daasa Saahitya - New Song Template
#
# HOW TO USE:
# 1. Copy this file to lyrics/<category>/your-song-name.yml
# 2. Fill in the Kannada fields below
# 3. Commit → GitHub Actions auto-builds the site
#
# The build script auto-transliterates to Tamil, Devanagari, and IAST.
# Only add _ta, _hi, _en fields if you need to CORRECT an auto-transliteration.
# ──────────────────────────────────────────────────────────────────

# REQUIRED: Kannada title and author
title_kn: ಬಂದು ನೋಡಿರೋ ಶ್ರೀ ಸುಬ್ರಹ್ಮಣ್ಯನ
author_kn:

# OPTIONAL: Raga, Tala, Ankita
raga_kn: ಮಧ್ಯಮಾವತಿ
tala_kn:
ankita_kn:

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಬಂದು ನೋಡಿರೋ ಶ್ರೀ ಸುಬ್ರಹ್ಮಣ್ಯನ
      ನಂಬಿದವರ ಪೊರೆವನ ಸುರಾಗ್ರಗಣ್ಯನ ||

  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ಶೂರಪದ್ಮ ತಾರಕಾಸುರ ಮಥನ ನಿಪುಣನ
      ಸಾರಧಾರಾ ತೀರ್ಥತಟ ವಿಹಾರನಿರತನ ||
      ನೀರಜಾಸನ ಮಾರವೈರಿ ಶೌರಿಜಾತನ ||
      ನಾರಸಿಂಹನ ಧ್ಯಾನಿಸುತಲಿ ಮುದದಲಿರ್ಪನ 

  # ── Another Caraṇa ──
  - type: None
    number: 2
    kn: |
      ಅನ್ನದಾತ ಭಾಗ್ಯಧಾತನೆಂದು ಖ್ಯಾತನ
      ಅನ್ಯವಾರ್ತೆಗೆರಗದಂತೆ ಮನವ ಮಾಳ್ಪನ ||
      ಉನ್ನತದ ಕುಕ್ಕೆಪುರದಿ ಮುದದಿ ನಿಂದನಾ ||
      ಘನ್ನಮಹಿಮ ವಾಸುಕಿಪ್ರಿಯ ಶೇಷಸಹಿತನ |

  # ── More Caraṇas ──
  - type: None
    number: 3
    kn: |
      ವಿಭುವಿಗೊಲಿದ ವಿಭುದವಂದ್ಯ ಮದನರೂಪನ
      ಶುಭವ ಜನಕೆ ಕರೆದು ಕೊಡುವುದಾರ ಚರಿತನ ||
      ವಿಭವದನನ ಕೂಡೆ ನಿತ್ಯಪೂಜೆಗೊಂಬನ ||
      ಅಭಯವರದನಾದ ನಮ್ಮ ಸ್ಕಂದನ ವಂದ್ಯನ


