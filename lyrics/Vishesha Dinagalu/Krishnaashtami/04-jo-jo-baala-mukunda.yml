# REQUIRED: Kannada title and author
title_kn: ಶ್ರಾವಣ ಅಷ್ಟಮಿ ನಡುರಾತ್ರಿಯಲ್ಲಿ
author_kn: ಶ್ರೀ ವಾದಿರಾಜ ತೀರ್ಥರು

# OPTIONAL: Raga, Tala, Ankita
raga_kn: ಶೋಭಾನೆ ಶೈಲಿ
tala_kn:
ankita_kn: ಹಯವದನ

