# REQUIRED: Kannada title and author
title_kn: 09 ಮಂಗಳಂ ಜಯ ಮಂಗಳಂ
author_kn: ತಿರುಪತಿ ಪಾಂಡುರಂಗಿ ಹುಚ್ಚಾಚಾರ್ಯರು

# OPTIONAL: Raga, Tala, Ankita
raga_kn: ಕಾನಡಾ
tala_kn: ಆದಿ
ankita_kn: ಇಂದಿರೇಶ
 

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಮಂಗಳಂ ಜಯ ಮಂಗಳಂ ||

  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ವರ ಪೀತಾಂಬರನುಟ್ಟಿಹಳು ಜರದಾಕುಪ್ಪಸ ತೊಟ್ಟಿಹಳು |
      ಹರಿತಾ ಹರುಷದಿ ಕರದಲಿ ಮುಡಿಸಿದ ಸುರಸುಮ
      ತುರುಬಿನೊಳಿಟ್ಟಿಹಳು || 

  - type: None
    number: 2
    kn: |
      ಕಡಗ ಕಾಲಂದಿಗೆನಿಟ್ಟಿಹಳು | ನಡುವಿಗಾಭರಣವನಿಟ್ಟಿಹಳು
      ಕೊರಳೊಳು ಅಡ್ಡಿಕೆ ಕಟ್ಟಿಹಳು | ತನ್ನ ಬೆರಳೊಳು
      ಮುದ್ರಿಕೆ ಇಟ್ಟಿಹಳು ।। 

  - type: None
    number: 3
    kn: |
      ಚಂದ್ರಿಕಸಾಧಿಕ ಸನ್ಮುಖಳು | ಮಂದಹಾಸ್ಯರತಿ ಸುರಿಸುವಳು |
      ಇಂದಿರೇಶನ ಪರಮುತ್ಸಂಗದೊಳ್ ಹೊಂದಿ
      ಸಂತತ ಕುಳಿತಿಹಳು II 
