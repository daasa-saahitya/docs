verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಇಂದಿರಾ ದೇವಿಯ ರಮಣ ಬಾವೃಂದಾರಕ ಮುನಿ ವಂದ್ಯ ಬಾ ಶೋಭಾನೇ 

  # ── Anupallavi ──
  - type: anupallavi
    kn: |
      ಸಿಂಧು ಶಯನ ಗೋವಿಂದ ಸದÀಮಲಾನಂದ ಬಾತಂದೆಯ ಕಂದ ಬಾ |
      ಮಾವನಾ ಕೊಂದ ಬಾ ಗೋಪಿಯಕಂದ ಬಾ ಹಸೆಯ ಜಗುಲಿಗೇ ||


  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ಕೃಷ್ಣವೇಣಿಯ ಪಡೆದವನೆ ಬಾಕೃಷ್ಣನ ರಥ ಹೊಡೆದವನೆ ಬಾ ಕೃಷ್ಣೆಯ ಕಷ್ಟವ ನಷ್ಟವ ಮಾಡಿದ ಕೃಷ್ಣನೆ ಬಾ ||
      ಯದುಕುಲ ಶ್ರೇಷ್ಠ ಬಾಸತತ ಸಂತುಷ್ಟನೆ ಬಾಉಡುಪೀಯ ಕೃಷ್ಣ ಬಾ ಹಸೆಯ ಜಗುಲಿಗೇ ||1||


  # ── Another Caraṇa ──
  - type: None
    number: 2
    kn: |
      ಕ್ಷೀರವಾರಿಧಿ ಕುವರಿ ಬಾಸಾರಿದವರಿಗಾಧಾರ ಬಾಮಾರ ಜನನಿ ನಾಗಾರಿ ಮಧ್ಯಳೆ ಹೊಂತಕಾರಿ ಬಾ ||
      ಬಲು ದುರಿತಾರಿ ಬಾಬಹು ವೈಯ್ಯಾರಿ ಬಾಸುಂದರ ನಾರೀ ಬಾ ಹಸೆಯ ಜಗುಲಿಗೇ ||

  - type: None
    number: 3
    kn: |
      ಶ್ರೀ ಭ್ರೂ ದುರ್ಗಾಂಭ್ರಣಿಯೆ ಬಾಶೋಭನ ಗುಣ ಮಣಿ ಖಣಿಯೇ ಬಾಸೌಭಾಗ್ಯದ ಪನ್ನಗವೇಣಿ ಬಾ ||
      ಪರಮ ಕಲ್ಯಾಣಿ ಬಾನಿಗಮಾಭಿಮಾನೀ ಬಾಭಾಗ್ಯದ ನಿಧಿಯೇ ಬಾ ಹಸೆಯ ಜಗುಲಿಗೇ ||
 
  - type: None
    number: 4
    kn: |
      ಪತಿಯಲ್ಲಿ ಅವತರಿಸಿದವಳೆ ಬಾಪತಿಯ ಸಂಗಡ ಜನಿಸಿದವಳೇ ಬಾಸದ್ಗುಣವತಿಯೇ ಬಾ ||
      ಪತಿತ ಪಾವನ ಸಿರಿ ಮೋಹನ ವಿಠಲನ ಸತಿಯೇ ಬಾವೇದಾವತಿಯೇ ಬಾಬಲು ಪತಿವ್ರತೆಯೇ ಬಾ ಹಸೆಯ ಜಗುಲಿಗೇ ||
