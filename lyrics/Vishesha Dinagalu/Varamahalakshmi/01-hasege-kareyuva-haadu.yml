# REQUIRED: Kannada title and author
title_kn: 01 ಲಕ್ಷ್ಮೀ ಬಾರಮ್ಮ ಮುತ್ತೈದೆ ಬಾರಮ್ಮ
author_kn: ಕಮಲನಾಭ ದಾಸರು

# OPTIONAL: Raga, Tala, Ankita
raga_kn: ಮಧ್ಯಮಾವತಿ
tala_kn: ಆದಿ
ankita_kn: ಕಮಲನಾಭ ವಿಠ್ಠಲ

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಲಕ್ಷ್ಮೀ ಬಾರಮ್ಮ ಮುತ್ತೈದೆ ಬಾರಮ್ಮ || 

  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ಲಕ್ಷ್ಮೀ ರಮಣನ ವಕ್ಷಸ್ಥಳದಲಿ |
      ರಕ್ಷಿತಳಾದ ಸುಲಕ್ಷಣ ದೇವಿ || 


  # ── Another Caraṇa ──
  - type: None
    number: 2
    kn: |
      ಗೆಜ್ಜೆಯ ಕಾಲಿನ ನಾದಗಳಿಂದಲಿ |
      ಸಜ್ಜನರಿಗೆ ನೀ ಅಭಯವ ಕೊಡುತಲಿ || 


  - type: None
    number: 3
    kn: |
      ಕಮಲನಾಭ ವಿಠ್ಠಲನೊಡಗೂಡುತ |
      ಭ್ರಮರ ಕುಂತಳೆ ಸೌಭಾಗ್ಯದ ನಿಧಿಯೆ || 

