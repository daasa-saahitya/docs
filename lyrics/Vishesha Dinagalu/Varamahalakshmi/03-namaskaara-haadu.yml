# ──────────────────────────────────────────────────────────────────
# Daasa Saahitya - New Song Template
#
# HOW TO USE:
# 1. Copy this file to lyrics/<category>/your-song-name.yml
# 2. Fill in the Kannada fields below
# 3. Commit → GitHub Actions auto-builds the site
#
# The build script auto-transliterates to Tamil, Devanagari, and IAST.
# Only add _ta, _hi, _en fields if you need to CORRECT an auto-transliteration.
# ──────────────────────────────────────────────────────────────────

# REQUIRED: Kannada title and author
title_kn: 03 ತಾಯೇ ನಿನ ಪದತೋಯಜ
author_kn: ತಪ್ರಾಣೇಶ ದಾಸರು

# OPTIONAL: Raga, Tala, Ankita
raga_kn: ಸೆಂಜುರುಟ್ಟಿ
tala_kn: ಆದಿ
ankita_kn: ಪ್ರಾಣೇಶ ವಿಠ್ಠಲ

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ತಾಯೇ ನಿನ ಪದತೋಯಜಕೆರಗುವೆ |
      ಮಾಯದೇವಿ ಹರಿಕಾಯನಿವಾಸೆ |
      
  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ಬುದ್ಧಿಯ ಪ್ರೇರಿಸೆ ಪ್ರದ್ಯುಮ್ನನ ಸತಿ
      ಕರ್ದಮಜಾಲಯೆ ಭದ್ರಶರೀರೆ ||

  # ── Another Caraṇa ──
  - type: None
    number: 2
    kn: |
      ಇಂಗಡಲಾತ್ಮಜೆ ಅಂಗನಕುಲಮಣಿ
      ರಂಗನ ಪದಕಂಜಭೃಂಗೆ ಕರುಣದಿ ||
      
  - type: None
    number: 3
    kn: |
      ಪ್ರಾಣೇಶವಿಠಲನ ಮಾನಿನಿ ಎನ್ನಯ
      ಹೀನತೆಯೆಣಿಸದೆ ಪೋಣಿಸಿಮತಿಯ||
