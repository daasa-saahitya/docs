# REQUIRED: Kannada title and author
title_kn: ಹೂವ ಕೊಡೆ ನೀ ವರವ ಕೊಡೆ
author_kn: ಹರಪನಹಳ್ಳಿ ಭೀಮವ್ವ

# OPTIONAL: Raga, Tala, Ankita
raga_kn:
tala_kn:
ankita_kn: ಭೀಮೇಶಕೃಷ್ಣ

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಹೂವ ಕೊಡೆ ನೀ ವರವ ಕೊಡೆ
      ದೇವಿ ನಿನ್ನಯ ಮುಡಿಮ್ಯಾಲಿದ್ದ ಮಲ್ಲಿಗೆ||



  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ಕಟ್ಟ್ಟುವೊ ತೊಟ್ಟ್ಟಿಲ್ಹುಟ್ಟುವೊ ಗಂಡು ಮಕ್ಕಳು
      ಮುತ್ತೈದೆತನವ ಮುದದಿಂದ
      ಮುತ್ತೈದೆತನವ ಮುದದಿ ಬೇಡುವೆ
      ಶ್ರೀ ಮಾಲಕ್ಷ್ಮಿಯೆ ನಮಗೆ ದಯಮಾಡೆ ||


  # ── Another Caraṇa ──
  - type: None
    number: 2
    kn: |
      ಅಂದಣ ರಥ ಬಂದ್ಹೋಗುವೋ ಹೆಣ್ಣು ಮಕ್ಕಳು
      ಬಂಧುಗಳಿಗೆಲ್ಲ ಬಲುಕ್ಷೇಮ
      ಬಂಧುಗಳಿಗೆಲ್ಲ ಬಲುಕ್ಷೇಮ ಇರುವಂತೆ
      ಇಂದಿರಾದೇವಿ ದಯಮಾಡೆ ||


  - type: None
    number: 3
    kn: |
      ದಂಪತಿ ನಲಿಸುತ ಸಂಪತ್ತು ಸೌಭಾಗ್ಯ
      ಇಂಥ ಮಂದಿರಕೆ ಬಹುಮಾನ
      ಇಂಥ ಮಂದಿರಕೆ ಬಹುಮಾನಯಿರುವಂತೆ
      ಸಂತೋಷದಿ ವರವ ದಯಮಾಡೆ ||

  - type: None
    number: 4
    kn: |
      ಅನ್ನ ಗೋವ್ಗಳು ದಿವ್ಯ ಕನ್ಯಾ ಭೂದಾನ
      ಹಿರಣ್ಯದಾನಗಳ ಹಿತದಿಂದ 
      ಹಿರಣ್ಯದಾನಗಳ ಹಿತದಿಂದ ಮಾಡುವಂತೆ 
      ಸಂಪನ್ನ ನೀ ವರವ ದಯಮಾಡೆ ||

 
  - type: None
    number: 5
    kn: |
      ಇಂದಿಗೆ ಮನೋಭೀಷ್ಟ ಎಂದೆಂದಿಗೆ ನಿನಪಾದ
      ಹೊಂದಿರಲೆಂದೂ ಮರೆಯದೆ
      ಹೊಂದಿರಲೆಂದೂ ಮರೆಯದೆ ಭೀಮೇಶಕೃಷ್ಣನ
     ಅರ್ಧಾಂಗಿ ನೀ ವರವ ದಯಮಾಡೆ ||


