# Daasa Saahitya - lyrics (aligned by scripts/align.py)

title_kn: 04 ಹೂವ ಮುಡಿಸಿದ ಸ್ವಾಮಿ ರುಕ್ಮಿಣಿ
author_kn: ಹರಪನಹಳ್ಳಿ ಭೀಮವ್ವ
category:
  - Sampradaya Haadu
on_who:
  - Devi
types: []
raga_kn: ಆರಭಿ
tala_kn: ಆದಿ
ankita_kn: ಭೀಮೇಶಕೃಷ್ಣ
verses:
  - type: pallavi
    kn:
    |
      ಹೂವ ಮುಡಿಸಿದ ಸ್ವಾಮಿ ರುಕ್ಮಿಣಿ
      ಭಾಮೇರಿಬ್ಬರಿಗೆ ರಂಗಯ್ಯ ||

  - type: charana
    number: 1
    kn:
    |
      ಬಂದು ರುಕ್ಮಿಣಿ ಭಾಮೇರಿಂದತಿ
      ಸಂಭ್ರಮ್ಮದಿಂದ ರಂಗಯ್ಯ
      ಕುಂದಣದ ಹಸೆಮ್ಯಾಲೆ ಕುಳಿತಿರೆ
      ಚೆಂದದಲಿ ನಗುತ
      ಚಂದ್ರವದನ ತಾ ಚತುರ್ಭುಜದಿಂದಲಿ
      ಅಂಗನೆಯರ ಆಲಿಂಗನೆ ಮಾಡುತ ||

  - type: ''
    number: 2
    kn:
    |
      ಹೂವ ಮುಡಿಸುತ ವಾರಿಜಾಕ್ಷೇರ ವಾರೆನೋಟದಿ
      ನೋಡಿ ನಗುತ ರಂಗಯ್ಯ
      ಸಾರಸಮುಖಿ ಸಹಿತ ಸರಸ-
      ವಾಡುತ ನಾರದರು
      ನಮ್ಮಿಬ್ಬರ ಕದನಕೆ ಹೂಡಿದರೆ
      ಹುಚ್ಚಾದಿರೆಂದೆನುತ ||

  - type: ''
    number: 3
    kn:
    |
      ಮಲ್ಲೆ ಮಲ್ಲಿಗೆಮೊಗ್ಗು ಶಾವಂತಿಗೆ
      ಕಲ್ಲಾ ್ಹರದ ಕಮಲ ರಂಗಯ್ಯ
      ಒಳ್ಳೆ ತಾವರೆ ಅರಳು ಮೊಗ್ಗುಗಳು
      ಝಲ್ಲೆ ಕುಸುಮಗಳು
      ಎಲ್ಲ ತನಕೈಯಲ್ಲಿ ಪಿಡಿದು ಚೆಲ್ವ ಭೀ-
      ಮೇಶ ಕೃಷ್ಣ ರುಕ್ಮಿಣಿಗೆ ||
