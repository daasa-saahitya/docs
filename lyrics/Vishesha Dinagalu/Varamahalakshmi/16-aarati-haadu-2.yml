# REQUIRED: Kannada title and author
title_kn: ಮಂಗಳವೆನ್ನಿ ಮಹಾಲಕ್ಷ್ಮಿಗೆ ಈಗ
author_kn: ಹರಪನಹಳ್ಳಿ ಭೀಮವ್ವ

# OPTIONAL: Raga, Tala, Ankita
raga_kn:
tala_kn:
ankita_kn: ಭೀಮೇಶಕೃಷ್ಣ 

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಮಂಗಳವೆನ್ನಿ ಮಹಾಲಕ್ಷ್ಮಿಗೆ ಈಗ||

  - type: anupallavi
    kn: |
      ಶ್ರೀರಂಗನರಸಿ ಮಹಾದೇವಿಗೆ ಬೇಗ||

  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ಸಿಂಧುನಂದನೆಗೆ ನಂದನಂದನೆದೆಯಲ್ಲಿ
      ಹೊಂದಿಕೊಂಡಿರುವಂಥ ಸುಂದರ ಸಿರಿಗೆ||

  # ── Another Caraṇa ──
  - type: None
    number: 2
    kn: |
      ವರಮಣಿ ವೈಜಯಂತಿ ಹರಿ ಶ್ರೀವತ್ಸದಲ್ಲಿ
      ಸರಸವಾಗಿರುವಂಥ ವರಮಹಾಲಕ್ಷ್ಮಿಗೆ||

  - type: None
    number: 3
    kn: |
      ಹೆರಳು ಬಂಗಾರ ರಾಗಟೆ ಗೊಂಡ್ಯ ಕ್ಯಾದಿಗೆ
      ಅರಳು ಮಲ್ಲಿಗೆ ಮೊಗ್ಗು ವರವ ಕೊಡೆನಗೆ||


  - type: None
    number: 4
    kn: |
      ರಂಗನರಸಿ ಬೆಳ್ಳಿ ಬಂಗಾರವೆನಗಿತ್ತು
      ಕಂಗಳಿಂದಲಿ ನೋಡಿ ಮಂಗಳ ನೀಡೆ||

  - type: None
    number: 5
    kn: |
      ಆದಿನಾರಾಯಣ ಅನಂತಗುಣ ಪರಿಪೂರ್ಣನಾದ
      ಭೀಮೇಶಕೃಷ್ಣನರಸಿ ರುಕ್ಮಿಣಿಗೆ||


