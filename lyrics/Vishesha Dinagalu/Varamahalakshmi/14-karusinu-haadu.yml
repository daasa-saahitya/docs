title_kn: ಕಲ್ಯಾಣಿ ಪೂರ್ಣೆ ಕರುಣಿಸು । ವರಮಹಾಲಕ್ಷ್ಮೀ ॥ 
author_kn: ಜಯೇಶವಿಠಲ ದಾಸರ 

