# REQUIRED: Kannada title and author
title_kn: ಹೂವ ಮುಡಿಸಿರೆ ಮುಡಿಗ್ಹರಸುತಲಿ
author_kn: ಹರಪನಹಳ್ಳಿ ಭೀಮವ್ವ

# OPTIONAL: Raga, Tala, Ankita
raga_kn:
tala_kn:
ankita_kn: ಭೀಮೇಶಕೃಷ್ಣ

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಹೂವ ಮುಡಿಸಿರೆ ಮುಡಿಗ್ಹರಸುತಲಿ
      ಮುತ್ತೈದೆಯಾಗೆನುತ
      ಹೂವ ಮುಡಿಸಿರೆ ಮುಡಿಗ್ಹರಸುತಲಿ|| 


  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ಮರುಗ ಮಲ್ಲಿಗೆ ಜಾಜಿ ಸುರಗಿ ಶಾವಂತಿಗೆ
      ಸುರಪಾರಿಜಾತ ಸಂಪಿಗೆ ಸತ್ಯಭಾಮೆಗೆ ||


  # ── Another Caraṇa ──
  - type: None
    number: 2
    kn: |
      ಅರಿಷಿಣ ಕುಂಕುಮ ಬೆರೆಸಿದ ಮಲ್ಲಿಗೆ
      ಸುರಪಾರಿಜಾತ ಪುನ್ನಾಗ ಪುಷ್ಪಗಳ ||


  - type: None
    number: 3
    kn: |
      ಕಹೆರಳು ಬಂಗಾರ ರಾಗಟೆ ಗೊಂಡ್ಯ ಕ್ಯಾದಿಗೆ
      ಅರಳು ಮಲ್ಲಿಗೆಯ ಭೀಮೇಶಕೃಷ್ಣನ ಸತಿಗೆ||

