#
# HOW TO USE:
# 1. Copy this file to lyrics/<category>/your-song-name.yml
# 2. Fill in the Kannada fields below
# 3. Commit → GitHub Actions auto-builds the site
#
# The build script auto-transliterates to Tamil, Devanagari, and IAST.
# Only add _ta, _hi, _en fields if you need to CORRECT an auto-transliteration.
# ──────────────────────────────────────────────────────────────────

# REQUIRED: Kannada title and author
title_kn: ಬಂದಾಳೋ ಭಾಗ್ಯಲಕ್ಷ್ಮೀ 
author_kn: ಪುರಂದರ ದಾಸರು

# OPTIONAL: Raga, Tala, Ankita
raga_kn:
tala_kn:
ankita_kn: ಪುರಂದರ ವಿಠಲ

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ಬಂದಾಳೋ ಭಾಗ್ಯಲಕ್ಷ್ಮೀ ನಮ್ಮ ಮನೆಗೆ |
      ಸಂದೇಹವಿಲ್ಲದ ಹಾಗೆ ||


  # ── Caraṇa with tala name ──
  - type: anupallavi
    kn: |
      ಬಂದಾಳೂ ನಮ್ಮ ಮನೆಗೆ | ನಿಂದಾಳೂ ಗೃಹದಲ್ಲಿ
      ನಂದನಂದನರಾಣಿ ಇಂದಿರೇಶನ ಸಹಿತ ||


  # ── Another Caraṇa ──
  - type: charana
    number: 1
    kn: |
      ಹೆಜ್ಜೆಯ ಮೇಲೆ ಹೆಜ್ಜೆನಿಕ್ಕುತ |
      ಗೆಜ್ಜೆಯ ಕಾಲ ಘಲು ಘಲು ಘಲುರೆನ್ನುತಾ ||
      ಮೂರ್ಜಗ ಮೋಹಿಸುತ ಮುರಹರಿಯ ರಾಣಿ |
      ಸಂಪತ್ತು ಕೊಡಲಿಕ್ಕೆಂದು ವೆಂಕಟೇಶನ ಸಹಿತ ||


  - type: None
    number: 2
    kn: |
      ಮಾಸ ಶ್ರಾವಣ ಮಾಸವು |
      ಶುಕ್ರವಾರ ಪೌರ್ಣಿಮೆದಿನ ಮುನ್ನ ||
      ಭೂಸುರರೆಲ್ಲ ಕೂಡಿ ಸಾಸಿರ ನಾಮಪಾಡಿ |
      ವಾಸವಾಗಿರಲಿಕ್ಕೆ ವಾಸುದೇವನ ಸಹಿತ ||

  - type: None
    number: 3
    kn: |
      ಕನಕವಾಯಿತು ಮಂದಿರ |
      ಜನನಿ ಬರಲು | ಜಯ ಜಯ ಜಯ ವೆನ್ನಿರೊ ||
      ಸನಕಾದಿ ಮುನಿಗಳ ಸೇವೆಯನ್ನು ಸ್ವೀಕರಿಸಿ |
      ಕನಕವಲ್ಲಿಯು ತನ್ನ ಕಾಂತನ್ನ ಕೂಡಿಕೊಂಡು ||

  - type: None
    number: 4
    kn: |
      ಉಟ್ಟ ಪೀತಾಂಬರವು | ಹೊಳೆಯುತ್ತ |
      ಕರದಲ್ಲಿ ಘಟ್ಟಿ ಕಂಕಣವನು ಪಿಡಿಯುತ್ತ |
      ಸೃಷ್ಠಿಗೊಡೆಯ ನಮ್ಮ ಪುರಂದರ ವಿಠಲನ |
      ಪಟ್ಟದರಸಿನಮಗೆ ಇಷ್ಟಾರ್ಥ ಕೊಡಲಿಕೆಂದು||
