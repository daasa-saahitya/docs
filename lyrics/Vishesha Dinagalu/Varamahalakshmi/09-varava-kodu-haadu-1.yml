# REQUIRED: Kannada title and author
title_kn: ವರವ ಕೊಡೆ ವಾರಿಜಾಕ್ಷಿ
author_kn: ಹರಿದಾಸಿನಿ ಅಂಬಾಬಾಯಿ

# OPTIONAL: Raga, Tala, Ankita
raga_kn:
tala_kn:
ankita_kn: ಗೋಪಾಲ ಕೃಷ್ಣ ವಿಠ್ಠಲ

# OPTIONAL: Override auto-transliteration (leave empty = auto-generated)
# title_ta:
# title_hi:
# title_en:
# author_ta:
# author_hi:
# author_en:

verses:
  # ── Pallavi ──
  - type: pallavi
    kn: |
      ವರವ ಕೊಡೆ ವಾರಿಜಾಕ್ಷಿ ನೀರೆ ತುಳಸಿಯೆ
      ಕರಕರೆಯಗೊಳಿಸಬೇಡೆ ಕರುಣ ಪೂರ್ಣಳೆ ||


  # ── Caraṇa with tala name ──
  - type: charana
    number: 1
    kn: |
      ಸಿರಿವರನ ಸಹಿತ ನಿನ್ನ ಪೂಜಿಪೆ ಮುನ್ನ
      ಪರಿಪರಿಯ ಧೂಪ ದೀಪ ಗಂಧಾಕ್ಷತೆಗಳಿಂ ||

  # ── Another Caraṇa ──
  - type: None
    number: 2
    kn: |
      ವಾರಿಜಾಕ್ಷಿ ಷಡ್ರಸಗಳ ಆರೋಗಣೆ ಕೊಳ್ಳೆ
      ನಾರಿ ನಿನಗೆ ಸರ್ವವಿಧದಿ ನಾನು ಎರಗುವೆ ||

  - type: None
    number: 3
    kn: |
      ಸಿರಿವರ ಗೋಪಾಲಕೃಷ್ಣವಿಠ್ಠಲನರಸಿಯೆ
      ಕರದು ಎನಗೆ ಸರ್ವಾಭೀಷ್ಟ ಕೊಟ್ಟು ಪಾಲಿಸೆ||

 



