# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ಶ್ರೀಮಧ್ವರಾಯರ ಸೇವೆ ದೊರಕುವದು
author_kn: ಪುರಂದರ ದಾಸರು
category: [Dasara Pada]
on_who: [Madhwacharya]
types: []
festivals: []
raga_kn: ಪೀಲು
tala_kn: ಆದಿ ತಾಳ
ankita_kn: ಪುರಂದರ ವಿಠಲ
verses:
  - type: pallavi
    kn: |
      ಶ್ರೀಮಧ್ವರಾಯರ ಸೇವೆ ದೊರಕುವುದು 
      ಜನುಮ ಸಫಲ ಕಾಣಿರೋ
 
  - type: anupallavi
    kn: |
      ಶ್ರೀಮದಾನಂದ ತೀರ್ಥರ ಪಾದ 
      ನೆನೆವವರು ಸಾಮಾನ್ಯ 
      ನರರೇ ಕಾಣಿ ಬೊಮ್ಮನ ಆಣೆ ||

  - type: charana
    number: 1
    kn: |
      ಜಗವು ಸತ್ಯವು ಅಲ್ಲ ಜಡಜೀವ ಬೇಧವಿಲ್ಲ 
      ಅಗುಣನು ಪರಬೊಮ್ಮನು 
      ಹೀಗೆ ನುಡಿವ ಜನರ ನಿಗಮ ಶಾಸ್ತ್ರದಿ ಗೆದ್ದು 
      ಜಗಸತ್ಯ ಸುಗುಣ ಬ್ರಹ್ಮ ಎಂದು ಪೇಳುವ||

  - type: ''
    number: 2
    kn: |
      ಹರಿ ಸರ್ವೋತ್ತಮ ನಿತ್ಯ ತರುವಾಯ ರಮಾದೇವಿ 
      ತರುವಾಯ ವಿಧಿಪ್ರಾಣರು 
      ಸರಸ್ವತಿ ಭಾರತಿ ಗರುಡ ಅನಂತ ರುದ್ರ 
      ತರುವಾಯ ಆರು ರುದ್ರ ದೇವಿಗಳು ||

  - type: ''
    number: 3
    kn: |
      ಸೌಪರ್ಣಿ ವಾರುಣಿ ಅಪರ್ಣಿಯರು ಸಮರು 
      ದ್ಯುಪವಿ ಮನ್ವಾದಿಗಳು 
      ಈ ಪರಿ ತಾರತಮ್ಯ ಜಪಧ್ಯಾನಾರ್ಚನೆಯಿಂದ 
      ಅಪವರ್ಗದವನ ಸೇವೆಯ ಮಾಡಿರೋ ಎಂತೆಂಬ ||
  
  - type: ''
    number: 4
    kn: |
      ಒಂದೊಂದು ಯುಗದಲ್ಲಿ ಅನಂತ ಸೇವೆಯ ಮಾಡಿ 
      ಚಂದದಿಂದಲಿ ಲಾಲಿಸಿ 
      ಇಂದಿರಾರಮಣ ಗೋವಿಂದನೆ ದೈವವೆಂದು 
      ಸಂದೇಹವಿಲ್ಲದೆ ಸಾಧಿಸಿ ಮಾಯಿಗಳ ಸೋಲಿಸಿ ||

  - type: ''
    number: 5
    kn: |
      ಹಿಮಗಿರಿಯಿಂದ ಸೇತುವೆಯ ಪರ್ಯಂತರ 
      ಭ್ರಮಿಸುವ ಸುಜನರಿಗೆ
      ಕ್ರಮತತ್ವ ಬೋಧಿಸಿ ಕಮಲನಾಭನ 
      ಮೂರ್ತಿ ಕ್ರಮವರಿತು ಸ್ಥಾಪಿಸಿ ಪೂಜಿಸಿರೆಂದ ||
  
  - type: ''
    number: 6
    kn: |
      ಭೂತಳದೊಳು ರೌಪ್ಯಪುರದಿ ನೆಲೆಸಿ ಗೆದ್ದು 
      ಧಾತ್ರಿ ಮುದ್ರೆಯ ತೋರಿಸಿ
      ಈತನೇ ಹನುಮಂತ, ಈತನೇ ಭೀಮಸೇನ 
      ಈತನೇ ಭವಿಷ್ಯದ ಬ್ರಹ್ಮ ದೇವೋತ್ತಮ ||
        
  - type: ''
    number: 7
    kn: |
      ಶ್ರೀಮದಾನಂದನೇ ಅನಂತ ಕಾಲಕೆ ಎಂದು 
      ಯಮಕ ಭಾರತ ತೋರಿಸಿ 
      ಸ್ವಾಮಿ ಸರ್ವಾಂತರ್ಯಾಮಿ ಸರ್ವಗುಣ ಪರಿಪೂರ್ಣ 
      ಪ್ರೇಮಿ ಪುರಂದರ ವಿಠಲನ ದಾಸನಾದ||
