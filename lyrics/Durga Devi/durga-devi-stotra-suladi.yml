    hi: |
      श्रीदुर्गादेवी स्तोत्र सुळादि
      श्रीदुर्गादेवी स्तोत्र सुळादि
      दुर्गा दुर्गेये महदुष्टजन संहारे
      दुर्गान्तर्गत दुर्गे दुर्लभे सुलभे
      दुर्गमवागिदे निन्न महिमे बोम्म
      भर्गादिगळिगेल्ल गुणिसिदरू
      स्वर्ग भूमि पाताळ व्यापुत देवि
      वर्गक्के मीरिद बलु सुन्दरी
      दुर्गणदवर बाधे बहळवागिदे तायि
      दुर्गतिहारे नानु पेळुवुदेनु
      दुर्गन्धवागिदे संसृति नोडिदरे
      निर्गम ना काणेनम्म मङ्गळाङ्गे
      दुर्गे हे दुर्गे महा दुर्गे भूदुर्गे विष्णु
      दुर्गे दुर्जय दुर्धक्षे शक्ति
      दुर्गकानन गहन पर्वतघोर सर्प
      गर्गर शब्द व्याघ्र करडि मृत्यु
      वर्ग भूत प्रेत पैशाचि मोदलाद
      दुर्गण सङ्कट प्राप्तवागे
      दुर्गादुर्गे एन्दु उच्चस्वरदिन्द
      निर्गळितवागि ओम्मे कूगिदरू
      स्वर्गापवर्गदल्लि हरियोडने इद्दरू
      सुर्गण जय जयवेन्दु पोगळुतिरे
      कर्गळिन्दलि एत्ति साकुव साक्षि भूते
      निर्गुडिदन्ते लोक लीले निनगे
      स्वर्गङ्गाजनक नम्म विजय विठ्ठलनङ्घ्रि
      दुर्गाश्रम माडि बदुकुवन्ते माडु ||
    en: |
      śrīdurgādēvī stōtra suḷādi
      śrīdurgādēvī stōtra suḷādi
      durgā durgeye mahaduṣṭajana saṃhāre
      durgāntargata durge durlabhe sulabhe
      durgamavāgide ninna mahime bomma
      bhargādigaḷigella guṇisidarū
      svarga bhūmi pātāḷa vyāputa dēvi
      vargakke mīrida balu sundarī
      durgaṇadavara bādhe bahaḷavāgide tāyi
      durgatihāre nānu pēḷuvudēnu
      durgandhavāgide saṃsṛti nōḍidare
      nirgama nā kāṇenamma maṅgaḷāṅge
      durge he durge mahā durge bhūdurge viṣṇu
      durge durjaya durdhakṣe śakti
      durgakānana gahana parvataghōra sarpa
      gargara śabda vyāghra karaḍi mṛtyu
      varga bhūta prēta paiśāci modalāda
      durgaṇa saṅkaṭa prāptavāge
      durgādurge endu uccasvaradinda
      nirgaḷitavāgi omme kūgidarū
      svargāpavargadalli hariyoḍane iddarū
      surgaṇa jaya jayavendu pogaḷutire
      kargaḷindali etti sākuva sākṣi bhūte
      nirguḍidante lōka līle ninage
      svargaṅgājanaka namma vijaya viṭhṭhalanaṅghri
      durgāśrama māḍi badukuvante māḍu ||

  - type: None
    number: 2
    subtitle_kn: ಮಟ್ಟತಾಳ
    subtitle_ta: மட்டதாள
    subtitle_hi: मट्टताळ
    subtitle_en: maṭṭatāḷa
    kn: |
      ಅರಿದರಾಂಕುಶ ಶಕ್ತಿ ಪರಶು ನೇಗಲಿಖಡ್ಗ
      ಸರಸಿಜ ಗದೆ ಮುದ್ಗರ ಚಾಪ ಮಾರ್ಗಣ
      ವರ ಅಭಯ ಮುಸಲ ಪರಿ ಪರಿ ಆಯುಧವ
      ಧರಿಸಿ ಮೆರೆವ ಲಕುಮಿ ಸರಸಿಜ ಭವ ರುದ್ರ
      ಸರುವ ದೇವತೆಗಳ ಕರುಣಾಪಾಂಗದಲ್ಲಿ
      ನಿರೀಕ್ಷಿಸಿ ಅವರವರ ಸ್ವರೂಪ ಸುಖಕೊಡುವ
      ಸಿರಿಭೂಮಿ ದುರ್ಗಾ ಸರ್ವೋತ್ತಮ ನಮ್ಮ
      ವಿಜಯ ವಿಠ್ಠಲನಂಘ್ರಿ
      ಪರಮ ಭಕುತಿಯಿಂದ ಸ್ಮರಿಸುವ ಜಗಜ್ಜನನಿ ||
    ta: |
      அரித³ராங்குஶ ஶக்தி பரஶு நேக³லிக²ட்³க³
      ஸரஸிஜ க³தெ³ முத்³க³ர சாப மார்க³ண
      வர அப⁴ய முஸல பரி பரி ஆயுத⁴வ
      த⁴ரிஸி மெரெவ லகுமி ஸரஸிஜ ப⁴வ ருத்³ர
      ஸருவ தே³வதெக³ள கருணாபாங்க³த³ல்லி
      நிரீக்ஷிஸி அவரவர ஸ்வரூப ஸுக²கொடு³வ
      ஸிரிபூ⁴மி து³ர்கா³ ஸர்வோத்தம நம்ம
      விஜய விட்²ட²லனங்க்⁴ரி
      பரம ப⁴குதியிந்த³ ஸ்மரிஸுவ ஜக³ஜ்ஜனனி ||
    hi: |
      अरिदराङ्कुश शक्ति परशु नेगलिखड्ग
      सरसिज गदे मुद्गर चाप मार्गण
      वर अभय मुसल परि परि आयुधव
      धरिसि मेरेव लकुमि सरसिज भव रुद्र
      सरुव देवतेगळ करुणापाङ्गदल्लि
      निरीक्षिसि अवरवर स्वरूप सुखकोडुव
      सिरिभूमि दुर्गा सर्वोत्तम नम्म
      विजय विठ्ठलनङ्घ्रि
      परम भकुतियिन्द स्मरिसुव जगज्जननि ||
    en: |
      aridarāṅkuśa śakti paraśu nēgalikhaḍga
      sarasija gade mudgara cāpa mārgaṇa
      vara abhaya musala pari pari āyudhava
      dharisi mereva lakumi sarasija bhava rudra
      saruva dēvategaḷa karuṇāpāṅgadalli
      nirīkṣisi avaravara svarūpa sukhakoḍuva
      siribhūmi durgā sarvōttama namma
      vijaya viṭhṭhalanaṅghri
      parama bhakutiyinda smarisuva jagajjanani ||

  - type: None
    number: 3
    subtitle_kn: ತ್ರಿಪುಟತಾಳ
    subtitle_ta: த்ரிபுடதாள
    subtitle_hi: त्रिपुटताळ
    subtitle_en: tripuṭatāḷa
    kn: |
      ಸ್ತುತಿ ಮಾಡುವೆ ನಿನ್ನ ಕಾಳಿ ಮಹಾಕಾಳಿ ಉ
      ನ್ನತ ಬಾಹು ಕರಾಳವದನೆ ಚಂದಿರೆ ಮುಖೆ
      ಧೃತಿ ಶಾಂತಿ ಬಹುರೂಪೆ ರಾತ್ರಿ ರಾತ್ರಿ ಚರಣೆ
      ಸ್ಥಿತಿಯೆ ನಿದ್ರಾಭದ್ರೆ ಭಕ್ತವತ್ಸಲೇ ಭವ್ಯೇ
      ಚತುರಷ್ಟ ದ್ವಿಹಸ್ತೆ ಹಸ್ತಿ ಹಸ್ತಿ ಗಮನೆ ಅ
      ದ್ಭುತ ಪ್ರಬಲೆ ಪ್ರವಾಸೆ ದುರ್ಗಾರಣ್ಯವಾಸೆ
      ಕ್ಷಿತಿಭಾರಹರಣೆ ಕ್ಷೀರಾಬ್ಧಿ ತನಯೆ ಸ
      ದ್ಗತಿ ಪ್ರದಾತೆ ಮಾಯಾ ಶ್ರೀಯೆ ಇಂದಿರೆ ರಮೆ
      ದಿತಿ ಜಾತೆ ನಿಗ್ರಹೆ ನಿರ್ಧೂತ ಕಲ್ಮಷೆ
      ಪ್ರತಿಕೂಲ ಭೇದೆ ಪೂರ್ಣಬೋಧೆ ರೌದ್ರೇ
      ಅತಿಶಯ ರಕ್ತ ಜಿಹ್ವಾಲೋಲೆ ಮಾಣಿಕ್ಯಮಾಲೆ
      ಜಿತಕಾಮೆ ಜನನ ಮರಣ ರಹಿತ ಖ್ಯಾತೆ
      ಘೃತ ಪಾತ್ರ ಪರಮಾನ್ನ ತಾಂಬೂಲ ಹಸ್ತೆ ಸು
      ವ್ರತೆ ಪತಿವ್ರತೆ ತ್ರಿನೇತ್ರೆ ರಕ್ತಾಂಬರೆ
      ಶತಪತ್ರ ನಯನೆ ನಿರುತಕನ್ಯೇ ಉದಯಾರ್ಕ
      ಶತಕೋಟಿ ಸನ್ನಿಭೆ ಹರಿಯಾಂಕಸಂಸ್ಥೆ
      ಶ್ರುತಿತತಿನುತೆ ಶುಕ್ಲ ಶೋಣಿತ ರಹಿತೆ ಅ
      ಪ್ರತಿಹತೆ ಸರ್ವದಾ ಸಂಚಾರಿಣಿ ಹ್ರೀ
      ಉತ್ಪತ್ತಿ ಸ್ಥಿತಿಲಯ ಕರ್ತೆ ಶುಭ್ರಶೋಭನ ಮೂರ್ತೆ
      ಪತಿತಪಾವನೆ ರನ್ನೆ ಸರ್ವೋಷಧಿಯಲಿದ್ದು
      ಹತಮಾಡು ಕಾಡುವ ರೋಗಗಳಿಂದ
      ಕ್ಷಿತಿಯೊಳು ಸುಖದಲ್ಲಿ ಬಾಳುವ ಮತಿಯಿತ್ತು
      ಸತತ ಕಾಯಲಿ ಬೇಕು ದುರ್ಗೇ ದುರ್ಗೇ
      ಚ್ಯುತದೂರ ವಿಜಯ ವಿಠ್ಠಲರೇಯನ ಪ್ರೀಯೆ
      ಕೃತಾಂಜಲಿಯಿಂದಲಿ ತಲೆಬಾಗಿ ನಮಿಸುವೆ ||
    ta: |
      ஸ்துதி மாடு³வெ நின்ன காளி மஹாகாளி உ
      ந்னத பா³ஹு கராளவத³னெ சந்தி³ரெ முகெ²
      தரு⁴தி ஶாந்தி ப³ஹுரூபெ ராத்ரி ராத்ரி சரணெ
      ஸ்தி²தியெ நித்³ராப⁴த்³ரெ ப⁴க்தவத்ஸலே ப⁴வ்யே
      சதுரஷ்ட த்³விஹஸ்தெ ஹஸ்தி ஹஸ்தி க³மனெ அ
      த்³பு⁴த ப்ரப³லெ ப்ரவாஸெ து³ர்கா³ரண்யவாஸெ
      க்ஷிதிபா⁴ரஹரணெ க்ஷீராப்³தி⁴ தனயெ ஸ
      த்³க³தி ப்ரதா³தெ மாயா ஸ்ரீயெ இந்தி³ரெ ரமெ
      தி³தி ஜாதெ நிக்³ரஹெ நிர்தூ⁴த கல்மஷெ
      ப்ரதிகூல பே⁴தெ³ பூர்ணபோ³தெ⁴ ரௌத்³ரே
      அதிஶய ரக்த ஜிஹ்வாலோலெ மாணிக்யமாலெ
      ஜிதகாமெ ஜனன மரண ரஹித க்²யாதெ
      கரு⁴த பாத்ர பரமான்ன தாம்பூ³ல ஹஸ்தெ ஸு
      வ்ரதெ பதிவ்ரதெ த்ரினேத்ரெ ரக்தாம்ப³ரெ
      ஶதபத்ர நயனெ நிருதகன்யே உத³யார்க
      ஶதகோடி ஸன்னிபெ⁴ ஹரியாங்கஸம்ஸ்தெ²
      ஸ்ருதிததினுதெ ஶுக்ல ஶோணித ரஹிதெ அ
      ப்ரதிஹதெ ஸர்வதா³ ஸஞ்சாரிணி ஹ்ரீ
      உத்பத்தி ஸ்தி²திலய கர்தெ ஶுப்⁴ரஶோப⁴ன மூர்தெ
      பதிதபாவனெ ரன்னெ ஸர்வோஷதி⁴யலித்³து³
      ஹதமாடு³ காடு³வ ரோக³க³ளிந்த³
      க்ஷிதியொளு ஸுக²த³ல்லி பா³ளுவ மதியித்து
      ஸதத காயலி பே³கு து³ர்கே³ து³ர்கே³
      ச்யுததூ³ர விஜய விட்²ட²லரேயன ப்ரீயெ
      கருதாஞ்ஜலியிந்த³லி தலெபா³கி³ நமிஸுவெ ||
    hi: |
      स्तुति माडुवे निन्न काळि महाकाळि उ
      न्नत बाहु कराळवदने चन्दिरे मुखे
      धृति शान्ति बहुरूपे रात्रि रात्रि चरणे
      स्थितिये निद्राभद्रे भक्तवत्सले भव्ये
      चतुरष्ट द्विहस्ते हस्ति हस्ति गमने अ
      द्भुत प्रबले प्रवासे दुर्गारण्यवासे
      क्षितिभारहरणे क्षीराब्धि तनये स
      द्गति प्रदाते माया श्रीये इन्दिरे रमे
      दिति जाते निग्रहे निर्धूत कल्मषे
      प्रतिकूल भेदे पूर्णबोधे रौद्रे
      अतिशय रक्त जिह्वालोले माणिक्यमाले
      जितकामे जनन मरण रहित ख्याते
      घृत पात्र परमान्न ताम्बूल हस्ते सु
      व्रते पतिव्रते त्रिनेत्रे रक्ताम्बरे
      शतपत्र नयने निरुतकन्ये उदयार्क
      शतकोटि सन्निभे हरियाङ्कसंस्थे
      श्रुतिततिनुते शुक्ल शोणित रहिते अ
      प्रतिहते सर्वदा सञ्चारिणि ह्री
      उत्पत्ति स्थितिलय कर्ते शुभ्रशोभन मूर्ते
      पतितपावने रन्ने सर्वोषधियलिद्दु
      हतमाडु काडुव रोगगळिन्द
      क्षितियोळु सुखदल्लि बाळुव मतियित्तु
      सतत कायलि बेकु दुर्गे दुर्गे
      च्युतदूर विजय विठ्ठलरेयन प्रीये
      कृताञ्जलियिन्दलि तलेबागि नमिसुवे ||
    en: |
      stuti māḍuve ninna kāḷi mahākāḷi u
      nnata bāhu karāḷavadane candire mukhe
      dhṛti śānti bahurūpe rātri rātri caraṇe
      sthitiye nidrābhadre bhaktavatsalē bhavyē
      caturaṣṭa dvihaste hasti hasti gamane a
      dbhuta prabale pravāse durgāraṇyavāse
      kṣitibhāraharaṇe kṣīrābdhi tanaye sa
      dgati pradāte māyā śrīye indire rame
      diti jāte nigrahe nirdhūta kalmaṣe
      pratikūla bhēde pūrṇabōdhe raudrē
      atiśaya rakta jihvālōle māṇikyamāle
      jitakāme janana maraṇa rahita khyāte
      ghṛta pātra paramānna tāmbūla haste su
      vrate pativrate trinētre raktāmbare
      śatapatra nayane nirutakanyē udayārka
      śatakōṭi sannibhe hariyāṅkasaṃsthe
      śrutitatinute śukla śōṇita rahite a
      pratihate sarvadā sañcāriṇi hrī
      utpatti sthitilaya karte śubhraśōbhana mūrte
      patitapāvane ranne sarvōṣadhiyaliddu
      hatamāḍu kāḍuva rōgagaḷinda
      kṣitiyoḷu sukhadalli bāḷuva matiyittu
      satata kāyali bēku durgē durgē
      cyutadūra vijaya viṭhṭhalarēyana prīye
      kṛtāñjaliyindali talebāgi namisuve ||

  - type: None
    number: 4
    subtitle_kn: ಅಟ್ಟತಾಳ
    subtitle_ta: அட்டதாள
    subtitle_hi: अट्टताळ
    subtitle_en: aṭṭatāḷa
    kn: |
      ಶ್ರೀಲಕ್ಷ್ಮೀಕಮಲಾ ಪದ್ಮಾಪದ್ಮಿನಿ ಕಮ
      ಲಾಲಯೆ ರಮಾ ವೃಷಾಕಪಿ ಧನ್ಯಾವೃದ್ಧಿವಿ
      ಶಾಲಾ ಯಜ್ಞಾ ಇಂದಿರೆ ಹಿರಣ್ಯ ಹರಿಣಿ
      ವಾಲಯ ಸತ್ಯ ನಿತ್ಯಾನಂದ ತ್ರಯಿ ಸುಧಾ
      ಶೀಲೆ ಸುಗಂಧ ಸುಂದರಿ ವಿದ್ಯಾಸುಶೀಲೆ
      ಸುಲಕ್ಷಣ ದೇವಿ ನಾನಾ ರೂಪಂಗಳಿಂದ ಮೆರೆವ ಮೃತ್ಯುನಾಶೆ
      ವಾಲಗಕೊಡು ಸಂತರ ಸನ್ನಿಧಿಯಲ್ಲಿ
      ಕಾಲ ಕಾಲಕೆ ಎನ್ನ ಭಾರ ವಹಿಸುವ ತಾಯಿ
      ಮೇಲು ಮೇಲು ನಿನ್ನ ಶಕ್ತಿ ಕೀರ್ತಿ ಬಲು
      ಕೇಳಿ ಕೇಳಿ ಬಂದೆ ಕೇವಲ ಈ ಮನ
      ಘಾಳಿಯಂತೆ ಪರದ್ರವ್ಯಕ್ಕೆ ಪೊಪುದು
      ಏಳಲ ಮಾಡದೆ ಉದ್ಧಾರ ಮಾಡುವ
      ಕೈಲಾಸಪುರದಲ್ಲಿ ಪೂಜೆಗೊಂಬ ದೇವಿ
      ಮೂಲಪ್ರಕೃತಿ ಸರ್ವ ವರ್ಣಾಭಿಮಾನಿನಿ
      ಪಾಲಸಾಗರಶಾಯಿ ವಿಜಯ ವಿಠ್ಠಲನೊಳು
      ಲೀಲೆ ಮಾಡುವ ನಾನಾಭರಣೆ ಭೂಷಣೆ ಪೂರ್ಣೆ ||
    ta: |
      ஸ்ரீலக்ஷ்மீகமலா பத்³மாபத்³மினி கம
      லாலயெ ரமா வருஷாகபி த⁴ன்யாவருத்³தி⁴வி
      ஶாலா யக்³ஞா இந்தி³ரெ ஹிரண்ய ஹரிணி
      வாலய ஸத்ய நித்யானந்த³ த்ரயி ஸுதா⁴
      ஶீலெ ஸுக³ந்த⁴ ஸுந்த³ரி வித்³யாஸுஶீலெ
      ஸுலக்ஷண தே³வி நானா ரூபங்க³ளிந்த³ மெரெவ மருத்யுனாஶெ
      வாலக³கொடு³ ஸந்தர ஸன்னிதி⁴யல்லி
      கால காலகெ என்ன பா⁴ர வஹிஸுவ தாயி
      மேலு மேலு நின்ன ஶக்தி கீர்தி ப³லு
      கேளி கேளி ப³ந்தெ³ கேவல ஈ மன
      கா⁴ளியந்தெ பரத்³ரவ்யக்கெ பொபுது³
      ஏளல மாட³தெ³ உத்³தா⁴ர மாடு³வ
      கைலாஸபுரத³ல்லி பூஜெகொ³ம்ப³ தே³வி
      மூலப்ரகருதி ஸர்வ வர்ணாபி⁴மானினி
      பாலஸாக³ரஶாயி விஜய விட்²ட²லனொளு
      லீலெ மாடு³வ நானாப⁴ரணெ பூ⁴ஷணெ பூர்ணெ ||
    hi: |
      श्रीलक्ष्मीकमला पद्मापद्मिनि कम
      लालये रमा वृषाकपि धन्यावृद्धिवि
      शाला यज्ञा इन्दिरे हिरण्य हरिणि
      वालय सत्य नित्यानन्द त्रयि सुधा
      शीले सुगन्ध सुन्दरि विद्यासुशीले
      सुलक्षण देवि नाना रूपङ्गळिन्द मेरेव मृत्युनाशे
      वालगकोडु सन्तर सन्निधियल्लि
      काल कालके एन्न भार वहिसुव तायि
      मेलु मेलु निन्न शक्ति कीर्ति बलु
      केळि केळि बन्दे केवल ई मन
      घाळियन्ते परद्रव्यक्के पोपुदु
      एळल माडदे उद्धार माडुव
      कैलासपुरदल्लि पूजेगोम्ब देवि
      मूलप्रकृति सर्व वर्णाभिमानिनि
      पालसागरशायि विजय विठ्ठलनोळु
      लीले माडुव नानाभरणे भूषणे पूर्णे ||
    en: |
      śrīlakṣmīkamalā padmāpadmini kama
      lālaye ramā vṛṣākapi dhanyāvṛddhivi
      śālā yajñā indire hiraṇya hariṇi
      vālaya satya nityānanda trayi sudhā
      śīle sugandha sundari vidyāsuśīle
      sulakṣṇa dēvi nānā rūpaṅgaḷinda mereva mṛtyunāśe
      vālagakoḍu santara sannidhiyalli
      kāla kālake enna bhāra vahisuva tāyi
      mēlu mēlu ninna śakti kīrti balu
      kēḷi kēḷi bande kēvala ī mana
      ghāḷiyante paradravyakke popudu
      ēḷala māḍade uddhāra māḍuva
      kailāsapuradalli pūjegomba dēvi
      mūlaprakṛti sarva varṇābhimānini
      pālasāgaraśāyi vijaya viṭhṭhalanoḷu
      līle māḍuva nānābharaṇe bhūṣaṇe pūrṇe ||

  - type: None
    number: 5
    subtitle_kn: ಆದಿತಾಳ
    subtitle_ta: ஆதி³தாள
    subtitle_hi: आदिताळ
    subtitle_en: āditāḷa
    kn: |
      ಗೋಪಿನಂದನೆ ಮುಕ್ತೆ ದೈತ್ಯ ಸಂತತಿಗೆ ಸಂ
      ತಾಪವ ಕೊಡುತಿಪ್ಪ ಮಹಾಕಠೋರೆ ಉಗ್ರ
      ರೂಪ ವೈಲಕ್ಷಣೆ ಅಜ್ಞಾನಕ್ಕಭಿಮಾನಿನಿ
      ತಪತ್ರಯ ವಿನಾಶ ಓಂಕಾರೆ ಹೂಂಕಾರೆ
      ಪಾಪಿ ಕಂಸಗೆ ಭಯ ತೋರಿದೆ ಬಾಲ ಲೀಲೆ
      ವ್ಯಾಪುತ ಧರ್ಮಮಾರ್ಗ ಪ್ರೇರಣೆ ಅಪ್ರಾಕೃತೆ
      ಸ್ವಾಪದದಲಿ ನಿನ್ನ ನೆನೆಸಿದ ಶರಣನಿಗೆ
      ಅಪಾರವಾಗಿದ್ದ ವಾರಿಧಿಯಂತೆ ಮಹಾ
      ಆಪತ್ತು ಬಂದಿರಲು ಹಾರೆ ಪೋಗೋವು ಸಪ್ತ
      ದ್ವೀಪ ನಾಯಿಕೆ ನರಕ ನಿರ್ಲೇಪೆ ತಮೋಗುಣದ
      ವ್ಯಾಪಾರ ಮಾಡಿಸಿ ಭಕ್ತ ಜನಕೆ ಪುಣ್ಯ
      ಸೋಪಾನ ಮಾಡಿಕೊಡುವ ಸೌಭಾಗ್ಯವಂತೆ ದುರ್ಗೆ
      ಪ್ರಾಪುತವಾಗಿ ಎನ್ನ ಮನದಲಿ ನಿಂದು ದುಃಖ
      ಕೂಪದಿಂದಲಿ ಎತ್ತಿ ಕಡೆ ಮಾಡು ಜನ್ಮಂಗಳ
      ಸೌಪರ್ಣಿ ಮಿಗಿಲಾದ ಸತಿಯರು ನಿತ್ಯ ನಿನ್ನ
      ಆಪಾದ ಮೌಳಿತನಕ ಭಜಿಸಿ ಭವ್ಯರಾದರು
      ನಾ ಪೇಳುವದೇನು ಪಾಂಡವರ ಮನೋಭಿಷ್ಟೆ
      ಈ ಪಂಚ ಭೌತಿಕದಲ್ಲಿ ಆವ ಸಾಧನೆ ಕಾಣೇ
      ಶ್ರೀಪತಿ ನಾಮ ಒಂದೇ ಜಿಹ್ವಾಗ್ರದಲಿ ನೆನೆವ
      ಔಪಾಸನ ಕೊಡು ರುದ್ರಾದಿಗಳ ವರದೇ
      ತಾಪಸ ಜನಪ್ರೀಯ ವಿಜಯವಿಠ್ಠಲ ಮೂರ್ತಿಯ
      ಶ್ರೀಪಾದಾರ್ಚನೆ ಮಾಳ್ಪಾ ಶ್ರೀಭೂದುರ್ಗಾ ವರ್ಣಾಶ್ರಯೆ ||
    ta: |
      கோ³பினந்த³னெ முக்தெ தை³த்ய ஸந்ததிகெ³ ஸம்
      தாபவ கொடு³திப்ப மஹாகடோ²ரெ உக்³ர
      ரூப வைலக்ஷணெ அக்³ஞானக்கபி⁴மானினி
      தபத்ரய வினாஶ ஓங்காரெ ஹூங்காரெ
      பாபி கம்ஸகெ³ ப⁴ய தோரிதெ³ பா³ல லீலெ
      வ்யாபுத த⁴ர்மமார்க³ ப்ரேரணெ அப்ராகருதெ
      ஸ்வாபத³த³லி நின்ன நெனெஸித³ ஶரணனிகெ³
      அபாரவாகி³த்³த³ வாரிதி⁴யந்தெ மஹா
      ஆபத்து ப³ந்தி³ரலு ஹாரெ போகோ³வு ஸப்த
      த்³வீப நாயிகெ நரக நிர்லேபெ தமோகு³ணத³
      வ்யாபார மாடி³ஸி ப⁴க்த ஜனகெ புண்ய
      ஸோபான மாடி³கொடு³வ ஸௌபா⁴க்³யவந்தெ து³ர்கெ³
      ப்ராபுதவாகி³ என்ன மனத³லி நிந்து³ து³ஹக²
      கூபதி³ந்த³லி எத்தி கடெ³ மாடு³ ஜன்மங்க³ள
      ஸௌபர்ணி மிகி³லாத³ ஸதியரு நித்ய நின்ன
      ஆபாத³ மௌளிதனக ப⁴ஜிஸி ப⁴வ்யராத³ரு
      நா பேளுவதே³னு பாண்ட³வர மனோபி⁴ஷ்டெ
      ஈ பஞ்ச பௌ⁴திகத³ல்லி ஆவ ஸாத⁴னெ காணே
      ஸ்ரீபதி நாம ஒந்தே³ ஜிஹ்வாக்³ரத³லி நெனெவ
      ஔபாஸன கொடு³ ருத்³ராதி³க³ள வரதே³
      தாபஸ ஜனப்ரீய விஜயவிட்²ட²ல மூர்திய
      ஸ்ரீபாதா³ர்சனெ மாள்பா ஸ்ரீபூ⁴து³ர்கா³ வர்ணாஸ்ரயெ ||
    hi: |
      गोपिनन्दने मुक्ते दैत्य सन्ततिगे सं
      तापव कोडुतिप्प महाकठोरे उग्र
      रूप वैलक्षणे अज्ञानक्कभिमानिनि
      तपत्रय विनाश ओङ्कारे हूङ्कारे
      पापि कंसगे भय तोरिदे बाल लीले
      व्यापुत धर्ममार्ग प्रेरणे अप्राकृते
      स्वापददलि निन्न नेनेसिद शरणनिगे
      अपारवागिद्द वारिधियन्ते महा
      आपत्तु बन्दिरलु हारे पोगोवु सप्त
      द्वीप नायिके नरक निर्लेपे तमोगुणद
      व्यापार माडिसि भक्त जनके पुण्य
      सोपान माडिकोडुव सौभाग्यवन्ते दुर्गे
      प्रापुतवागि एन्न मनदलि निन्दु दुःख
      कूपदिन्दलि एत्ति कडे माडु जन्मङ्गळ
      सौपर्णि मिगिलाद सतियरु नित्य निन्न
      आपाद मौळितनक भजिसि भव्यरादरु
      ना पेळुवदेनु पाण्डवर मनोभिष्टे
      ई पञ्च भौतिकदल्लि आव साधने काणे
      श्रीपति नाम ओन्दे जिह्वाग्रदलि नेनेव
      औपासन कोडु रुद्रादिगळ वरदे
      तापस जनप्रीय विजयविठ्ठल मूर्तिय
      श्रीपादार्चने माळ्पा श्रीभूदुर्गा वर्णाश्रये ||
    en: |
      gōpinandane mukte daitya santatige saṃ
      tāpava koḍutippa mahākaṭhōre ugra
      rūpa vailakṣṇe ajñānakkabhimānini
      tapatraya vināśa ōṅkāre hūṅkāre
      pāpi kaṃsage bhaya tōride bāla līle
      vyāputa dharmamārga prēraṇe aprākṛte
      svāpadadali ninna nenesida śaraṇanige
      apāravāgidda vāridhiyante mahā
      āpattu bandiralu hāre pōgōvu sapta
      dvīpa nāyike naraka nirlēpe tamōguṇada
      vyāpāra māḍisi bhakta janake puṇya
      sōpāna māḍikoḍuva saubhāgyavante durge
      prāputavāgi enna manadali nindu duḥkha
      kūpadindali etti kaḍe māḍu janmaṅgaḷa
      sauparṇi migilāda satiyaru nitya ninna
      āpāda mauḷitanaka bhajisi bhavyarādaru
      nā pēḷuvadēnu pāṇḍavara manōbhiṣṭe
      ī pañca bhautikadalli āva sādhane kāṇē
      śrīpati nāma ondē jihvāgradali neneva
      aupāsana koḍu rudrādigaḷa varadē
      tāpasa janaprīya vijayaviṭhṭhala mūrtiya
      śrīpādārcane māḷpā śrībhūdurgā varṇāśraye ||

