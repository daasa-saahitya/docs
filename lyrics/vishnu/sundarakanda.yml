  - type: ''
    number: 35
    kn: |
      ತಿರುಹಿ ಚಕ್ರದ ತೆರನೆ ರಾಕ್ಷಸರರಸೀನಾತ್ಮಜನನ್ನು ಕ್ಷಣದಲಿಧರಿಯ ಮೇಲಪ್ಪಳಿಸಿ ಒಗೆದನುಮರುತನಾತ್ಮಜನು
  
  - type: ''
    number: 36
    kn: |
