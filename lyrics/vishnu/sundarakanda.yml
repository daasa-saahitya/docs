# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ಸುಂದರ ಕಾಂಡ
author_kn: ತಿರುಪತಿ ಪಾಂಡುರಂಗಿ ಹುಚ್ಚಾಚಾರ್ಯರು
category: [Kavya]
on_who: [Rama]
types: []
festivals: [Rama Navami]
raga_kn: 
tala_kn: 
ankita_kn: ಇಂದಿರೇಶ
verses:
  - type: pallavi
    kn: |
      ಶ್ರೀ ಸಮೀರನ ಮಹಿಮೆ ಪೇಳುವೆವಾಸುದೇವ ವಿಧೀರ ಮುಖಸುರರಾಶಿತಸ್ತ್ರೀ ಮುನಿಯತೀಶ ಸು-ದಾಸರಭಿ ನಮಿಪೆ

  - type: Charana
    number: 1
    kn: |
      ವಾರಿಧಿಯನು ದಾಟುಲೋಸುಗಶ್ರೀ ರಮೇಶನ ನಮಿಸಿ ಗಿರಿಯನುಚಾರು ಚರಣದಿ ಮೆಚ್ಚಿ ಮೇಲಕೆ ಹಾರಿದನು ಹನುಮಾ

  - type: ''
    number: 2
    kn: |
      ಹರಿಯ ಬಲವನು ಸರಿಸಿ ಪೋದುವುತರುಗಳಬ್ಧಿಯು ಯಾದಸಂಗಳುಶರಧಿ ತಳಗತ ಕಪಿಯಗೋಸುಗಗಿರಿಯು ಎದ್ದಿಹನು

  - type: ''
    number: 3
    kn: |
      ಧರಣಿಧರ ಪಕ ನಾಶ ಕಾಲದಿಮರುತ ರಕ್ಷಿತ ಪಕ್ಷ ಹೈಮನುಶರಧಿ ಭೇದಿಸಿ ಹನುಮ ವಿಹೃತಿಗೆತ್ವರದಿ ಬಂದಿಹನು

  - type: ''
    number: 4
    kn: |
      ಪರಮ ಪೌರುಷ ಬ ಲನು ಕಪಿವರಚರಿಸದಲೆ ವಿಶ್ರಮವನದರೊಳುಹರುಷದಿಂದಪ್ಯವನ ಕಂಡನುಉರಗ ಮಾತೆಯನು

  - type: ''
    number: 5
    kn: |
      ಸುರಸೆಯೆಂಬುವ ನಾಗಮಾತೆಗೆವರವ ನೀಡುತ ಕಪಿಯ ಬಲವನುಅರಿಯಲೋಸುಗ ಕಳುಹಿಸೀದರುಸುರರು ಶರಧಿಯಲಿ

  - type: ''
    number: 6
    kn: |
      ಯಾವ ವಸ್ತುವ ತಿನ್ನೋ ಇಚ್ಛೆಯು ೀವಿ ನಿನಗಾಗುವದೊ ಅದು ತವಬಾಯಿಗನ್ನಾಗಿರಲಿ ಎಂದರುದೇವತೋತ್ತುಮರು 

  - type: ''
    number: 7
    kn: |
      ಸುರರ ವರವನು ಕಾಯೊಗೋಸುಗಸುರಸೆ ಮುಖದೊಳು ಹೊಕ್ಕು ಹೊರಡುತಪರಮಮಣು ರೂಪದಲಿ ದಿವಿಜರಹರುಷ ಬಡಿಸಿದನು
  
  - type: ''
    number: 8
    kn: |
      ಅಸುವರಾತ್ಮಜನುರು ಪರಾಕ್ರಮಹೃಷಿತರಾಗುತ ನೋಡಿ ದಿವಿಜರುಕುಸುಮವೃಷ್ಟಿಯ ಮಾಡುತವನಲಿಯಶಸು ಪಾಡಿದರು

  - type: ''
    number: 9
    kn: |
      ಛಾಯಾ ಪ್ರಾಣಿಗಳನ್ನು ಹಿಡಿಯುವಮಾಯಾ ಸಿಂಹಕೆ ನಾಮ ಕಸುರಿಯವಾಯುಸುತ ನೋಡಿದನು ಎದುರೆ ವಿಹಾಯ ಮಾರ್ಗದಲಿ

  - type: ''
    number: 10
    kn: |
      ವಿಧಿಯು ಲಂಕೆಯ ಕಾಯಲೋಸುಗಸುತಿಗ್ವರಗಳನಿತ್ತು ಕಾದಿಹಾಮದದಿ ಅಸುರಿಯು ತನ್ನ ಛಾಯವವದಗಿ ಪಿಡಿದಿಹಳು

  - type: ''
    number: 11
    kn: |
      ಆಗ ಆಕೆಯ ಪೊಕ್ಕು ಪೊಟ್ಟೆಯಯೋಗದಿಂದಲಿ ಪಾವಮಾನಿಯುಬೇಗ ಬಂದನು ಹೊರಗೆ ತತ್ತನುಭಾಗ ಮಾಡುತಲೆ
  
  - type: ''
    number: 12
    kn: |
      ಆತ್ಮಬಲವಮಿತೆಂದು ತೋರಿವಿಧಾತೃ ವರವುಳ್ಳವಳ ಕೊಲ್ಲುತವಾತನಂತೆ ತ್ರಿಕೂಟ ಪರ್ವತಕೀತ ಹಾರಿದನು
  
  - type: ''
    number: 13
    kn: |
      ಬೆಕ್ಕಿನಂದದಿ ಹನುಮ ತನ್ನಯಚಿಕ್ಕ ರೂಪವ ಮಾಡಿ ಲಂಕೆಯಪೊಕ್ಕು ನಿಶಿಯಲಿ ಮಧ್ಯಮಾರ್ಗದಿರಕ್ಕಸಿಯ ಕಂಡಾ
  
  - type: ''
    number: 14
    kn: |
      ಬಟ್ಟಿಯಲಿ ಬಂದಡ್ಡಗಟ್ಟುವದುಷ್ಟ ರಾಕ್ಷಸೀಯನ್ನು ಗೆಲ್ಲುತಮುಷ್ಟಿಯಿಂದಲಿ ಹೊಡೆದು ಲಂಕಾಪಟ್ಟಣವ ಪೊಕ್ಕಾ
  
  - type: ''
    number: 15
    kn: |
      ಪುರದ ಹೊರಗೊಳಗ್ಹೊಕ್ಕು ರಾಮನತರುಳೆ ಕಾಣದೆ ಹನುಮ ಶಿಂಶುಪತರುನ ಮೂಲದಿ ಕಂಡ ಸೀತೆಯಉರುತರಾಕೃತಿಯಾ
  
  - type: ''
    number: 16
    kn: |
      ನರಜನಂಗಳ ಮೋಹ ಮಾಡುವಪರಮ ಪುರುಷನ ಚೇಷ್ಟೆಗಳನನುಸರಿಸಿ ನಡೆಯುವ ದೇವಿ ಚರಿಯನುಸರಿಸಿ ಚೇಷ್ಟಿಸಿದಾ
  
  - type: ''
    number: 17
    kn: |
      ರಾಮನಿಂದಲಿ ಅಂಗುಲಿಯನುಪ್ರೇಮದಿಂದಲಿ ಕೇಸರಿಯ ಸುತಾಭೂಮಿ ಜಾತೆಗೆ ಕೊಟ್ಟು ಸುಖಿಸಿದಾನಾಮ ಹದ್ದನದಿ
  
  - type: ''
    number: 18
    kn: |
      ಎರಡು ಭಾಗಗಳಾಗಿ ಭೂಷಗಳ್‍ಸರಸಿಜಾಕ್ಷಿಯ ಪ್ರತಿಮೆ ಮಹಿಳಿಗೆಪರಮ ರುಚಿ ನೀಡಿದವು ರಾವಣನ್ಹರಣ ಕಾಲದಲಿ
  
  - type: ''
    number: 19
    kn: |
      ಧರಣಿದೇವಿಯ ಸುತೆಯ ತನ್ನಯಪರಮ ಚೂಡಾಮಣಿಯನಿತ್ತಳುಗುರುತು ತೋರಿಸು ರಾಮದೇವಗೆಮರುತಾ ಸುತನೆಂದು
  
  - type: ''
    number: 20
    kn: |
      ಸೀತೆ ಹನುಮರದೀ ವಿಡಂಬನಯಾತು ಧಾನರಿಗಲ್ಲಾ ನಾಕಗಭೂತ ವಿಡಂಬನ ಧೈತ್ಯವಂಚನಹೇತು ಆಗುವದು
  
  - type: ''
    number: 21
    kn: |
      ಇಂಥ ಕಾರ್ಯವ ಮಾಡಿ ತನ್ನಯಾನಂಥ ಪೌರುಷ ಪ್ರಕಟ ಮಾಡುವದಿಂತು ಮನವನು ಮಾಡಿದನು ಮತಿವಂತ ವಾನರನು
  
  - type: ''
    number: 22
    kn: |
      ಚಾರು ಶಿಂಶುಪ ಬಿಟ್ಟು ರಾಕ್ಷಸವಾರ ವಳಿಸುವ ಮನದಿ ಹನುಮನುಭೂರಿವನವನು ಮುರಿದು ಲಂಕೆಯತೋರಣೇರಿದನು
  
  - type: ''
    number: 23
    kn: |
      ದುಷ್ಟ ರಾವಣ ಕಪಿಯ ಮಾಡಿದಚೇಷ್ಟೆ ಕೇಳುತ ಭೃತ್ಯ ಜನರಿಗೆಕಟ್ಟಿ ಹಾಕಿರಿ ಕಪಿಯನೆಂದನುರುಷ್ಟನಾಗುತಲೆ 
  
  - type: ''
    number: 24
    kn: |
      ಹರನ ವರದಲಿ ಮರಣ ವರ್ಜಿತಸರವ ಭೃತ್ಯರು ರಾಕ್ಷಸೇಶನಮರುತ ಸೂನುನ ಮೇಲೆ ಬಂದರುಪರಮ ವೇಗದಲಿ
  
  - type: ''
    number: 25
    kn: |
      ಹತ್ತು ಒಂದು ಕೋಟಿ ಯೂಥವತತ್ಸಮಾನ ಪುರಃ ಸರಾನ್ವಿತಎತ್ತಿ ಆಯುಧ ಸೈನ್ಯ ಹನುಮನಸುತ್ತಿಕೊಂಡಿಹುದು
  
  - type: ''
    number: 26
    kn: |
      ಹಿಡಿದು ಕರದಲಿ ಆಯುಧಂಗಳಹೊಡೆವ ಸೈನ್ಯವ ನೋಡಿ ಹನುಮನುಹೊಡೆದು ಕರತಳದಿಂದಲೆಲ್ಲರಪುಡಿಯ ಮಾಡಿದನು
  
  - type: ''
    number: 27
    kn: |
      ನೀಲಕಂಠನ ವರಗಿರಿಪ್ರಭಏಳುಮಂದಿಯ ಮಂದಿ ಪುತ್ರರಕಾಲಿನಿಂದಲಿ ಒದ್ದು ಕೆಡಹಿದನಾಳು ಮಾಧವನಾ
  
  - type: ''
    number: 28
    kn: |
      ಧುರದಿ ಮುಂಭಾಗದಲಿ ಪೋಗುವಗರುವ ಮಾಡುವ ರಾಕ್ಷಸಂಗಳಮುರಿದು ಸೈನ್ಯದ ತೃತೀಯ ಭಾಗವಹರಿಯು ಕೊಂದಿಹನು
  
  - type: ''
    number: 29
    kn: |
      ಪೋರ ಬಲವನು ಕೇಳಿ ಹನುಮನಚಾರ ಮುಖದಲಿ ಸ್ವಾತ್ಮ ಸದೃಶರುಮಾರ ಕಾಕ್ಷಾಭಿಧನ ಕಳುಹಿದ ವೀರ ರಾವಣನು
  
  - type: ''
    number: 30
    kn: |
      ಉತ್ತುಮಾಸ್ತ್ರಗಳಿಂದ ಮಂತ್ರಿತವೆತ್ತಿ ಬಾಣಗಳ್ಹೊಡೆದು ಹನುಮನಕೆತ್ತಿ ಹಾಕಲು ಅಕ್ಷ ಸಾಲದೆಶಕ್ತಿ ನಿಂತಿಹನು
  
  - type: ''
    number: 31
    kn: |
      ಮಂಡ ಮಧ್ಯೆಯ ತನಯ ಅಕ್ಷನುಪುಂಡ ರಾವಣ ಸಮನು ಸೈನ್ಯದಹಿಂಡಿನೊಳು ತೃತೀಯಾಂಶ ಯಂದುದ್ದಂಡ ಚಿಂತಿಸಿದಾ
  
  - type: ''
    number: 32
    kn: |
      ಹತ್ತು ತಲೆಯವನನ್ನೆ ಕೊಲ್ಲುವದುತ್ತಮಾತ್ಮವು ಆದರೀತನುತುತ್ತು ರಾಮಗೆ ಕಾರಣಿಂಥಾಕೃತ್ಯ ಥರವಲ್ಲಾ
  
  - type: ''
    number: 33
    kn: |
      ಇಂದ್ರಜಿತನನು ನಾನು ಈಗಲೆಕೊಂದು ಹಾಕಿದರಿವನ ಕೃತಿಗಳಛಂದ ನೋಡುವುದಿಲ್ಲಾ ಕಪಿಗಳವೃಂದ ಯುದ್ಧದಲಿ
  
  - type: ''
    number: 34
    kn: |
