# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ಶ್ರಾವಣ ಅಷ್ಟಮಿ ನಡುರಾತ್ರಿಯಲ್ಲಿ
author_kn: ಶ್ರೀ ವಾದಿರಾಜ ತೀರ್ಥರು
category: [Dasara Pada]
on_who: [Krishna]
types: [Laali]
festivals: [Krishna Jayanti]
raga_kn: ಶೋಭಾನೆ ಶೈಲಿ
tala_kn:
ankita_kn: ಹಯವದನ
verses:
  - type: ''
    number: 1
    kn: |
      ಶ್ರಾವಣ ಅಷ್ಟಮಿ ನಡುರಾತ್ರಿಯಲ್ಲಿ ರೋಹಿಣಿ ನಕ್ಷತ್ರ ಶುಭಲಗ್ನದಲ್ಲಿ
      ಕಾಮಜನಕ ಕೃಷ್ಣ ಹುಟ್ಟಿದನೆಂದು ತಾಯಿ ದೇವಕೀದೇವಿ ತೂಗಿದಳು ಕೃಷ್ಣನ

  - type: ''
    number: 2
    kn: |
      ಚತುರ್ವೇದ ನಾಲ್ಕು ಸರಪಣಿಯ ಹಾಕಿ ಚತುರ್ವರ್ಗವೆಂಬೊ ತೊಟ್ಟಿಲನೆ ಕಟ್ಟಿ
      ಚತುರ್ಮುಖ ಬ್ರಹ್ಮನ ಪಡೆದೆ ನೀ ಎಂದು ಯತಿಮುನಿಗಳು ಕೃಷ್ಣನಾ ಪಾಡಿ ತೂಗಿದರು

  - type: ''
    number: 3
    kn: |
      ಅರಳೆಲೆ ಮಾಗಾಯಿ ಕೌಸ್ತುಭಗಳಿಂದ ಹುಲಿಯುಗುರು ನಿನಗೆ ಒಪ್ಪುವ ಅಂದ
      ಕಡಗ ಕಂಕಣ ವಂಕಿ ತೋಳುಗಳಿಂದ ಪರಮಾತ್ಮ ಮಲಗಿದಾ ಕೃಪೆಯಿಂದ ||

  - type: ''
    number: 4
    kn: |
      ಆಕಾಶವೇ ಮೇಲು ಮಂಟಪದ ಕಟ್ಟು ಬೇಕೆಂಬೋ ನಕ್ಷತ್ರಮಾಲೆಗಳನಿಟ್ಟು
      ಲೋಕಗಳನ್ನೆಲ್ಲಾ ತನ್ನಾತ್ಮದೊಳಿಟ್ಟು ಯಾಕಯ್ಯ ಮಲಗಿದೊ ತೊಟ್ಟಿಲೊಳಗುಟ್ಟು

  - type: ''
    number: 5
    kn: |
      ಲಾಲಿ ಬಾಲ ಮುಕುಂದ ಲಾಲಿ ಲಾಲಿ ಲಾಲಿ ಲಾಲಿ ಶುಭಕರದ ಲಾಲಿ
      ಲಾಲಿ ಶ್ರೀ ಜಗದ ಆನಂದ ಲಾಲಿ ಲಾಲಿ ಶ್ರೀ ಹಯವದನ ಲಾಲಿ ರಂಗ ಲಾಲಿ ||
