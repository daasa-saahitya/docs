title_kn: ತುಳಸಿ ಸ್ತೋತ್ರ ಸುಳಾದಿ
title_ta: துளஸி ஸ்தோத்ர ஸுளாதி³
title_hi: तुळसि स्तोत्र सुळादि
title_en: tuḷasi stōtra suḷādi

author_kn: ಪುರಂದರ ದಾಸರು
author_ta: புரந்த³ர தா³ஸரு
author_hi: पुरन्दर दासरु
author_en: purandara dāsaru

raga_kn: ಆನಂದ ಭೈರವಿ
raga_ta: ஆனந்த³ பை⁴ரவி
raga_hi: आनन्द भैरवि
raga_en: ānanda bhairavi



verses:
  - type: 
    number: 1
    subtitle_kn: ಧ್ರುವ ತಾಳ
    subtitle_ta: த்⁴ருவ தாள
    subtitle_hi: ध्रुव ताळ
    subtitle_en: dhruva tāḷa
    kn: |
      ಸಂತತ ಹನ್ನೆರಡು ಕೋಟಿ ಸುವರ್ಣ ಪುಷ್ಪ ಸಮರ್ಪಿಸಲು 
      ಅಂತಾ ಫಲದಿ ಕೋಟಿ ಕೋಟಿ ಗುಣಿತ ತುಳಸೀ ದಳಕೆ 
      ತಂತು ಮಾತ್ರ ಭಕ್ತಿಯಲಿ ತವಕದಿ ಪೂಜಿಸು ಶ್ರೀ -
      ಮಂತ ಶ್ರೀ ಪುರಂದರವಿಠಲ ವೈಕುಂಠವನೀವಾ ॥
    ta: |
      ஸந்தத ஹன்னெரடு³ கோடி ஸுவர்ண புஷ்ப ஸமர்பிஸலு 
      அந்தா ப²லதி³ கோடி கோடி கு³ணித துளஸீ த³ளகெ 
      தந்து மாத்ர ப⁴க்தியலி தவகதி³ பூஜிஸு ஸ்ரீ -
      மந்த ஸ்ரீ புரந்த³ரவிட²ல வைகுண்ட²வனீவா ॥
    hi: |
      सन्तत हन्नेरडु कोटि सुवर्ण पुष्प समर्पिसलु 
      अन्ता फलदि कोटि कोटि गुणित तुळसी दळके 
      तन्तु मात्र भक्तियलि तवकदि पूजिसु श्री -
      मन्त श्री पुरन्दरविठल वैकुण्ठवनीवा ॥
    en: |
      santata hanneraḍu kōṭi suvarṇa puṣpa samarpisalu 
      antā phaladi kōṭi kōṭi guṇita tuḷasī daḷake 
      tantu mātra bhaktiyali tavakadi pūjisu śrī -
      manta śrī purandaraviṭhala vaikuṇṭhavanīvā ॥

  - type: 
    number: 2
    subtitle_kn: ಮಟ್ಟ ತಾಳ
    subtitle_ta: மட்ட தாள
    subtitle_hi: मट्ट ताळ
    subtitle_en: maṭṭa tāḷa
    kn: |
      ಆದಿವಾರದಿ ಸಂಜೆಯಲಿ ರಾತ್ರಿಯಲಿ
      ಅಂಗಾರಕ ಶುಕ್ರವಾರದಲ್ಲಿ 
      ಆದಿತ್ಯ ಸೋಮ ಗ್ರಹಣ ಅಮವಾಸ್ಯೆ ಹುಣ್ಣಿವೆ
      ದ್ವಾದಶಿಯಲಿ ಸಾದರಾರ್ಚಿತ ಜಯಂತಿಗಳಲಿ
      ವೈಧೃತಿ ವ್ಯತಿಪಾತ ಸಂಕ್ರಂತಿಗಳಲ್ಲಿ  ಶ್ರೀ -
      ಪುರಂದರವಿಠಲ ಮುನಿವ ಶೀ ತುಳಸಿಯ ತೆಗೆದರೆ ॥
    ta: |
      ஆதி³வாரதி³ ஸஞ்ஜெயலி ராத்ரியலி
      அங்கா³ரக ஶுக்ரவாரத³ல்லி 
      ஆதி³த்ய ஸோம க்³ரஹண அமவாஸ்யெ ஹுண்ணிவெ
      த்³வாத³ஶியலி ஸாத³ரார்சித ஜயந்திக³ளலி
      வைதரு⁴தி வ்யதிபாத ஸங்க்ரந்திக³ளல்லி  ஸ்ரீ -
      புரந்த³ரவிட²ல முனிவ ஶீ துளஸிய தெகெ³த³ரெ ॥
    hi: |
      आदिवारदि सञ्जेयलि रात्रियलि
      अङ्गारक शुक्रवारदल्लि 
      आदित्य सोम ग्रहण अमवास्ये हुण्णिवे
      द्वादशियलि सादरार्चित जयन्तिगळलि
      वैधृति व्यतिपात सङ्क्रन्तिगळल्लि  श्री -
      पुरन्दरविठल मुनिव शी तुळसिय तेगेदरे ॥
    en: |
      ādivāradi sañjeyali rātriyali
      aṅgāraka śukravāradalli 
      āditya sōma grahaṇa amavāsye huṇṇive
      dvādaśiyali sādarārcita jayantigaḷali
      vaidhṛti vyatipāta saṅkrantigaḷalli  śrī -
      purandaraviṭhala muniva śī tuḷasiya tegedare ॥

  - type: 
    number: 3
    subtitle_kn: ತ್ರಿಪುಟ ತಾಳ
    subtitle_ta: த்ரிபுட தாள
    subtitle_hi: त्रिपुट ताळ
    subtitle_en: tripuṭa tāḷa
    kn: |
      ಸಾರಂಗಧರನಿಗೆ ಸಂವತ್ಸರದ ತುಳಸಿ
      ಆರು ತಿಂಗಳ ಬಿಲ್ವ ಆಹೋದು ಆಚ್ಯುತನ ಅರ್ಚನೆಗೆ
      ಕಾರುಣ್ಯ ಮೂರುತಿಗೆ ಕಮಲ ಏಳು ದಿನವಹುದು
      ಪುರಂದರವಿಠಲನಿಗೆ ದಿನ ದಿನದಿ ಕಣಗಿಲ ಆಹೋದು ಸತತ ॥
    ta: |
      ஸாரங்க³த⁴ரனிகெ³ ஸம்வத்ஸரத³ துளஸி
      ஆரு திங்க³ள பி³ல்வ ஆஹோது³ ஆச்யுதன அர்சனெகெ³
      காருண்ய மூருதிகெ³ கமல ஏளு தி³னவஹுது³
      புரந்த³ரவிட²லனிகெ³ தி³ன தி³னதி³ கணகி³ல ஆஹோது³ ஸதத ॥
    hi: |
      सारङ्गधरनिगे संवत्सरद तुळसि
      आरु तिङ्गळ बिल्व आहोदु आच्युतन अर्चनेगे
      कारुण्य मूरुतिगे कमल एळु दिनवहुदु
      पुरन्दरविठलनिगे दिन दिनदि कणगिल आहोदु सतत ॥
    en: |
      sāraṅgadharanige saṃvatsarada tuḷasi
      āru tiṅgaḷa bilva āhōdu ācyutana arcanege
      kāruṇya mūrutige kamala ēḷu dinavahudu
      purandaraviṭhalanige dina dinadi kaṇagila āhōdu satata ॥

  - type: 
    number: 4
    subtitle_kn: ಅಟ್ಟ ತಾಳ
    subtitle_ta: அட்ட தாள
    subtitle_hi: अट्ट ताळ
    subtitle_en: aṭṭa tāḷa
    kn: |
      ಲ್ಲದಿದ್ದರೆ ಚಿಗುರು ತುಳಸಿ ಅದು 
      ಇಲ್ಲದಿದ್ದರೆ  ಮುಗುಳು ತೆನೆಯು ಅದು
      ಇಲ್ಲದಿದ್ದರೆ ತುಳಸಿ ಎಲೆಯು ಅದು
      ಇಲ್ಲದಿದ್ದರೆ ಒಣಗಿದ ಕಾಷ್ಟ ಅದು
      ಇಲ್ಲದಿದ್ದರೆ ತುಳಸಿಯ ಬುಡದ ಮಣ್ಣು ಅದು
      ಇಲ್ಲದಿದ್ದರೆ ತುಲಸಿ ತುಲಸಿ ಎಂದು
      ಕೂಗಿದರೆ ನಮ್ಮ ಪುರಂದರವಿಠಲ 
      ಒಲಿವ ಕಾಣಿರೊ ॥
    ta: |
      ல்லதி³த்³த³ரெ சிகு³ரு துளஸி அது³ 
      இல்லதி³த்³த³ரெ  முகு³ளு தெனெயு அது³
      இல்லதி³த்³த³ரெ துளஸி எலெயு அது³
      இல்லதி³த்³த³ரெ ஒணகி³த³ காஷ்ட அது³
      இல்லதி³த்³த³ரெ துளஸிய பு³ட³த³ மண்ணு அது³
      இல்லதி³த்³த³ரெ துலஸி துலஸி எந்து³
      கூகி³த³ரெ னம்ம புரந்த³ரவிட²ல 
      ஒலிவ காணிரொ ॥
    hi: |
      ल्लदिद्दरे चिगुरु तुळसि अदु 
      इल्लदिद्दरे  मुगुळु तेनेयु अदु
      इल्लदिद्दरे तुळसि एलेयु अदु
      इल्लदिद्दरे ओणगिद काष्ट अदु
      इल्लदिद्दरे तुळसिय बुडद मण्णु अदु
      इल्लदिद्दरे तुलसि तुलसि एन्दु
      कूगिदरे नम्म पुरन्दरविठल 
      ओलिव काणिरो ॥
    en: |
      lladiddare ciguru tuḷasi adu 
      illadiddare  muguḷu teneyu adu
      illadiddare tuḷasi eleyu adu
      illadiddare oṇagida kāṣṭa adu
      illadiddare tuḷasiya buḍada maṇṇu adu
      illadiddare tulasi tulasi endu
      kūgidare namma purandaraviṭhala 
      oliva kāṇiro ॥

  - type: 
    number: 4
    subtitle_kn: ಝುಂಪೆ ತಾಳ
    subtitle_ta: ஜு²ம்பெ தாள
    subtitle_hi: झुम्पे ताळ
    subtitle_en: jhumpe tāḷa
    kn: |
      ಶ್ರೀರಮಣನು ತನ್ನ ಸಿರಿಯನ್ನೆ ಕೂಡಿ
      ಶೀವತ್ಸ ಕೌಸ್ತಂಭ ಮಾಲೆ ವೈ ಜಯಂತಿ ಹಾರ
      ಏಕಾವಳಿಯನು ಒಲ್ಲೆ ತುಳಸಿ ಎನ್ನವಳೆಂದ
      ತುಳಸಿ ಎನ್ನವಳೆಂದ ಪುರಂದರವಿಠಲ ॥
    ta: |
      ஸ்ரீரமணனு தன்ன ஸிரியன்னெ கூடி³
      ஶீவத்ஸ கௌஸ்தம்ப⁴ மாலெ வை ஜயந்தி ஹார
      ஏகாவளியனு ஒல்லெ துளஸி என்னவளெந்த³
      துளஸி என்னவளெந்த³ புரந்த³ரவிட²ல ॥
    hi: |
      श्रीरमणनु तन्न सिरियन्ने कूडि
      शीवत्स कौस्तम्भ माले वै जयन्ति हार
      एकावळियनु ओल्ले तुळसि एन्नवळेन्द
      तुळसि एन्नवळेन्द पुरन्दरविठल ॥
    en: |
      śrīramaṇanu tanna siriyanne kūḍi
      śīvatsa kaustambha māle vai jayanti hāra
      ēkāvaḷiyanu olle tuḷasi ennavaḷenda
      tuḷasi ennavaḷenda purandaraviṭhala ॥

  - type: 
    number: 5
    subtitle_kn: ಆದಿ ತಾಳ
    subtitle_ta: ஆதி³ தாள
    subtitle_hi: आदि ताळ
    subtitle_en: ādi tāḷa
    kn: |
      ಒಂದೆ ಒಂದು ಬೆರಳ ಜಪ 
      ಒಂದೆ ಐದು ಗೆರೆಯ ಜಪ 
      ಒಂದೇ ಹತ್ತು ಪುತ್ರ ಜೀವಿ ಮಣಿಯ ಜಪ 
      ಒಂದೇ ನೂರು ಶಂಖಮಣಿಯ ಜಪ
      ಒಂದೇ ಸಾವಿರ ಹವಳದ ಜಪ
      ಒಂದೇ ಹತ್ತು ಸಾವಿರ ಮುತ್ತಿನ ಮಣಿಯ ಜಪ
      ಒಂದೇ ಹತ್ತು ಲಕ್ಷ ಸುವರ್ಣ ಮಣಿಯ ಜಪ
      ಒಂದೇ ಕೋಟಿ ದರ್ಭೆ ಬೆಟ್ಟಿನ ಜಪ 
      ಒಂದೆ ಅನಂತ ಶೀ ತುಳಸಿ ಮಣಿಯ ಜಪ -
      ವೆಂದು ಪುರಂದರವಿಠಲ ಪೇಳ್ದ  ॥
    ta: |
      ஒந்தெ³ ஒந்து³ பெ³ரள ஜப 
      ஒந்தெ³ ஐது³ கெ³ரெய ஜப 
      ஒந்தே³ ஹத்து புத்ர ஜீவி மணிய ஜப 
      ஒந்தே³ னூரு ஶங்க²மணிய ஜப
      ஒந்தே³ ஸாவிர ஹவளத³ ஜப
      ஒந்தே³ ஹத்து ஸாவிர முத்தின மணிய ஜப
      ஒந்தே³ ஹத்து லக்ஷ ஸுவர்ண மணிய ஜப
      ஒந்தே³ கோடி த³ர்பெ⁴ பெ³ட்டின ஜப 
      ஒந்தெ³ அனந்த ஶீ துளஸி மணிய ஜப -
      வெந்து³ புரந்த³ரவிட²ல பேள்த³  ॥
    hi: |
      ओन्दे ओन्दु बेरळ जप 
      ओन्दे ऐदु गेरेय जप 
      ओन्दे हत्तु पुत्र जीवि मणिय जप 
      ओन्दे नूरु शङ्खमणिय जप
      ओन्दे साविर हवळद जप
      ओन्दे हत्तु साविर मुत्तिन मणिय जप
      ओन्दे हत्तु लक्ष सुवर्ण मणिय जप
      ओन्दे कोटि दर्भे बेट्टिन जप 
      ओन्दे अनन्त शी तुळसि मणिय जप -
      वेन्दु पुरन्दरविठल पेळ्द  ॥
    en: |
      onde ondu beraḷa japa 
      onde aidu gereya japa 
      ondē hattu putra jīvi maṇiya japa 
      ondē nūru śaṅkhamaṇiya japa
      ondē sāvira havaḷada japa
      ondē hattu sāvira muttina maṇiya japa
      ondē hattu lakṣ suvarṇa maṇiya japa
      ondē kōṭi darbhe beṭṭina japa 
      onde ananta śī tuḷasi maṇiya japa -
      vendu purandaraviṭhala pēḷda  ॥

  - type: 
    subtitle_kn: ಜತೆ
    subtitle_ta: ஜதெ
    subtitle_hi: जते
    subtitle_en: jate
    kn: |
      ಸ್ನಾನ ದಾನಕೆ ತುಳಸಿ ಪ್ರಯೋಜನ ತುಳಸಿ 
      ಪುರಂದರವಿಠಲಗೆ ಅತಿ ಪ್ರೀಯೆ ತುಳಸಿ ॥
    ta: |
      ஸ்னான தா³னகெ துளஸி ப்ரயோஜன துளஸி 
      புரந்த³ரவிட²லகெ³ அதி ப்ரீயெ துளஸி ॥
    hi: |
      स्नान दानके तुळसि प्रयोजन तुळसि 
      पुरन्दरविठलगे अति प्रीये तुळसि ॥
    en: |
      snāna dānake tuḷasi prayōjana tuḷasi 
      purandaraviṭhalage ati prīye tuḷasi ॥

