    subtitle_ta: ஜதெ
    subtitle_hi: जते
    subtitle_en: jate
    kn: |
      ಮೀನಾಂಕಜಿತನೆ ಸುಜ್ಞಾನ ಪಾಲಿಸು ಜೀಯಾ ।
      ಮಾನದಭಿನವ ಪ್ರಾಣೇಶವಿಠಲನ ಪ್ರೀಯಾ ॥
      மீனாங்கஜிதனெ ஸுக்³ஞான பாலிஸு ஜீயா ।
      மானத³பி⁴னவ ப்ராணேஶவிட²லன ப்ரீயா ॥
    ta: |
      மீனாங்கஜிதனெ ஸுக்³ஞான பாலிஸு ஜீயா ।
      மானத³பி⁴னவ ப்ராணேஶவிட²லன ப்ரீயா ॥
      மீனாங்கஜிதனெ ஸுக்³ஞான பாலிஸு ஜீயா ।
      மானத³பி⁴னவ ப்ராணேஶவிட²லன ப்ரீயா ॥
    hi: |
      मीनाङ्कजितने सुज्ञान पालिसु जीया ।
      मानदभिनव प्राणेशविठलन प्रीया ॥
    en: |
      mīnāṅkajitane sujñāna pālisu jīyā ।
      mānadabhinava prāṇēśaviṭhalana prīyā ॥

