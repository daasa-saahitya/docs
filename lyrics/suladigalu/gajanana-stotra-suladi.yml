      கௌ³ரிவரன வரதி³ கொப்³பி³த³ ரக்கஸர
      க்ரூரிகர்மிக³ளனு ஶௌரியாக்³ஞெயிந்த³ ॥
      
      மாரிகு³ணிஸி பூ⁴மி பா⁴ரவனிளுஹித³
      தாரகாரி அனுஜ நதஜன ஸுர பூ⁴ஜ ।
      மாரபித அபி⁴னவ ப்ராணேஶவிட²லன
      பூ⁴ரி கருணகெ பாத்ர ஶௌரி ஹரிபுத்ர ॥
      மூரனே யுக³த³ல்லி ருக்மிணி தே³வியலி
      சாருதே³ஷ்ணனெம்ப³ நாமத³லவதரிஸி ।
      கௌ³ரிவரன வரதி³ கொப்³பி³த³ ரக்கஸர
      க்ரூரிகர்மிக³ளனு ஶௌரியாக்³ஞெயிந்த³ ॥
      
      மாரிகு³ணிஸி பூ⁴மி பா⁴ரவனிளுஹித³
      தாரகாரி அனுஜ நதஜன ஸுர பூ⁴ஜ ।
      மாரபித அபி⁴னவ ப்ராணேஶவிட²லன
      பூ⁴ரி கருணகெ பாத்ர ஶௌரி ஹரிபுத்ர ॥
    hi: |
      मूरने युगदल्लि रुक्मिणि देवियलि
      चारुदेष्णनेम्ब नामदलवतरिसि ।
      गौरिवरन वरदि कोब्बिद रक्कसर
      क्रूरिकर्मिगळनु शौरियाज्ञेयिन्द ॥
      
      मारिगुणिसि भूमि भारवनिळुहिद
      तारकारि अनुज नतजन सुर भूज ।
      मारपित अभिनव प्राणेशविठलन
      भूरि करुणके पात्र शौरि हरिपुत्र ॥
    en: |
      mūranē yugadalli rukmiṇi dēviyali
      cārudēṣṇanemba nāmadalavatarisi ।
      gaurivarana varadi kobbida rakkasara
      krūrikarmigaḷanu śauriyājñeyinda ॥
      
      māriguṇisi bhūmi bhāravaniḷuhida
      tārakāri anuja natajana sura bhūja ।
      mārapita abhinava prāṇēśaviṭhalana
      bhūri karuṇake pātra śauri hariputra ॥

  - type: 
    number: 3
    subtitle_kn: ತ್ರಿಪುಟತಾಳ
    subtitle_ta: த்ரிபுடதாள
    subtitle_hi: त्रिपुटताळ
    subtitle_en: tripuṭatāḷa
    kn: |
      ಮಾಧವನ ದಯದಿಂದ ಆದಿಪೂಜೆಗೆ ಅರ್ಹ
      ನಾದ ದೇವನು ನೀನು ಮೂರ್ಜಗದಿ ।
      ಆ ದೇವ ದನುಜ ಮನುಜರೆಲ್ಲರು ನಿನ್ನ
      ಆದಿಯಲ್ಲಿ ನಿನ್ನ ಪೂಜಿಪರು ॥
      
      ಬಾದರಾಯಣ ಪೇಳ್ದ ಪುರಾಣಂಗಳ ಬರೆದು
      ಸಾಧು ಸಜ್ಜನರಿಗೆ ಮೋದವಿತ್ತೆ ।
      ಶ್ರೀಧವ ಅಭಿನವ ಪ್ರಾಣೇಶವಿಠಲನ
      ಪಾದ ಭಜನೆಯಿತ್ತು ಮೋದ ಕೊಡು ನಿತ್ಯ ॥
      மாத⁴வன த³யதி³ந்த³ ஆதி³பூஜெகெ³ அர்ஹ
      னாத³ தே³வனு னீனு மூர்ஜக³தி³ ।
      ஆ தே³வ த³னுஜ மனுஜரெல்லரு னின்ன
      ஆதி³யல்லி னின்ன பூஜிபரு ॥
      
      பா³த³ராயண பேள்த³ புராணங்க³ள ப³ரெது³
      ஸாது⁴ ஸஜ்ஜனரிகெ³ மோத³வித்தெ ।
      ஸ்ரீத⁴வ அபி⁴னவ ப்ராணேஶவிட²லன
      பாத³ ப⁴ஜனெயித்து மோத³ கொடு³ னித்ய ॥
    ta: |
      மாத⁴வன த³யதி³ந்த³ ஆதி³பூஜெகெ³ அர்ஹ
      நாத³ தே³வனு நீனு மூர்ஜக³தி³ ।
      ஆ தே³வ த³னுஜ மனுஜரெல்லரு நின்ன
      ஆதி³யல்லி நின்ன பூஜிபரு ॥
      
      பா³த³ராயண பேள்த³ புராணங்க³ள ப³ரெது³
      ஸாது⁴ ஸஜ்ஜனரிகெ³ மோத³வித்தெ ।
      ஸ்ரீத⁴வ அபி⁴னவ ப்ராணேஶவிட²லன
      பாத³ ப⁴ஜனெயித்து மோத³ கொடு³ நித்ய ॥
      மாத⁴வன த³யதி³ந்த³ ஆதி³பூஜெகெ³ அர்ஹ
      நாத³ தே³வனு நீனு மூர்ஜக³தி³ ।
      ஆ தே³வ த³னுஜ மனுஜரெல்லரு நின்ன
      ஆதி³யல்லி நின்ன பூஜிபரு ॥
      
      பா³த³ராயண பேள்த³ புராணங்க³ள ப³ரெது³
      ஸாது⁴ ஸஜ்ஜனரிகெ³ மோத³வித்தெ ।
      ஸ்ரீத⁴வ அபி⁴னவ ப்ராணேஶவிட²லன
      பாத³ ப⁴ஜனெயித்து மோத³ கொடு³ நித்ய ॥
    hi: |
      माधवन दयदिन्द आदिपूजेगे अर्ह
      नाद देवनु नीनु मूर्जगदि ।
      आ देव दनुज मनुजरेल्लरु निन्न
      आदियल्लि निन्न पूजिपरु ॥
      
      बादरायण पेळ्द पुराणङ्गळ बरेदु
      साधु सज्जनरिगे मोदवित्ते ।
      श्रीधव अभिनव प्राणेशविठलन
      पाद भजनेयित्तु मोद कोडु नित्य ॥
    en: |
      mādhavana dayadinda ādipūjege arha
      nāda dēvanu nīnu mūrjagadi ।
      ā dēva danuja manujarellaru ninna
      ādiyalli ninna pūjiparu ॥
      
      bādarāyaṇa pēḷda purāṇaṅgaḷa baredu
      sādhu sajjanarige mōdavitte ।
      śrīdhava abhinava prāṇēśaviṭhalana
      pāda bhajaneyittu mōda koḍu nitya ॥

  - type: 
    number: 4
    subtitle_kn: ಅಟ್ಟತಾಳ
    subtitle_ta: அட்டதாள
    subtitle_hi: अट्टताळ
    subtitle_en: aṭṭatāḷa
    kn: |
      ಶ್ರೀರಾಮಚಂದ್ರನು ಸೇತುಮುಖದಿ ನಿನ್ನ ।
      ಆರಾಧಿಸಿದನು ಸ್ಥಾಪಿಸಿ ಪೂಜಿಸಿ ।
      ಆ ರಾವಣಾನುಜ ವಿಭೀಷಣನರ್ಚಿಸೆ ।
      ಭೂರಿ ಲಂಕಾಪುರ ರಾಜ್ಯವ ಪಡೆದನು ॥
      
      ಶೌರಿ ಆಜ್ಞದಿ ನಿನ್ನ ಪೂಜಿಸಿ ಧರ್ಮಜ
      ಭಾರತ ಯುದ್ಧದಿ ಜಯಶೀಲನಾದನು ।
      ಕೌರವೇಂದ್ರನು ನಿನ್ನ ಭಜಿಸದ ಕಾರಣ
      ಪಾರ ಬಂಧುಗಳೊಡನೆ ವಿಲಯವ ಪೊಂದಿದ ॥
      
      ವಾರಿಧಿಸುತ ನಿನ್ನ ಅಪಹಾಸ್ಯ ಮಾಡಿದ
      ಕಾರಣ ಲೋಕದಿ ಕಳೆಹೀನನಾದನು ।
      ಆರನೇ ಮಾಸದಿ ಸಿತ ಚತುರ್ಥಿಯ ದಿನ
      ಹೇರಂಬನೇ ನಿನ್ನ ವರ್ಧಂತಿಯುತ್ಸವ ॥
      
      ಮೂರು ಲೋಕದಿ ಜನಪಾರ ಹರುಷದಿಂದ
      ಆರಾಧಿಸಿ ನಿನ್ನ ಸೇವಿಸಿ ನಲಿವರು ।
      ಮಾರಮಣನ ದಯ ವೆಂತುಂಟೋ ನಿನ್ನಲ್ಲಿ
      ಪಾರುಗಾಣೆನು ನಿನ್ನ ಮಹಿಮೆಗೆ ನಮೋ ನಮೋ ॥
      
      ವಾರಿಚೋದರ ತಾನೇ ತತ್ವೇಶರೊಡಗೂಡಿ
      ಸರುವ ಜೀವರೊಳಿದ್ದು ಕಾರ್ಯ ಮಾಡುವನೆಂಬ ।
      ಚಾರು ಸುಜ್ಞಾನವ ಕರುಣಿಸು ಪಾಲಿಸು
      ಬೇರೊಂದು ಬಯಸೇನು ಬಿಜ್ಜೋದರ ನಿನ್ನ ॥
      
      ವಾರಿಜಾಕ್ಷಭಿನವ ಪ್ರಾಣೇಶವಿಠಲನ ।
      ಚಾರು ಚರಣಗಳಲ್ಲಿ ಮನವ ನಿಲ್ಲಿಸು ಜೀಯಾ ॥
      ஸ்ரீராமசந்த்³ரனு ஸேதுமுக²தி³ னின்ன ।
      ஆராதி⁴ஸித³னு ஸ்தா²பிஸி பூஜிஸி ।
      ஆ ராவணானுஜ விபீ⁴ஷணனர்சிஸெ ।
      பூ⁴ரி லங்காபுர ராஜ்யவ படெ³த³னு ॥
      
      ஶௌரி ஆக்³ஞதி³ னின்ன பூஜிஸி த⁴ர்மஜ
      பா⁴ரத யுத்³த⁴தி³ ஜயஶீலனாத³னு ।
      கௌரவேந்த்³ரனு னின்ன ப⁴ஜிஸத³ காரண
      பார ப³ந்து⁴க³ளொட³னெ விலயவ பொந்தி³த³ ॥
      
      வாரிதி⁴ஸுத னின்ன அபஹாஸ்ய மாடி³த³
      காரண லோகதி³ களெஹீனனாத³னு ।
      ஆரனே மாஸதி³ ஸித சதுர்தி²ய தி³ன
      ஹேரம்ப³னே னின்ன வர்த⁴ந்தியுத்ஸவ ॥
      
      மூரு லோகதி³ ஜனபார ஹருஷதி³ந்த³
      ஆராதி⁴ஸி னின்ன ஸேவிஸி னலிவரு ।
      மாரமணன த³ய வெந்துண்டோ னின்னல்லி
      பாருகா³ணெனு னின்ன மஹிமெகெ³ னமோ னமோ ॥
      
      வாரிசோத³ர தானே தத்வேஶரொட³கூ³டி³
      ஸருவ ஜீவரொளித்³து³ கார்ய மாடு³வனெம்ப³ ।
      சாரு ஸுக்³ஞானவ கருணிஸு பாலிஸு
      பே³ரொந்து³ ப³யஸேனு பி³ஜ்ஜோத³ர னின்ன ॥
      
      வாரிஜாக்ஷபி⁴னவ ப்ராணேஶவிட²லன ।
      சாரு சரணக³ளல்லி மனவ னில்லிஸு ஜீயா ॥
