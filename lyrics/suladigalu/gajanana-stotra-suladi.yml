      सिद्धिविनायक विद्यप्रदायक ।
      सद्योजातन मुद्दु मोहदसुत ।
      बद्धविषयदिह बुद्धिमनगळनु ।
      तिद्दि ज्ञान भकुतिगळित्तु हरिपद ।
      
      पद्मयुगदि सदा मग्नवागिरिसय्य ।
      बद्धाञ्जलियागि प्रार्थिपे गगनेशा ।
      मध्वान्तर्गत हरि गुण गायन ।
      पद्य सुळादिगळिन्द माडि पाडुत ।
      
      मध्वपनोलिसिद दधिशिले निलयने ।
      मध्वपति अभिनव प्राणेशविठलन । (2)
      पदपद्मगळल्लि दृढ़भक्ति नीडु ॥
    en: |
      siddhivināyaka vidyapradāyaka ।
      sadyōjātana muddu mōhadasuta ।
      baddhaviṣayadiha buddhimanagaḷanu ।
      tiddi jñāna bhakutigaḷittu haripada ।
      
      padmayugadi sadā magnavāgirisayya ।
      baddhāñjaliyāgi prārthipe gaganēśā ।
      madhvāntargata hari guṇa gāyana ।
      padya suḷādigaḷinda māḍi pāḍuta ।
      
      madhvapanolisida dadhiśile nilayane ।
      madhvapati abhinava prāṇēśaviṭhalana । (2)
      padapadmagaḷalli dṛḍhabhakti nīḍu ॥

