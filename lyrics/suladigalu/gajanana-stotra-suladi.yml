verses:
  - type: 
    number: 1
    subtitle_kn: ಧ್ರುವತಾಳ
    subtitle_ta: த்⁴ருவதாள
    subtitle_hi: ध्रुवताळ
    subtitle_en: dhruvatāḷa
    kn: |
      ಕರಿರಾಜ ಕಂಧರ ರಜತಾದ್ರಿ ಮಂದಿರ
      ಉರಗ ಕಟಿಬಂಧನ ಮೂಷಿಕಶ್ಯಂದನ ।
      ಗಿರಿರಾಜ ಸುತೆ ಪಾರ್ವತಿ ತನುಮೃದ್ಭವ
      ಕರ ಚತುಷ್ಟಯ ದಶನ ಮೋದಕ ಪಾಶಾಂಕುಶ ॥
      
      ಧರ ಕುಂಕುಮಾಂಬರ ಲಂಬೋದರ
      ಶೂರ್ಪಕರ್ಣನೆ ಮಂಗಳಾಂಗ ಭಸ್ಮಾಂಗನೆ ।
      ಧರಿಪ ಭಂಜನ ಖಳ ಪೂರ್ವದೇವತೆಗಳ
      ಹರಿ ವಿಶ್ವ ಅಭಿನವ ಪ್ರಾಣೇಶವಿಠಲನ  (2)
      ಚರಣ ವಾರಿಜ ಭೃಂಗ ನತದಯಾಪಾಂಗ ॥
      கரிராஜ கந்த⁴ர ரஜதாத்³ரி மந்தி³ர
      உரக³ கடிப³ந்த⁴ன மூஷிகஶ்யந்த³ன ।
      கி³ரிராஜ ஸுதெ பார்வதி தனுமருத்³ப⁴வ
      கர சதுஷ்டய த³ஶன மோத³க பாஶாங்குஶ ॥
      
      த⁴ர குங்குமாம்ப³ர லம்போ³த³ர
      ஶூர்பகர்ணனெ மங்க³ளாங்க³ ப⁴ஸ்மாங்க³னெ ।
      த⁴ரிப ப⁴ஞ்ஜன க²ள பூர்வதே³வதெக³ள
      ஹரி விஶ்வ அபி⁴னவ ப்ராணேஶவிட²லன  (2)
      சரண வாரிஜ பரு⁴ங்க³ னதத³யாபாங்க³ ॥
    ta: |
