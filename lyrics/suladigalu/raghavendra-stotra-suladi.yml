      வரப்ரத³ ஸ்ரீ த⁴ன்வந்த்ரி விட²லன்ன னிஜ தா³ஸ |
      ஶிரோ மணியெ னமோ தொ⁴ரெயெ ஶாஶ்வத ப²லத³ ||
