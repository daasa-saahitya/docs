verses:
  - type: None
    number: 1
    subtitle_kn: ಧ್ರುವತಾಳ
    subtitle_ta: த்⁴ருவதாள
    subtitle_hi: ध्रुवताळ
    subtitle_en: dhruvatāḷa
    kn: |
      ಗುರು ರಾಯ ಮಹರಾಯ ಗುಣಪೂರ್ಣ ರಾಘವೇಂದ್ರ |
      ಧೊರೆಯೆ ಕಾರುಣ್ಯನಿಧಿ ಸುರ ತರುವೆ |
      ಮರುತಾವತಾರ ಮಧ್ವ ಮುನಿಯ ಭಜಕ ಶ್ರೇಷ್ಠ |
      ಧರೆಯೊಳು ಪಾಮರರನ್ನ ಉದ್ಧರಿಪ ಮಹಿಮ |
      ವರಮಣಿ ಕಾಮಧೇನು ಶರಣು ಹೊಕ್ಕವರಿಗೆ |
      ಪೊರೆದು ವಿಸ್ತರಿಸಿತು ಜಗದಿ ಕೀರ್ತಿ |
      ಧರಣಿ ಪಾಲಕ ಶ್ರೀ ಧನ್ವಂತ್ರಿ ವಿಠಲ |
      ಹರಿಯ ಚರಣಧೇನಿಪ ಮಹ ಪರತರ ಯತಿ ಶ್ರೇಷ್ಠ
      கு³ரு ராய மஹராய கு³ணபூர்ண ராக⁴வேந்த்³ர |
      தொ⁴ரெயெ காருண்யனிதி⁴ ஸுர தருவெ |
      மருதாவதார மத்⁴வ முனிய ப⁴ஜக ஸ்ரேஷ்ட² |
      த⁴ரெயொளு பாமரரன்ன உத்³த⁴ரிப மஹிம |
      வரமணி காமதே⁴னு ஶரணு ஹொக்கவரிகெ³ |
      பொரெது³ விஸ்தரிஸிது ஜக³தி³ கீர்தி |
      த⁴ரணி பாலக ஸ்ரீ த⁴ன்வந்த்ரி விட²ல |
      ஹரிய சரணதே⁴னிப மஹ பரதர யதி ஸ்ரேஷ்ட²
    ta: |
      கு³ரு ராய மஹராய கு³ணபூர்ண ராக⁴வேந்த்³ர |
