      விஜயவிட்²ட²ல ரங்க³ராஜ
      ராஜ ஸமுத்³ரராஜஶயனனே ॥
    hi: |
      राज राजरमणि राजशेखर विनुता
      राज तेजोनिधि राजाधीश
      राजहंसा नयना राजशेखर वि -
      राजित कीर्ति गजराजवरदा
      
      राजवदना रिपुराज मस्तकशूला
      राजराजोत्तुम राजविनुता
      राजीवदोळगिद्द राजीवन पुट्टिसिद
      राजमार्ताण्ड द्विजराजगमना
      
      राज राजरु निन्न राजिसुव चरण -
      राजीवदल्लि वालग माळ्परू
      राज राजाग्रण्य राजाभिषेकक्के
      राज नीनल्लदे राजरुण्टे
      
      राज गम्भीर अपराजितनाम नम्म
      विजयविठ्ठल रङ्गराज
      राज समुद्रराजशयनने ॥
    en: |
      rāja rājaramaṇi rājaśēkhara vinutā
      rāja tējōnidhi rājādhīśa
      rājahaṃsā nayanā rājaśēkhara vi -
      rājita kīrti gajarājavaradā
      
      rājavadanā ripurāja mastakaśūlā
      rājarājōttuma rājavinutā
      rājīvadoḷagidda rājīvana puṭṭisida
      rājamārtāṇḍa dvijarājagamanā
      
      rāja rājaru ninna rājisuva caraṇa -
      rājīvadalli vālaga māḷparū
      rāja rājāgraṇya rājābhiṣēkakke
      rāja nīnallade rājaruṇṭē
      
      rāja gambhīra aparājitanāma namma
      vijayaviṭhṭhala raṅgarāja
      rāja samudrarājaśayananē ॥

  - type: None
    number: 2
    subtitle_kn: ಮಟ್ಟತಾಳ
    subtitle_ta: மட்டதாள
    subtitle_hi: मट्टताळ
    subtitle_en: maṭṭatāḷa
    kn: |
      ದಶಶಿರನೆಂಬುವನು ಅಸಮ ವೀರನಾಗಿ
      ಬಿಸಿನಿಧಿ ಮಧ್ಯದಲ್ಲಿ ತ್ರಿದಶರ ಶೆರೆ ಇಡಲು
      ದಶದಿಕ್ಕಿನ ಒಳಗೆ ಪೆಸರಾಗಿ ಪಸರಿಸುತ
      ಪಶುಪನ ವರದಿಂದ ಕುಸಿಯದಲಿರುತಿರೇ
      ಅಸುರನ ಉಪಹತಿಗೆ ವಸುಧಿ ಭಾರವಾಗೆ
      ಬಿಸಿಜಾಭವ ಸುಮನಸರೆಲ್ಲರು ಪೋಗಿ
      ಬಿಸಿಜದಳನಯನ ವಸುಧಿ ಸಂರಕ್ಷಕನೇ
      ಅಸುರರ ಶಿಕ್ಷಕನೆ ಆ ಸಮಯ ಬಂದಿದೆ
      ದೆಶೆಗೆಟ್ಟವರ ಪಾಲಿಸಬೇಕೆಂದೆನುತ
      ಶಿಶುಗಳೊದರಿದಂತೆ ಎಸದು ಮೊರೆಯಿಡಲು
      ವೃಷಭನಾಮಕದೇವ ವಿಜಯವಿಠ್ಠಲರೇಯನ 
      ಬಿಸಿಜ ಚರಣದಲ್ಲಿ ಹಸನಾಗಿ ಬಿನ್ನೈಸೇ ॥
      த³ஶஶிரனெம்பு³வனு அஸம வீரனாகி³
      பி³ஸினிதி⁴ மத்⁴யத³ல்லி த்ரித³ஶர ஶெரெ இட³லு
      த³ஶதி³க்கின ஒளகெ³ பெஸராகி³ பஸரிஸுத
      பஶுபன வரதி³ந்த³ குஸியத³லிருதிரே
      அஸுரன உபஹதிகெ³ வஸுதி⁴ பா⁴ரவாகெ³
      பி³ஸிஜாப⁴வ ஸுமனஸரெல்லரு போகி³
      பி³ஸிஜத³ளனயன வஸுதி⁴ ஸம்ரக்ஷகனே
      அஸுரர ஶிக்ஷகனெ ஆ ஸமய ப³ந்தி³தெ³
      தெ³ஶெகெ³ட்டவர பாலிஸபே³கெந்தெ³னுத
      ஶிஶுக³ளொத³ரித³ந்தெ எஸது³ மொரெயிட³லு
      வருஷப⁴னாமகதே³வ விஜயவிட்²ட²லரேயன 
      பி³ஸிஜ சரணத³ல்லி ஹஸனாகி³ பி³ன்னைஸே ॥
