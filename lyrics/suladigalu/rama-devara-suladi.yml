      ஸார்வபௌ⁴மனெ ராமா து³ருள தை³த்ய விராமா
      ஸர்வயோகி³ வினிஸ்ருதா விஜயவிட்²ட²ல ॥
    hi: |
      सार्वभौमने रामा दुरुळ दैत्य विरामा
      सर्वयोगि विनिश्रुता विजयविठ्ठल ॥
    en: |
      sārvabhaumane rāmā duruḷa daitya virāmā
      sarvayōgi viniśrutā vijayaviṭhṭhala ॥

