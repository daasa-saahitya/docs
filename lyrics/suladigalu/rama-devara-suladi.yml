    hi: |
      मुनिप कौशिकन यागव कायिदु ताटकि
      दनुजिय मुरिदु निजा -
      ननुजन कूड जनक पुरके ग -
      मनवागि पोगुत्त मुनियां -
      गनिय शापवन्ने तोडदू अनला -
      क्षन धनसु मुरिदु निक्कडि माडि
      जनकरायन नन्दनिय नेरदू
      अनुवारदोळगे भृगु तनुजन्न पोक्कळलि
      दनुज सेरिरलु बाणदलि सददू
      तनगे ताने लीले तोरिद महदैव
      वातने काणो गोहित विजयविठ्ठल राम ॥
    en: |
      munipa kauśikana yāgava kāyidu tāṭaki
      danujiya muridu nijā -
      nanujana kūḍa janaka purake ga -
      manavāgi pōgutta muniyāṃ -
      ganiya śāpavanne toḍadū analā -
      kṣna dhanasu muridu nikkaḍi māḍi
      janakarāyana nandaniya neradū
      anuvāradoḷage bhṛgu tanujanna pokkaḷali
      danuja sēriralu bāṇadali sadadū
      tanage tānē līle tōrida mahadaiva
      vātane kāṇō gōhita vijayaviṭhṭhala rāma ॥

  - type: None
    number: 3
    subtitle_kn: ತ್ರಿಪುಟತಾಳ
    subtitle_ta: த்ரிபுடதாள
    subtitle_hi: त्रिपुटताळ
    subtitle_en: tripuṭatāḷa
    kn: |
      ಪಿತನ ಮಾತನು ಮನ್ನಿಸಿ ಸತಿಸಹಿತ ಭಾಗೀ -
      ರಥಿಯ ದಾಟುತಲಿ ಭಕುತಗೊಲಿದೂ
      ಅತಿಶಯವಾದ ಪರ್ವತ ಚಿತ್ರಕೂಟದಲಿ 
      ಯತಿಗಳಿಂದಲಿ ಪೂಜಿತನಾಗುತ
      ಮತಿಹೀನನಾಗಿ ಬಾಳುತಲಿದ್ದ ಕಾಕನ್ನ
      ಗತ ಲೋಚನನ ಮಾಡಿ ಕ್ಷಿತಿಗಟ್ಟಿದೇ
      ಹಿತವಾಗಿ ಬಂದ ಭರತಗೆ ಹಾವಿಗೆ ಕೊಟ್ಟು
      ವ್ರತವ ಧರಿಸಿದ ಉನ್ನತ ಮಹಿಮಾ
      ಪಥಚಾರನಾಗಿ ಶೋಭಿಸುತ ದಂಡಕಾರಣ್ಯ
      ಯತಿಪುಂಗವ ಕುಂಭಸುತನ ಕಂಡು
      ಪ್ರತಿರಥನಾಮಾ ವಿಜಯವಿಠ್ಠಲ ರಘು -
      ಪತಿ ನೀನೆ ಉತ್ಪತ್ತಿ ಸ್ಥಿತಿ ಲಯಕರ್ತನೇ ॥
      பிதன மாதனு மன்னிஸி ஸதிஸஹித பா⁴கீ³ -
      ரதி²ய தா³டுதலி ப⁴குதகொ³லிதூ³
      அதிஶயவாத³ பர்வத சித்ரகூடத³லி 
      யதிக³ளிந்த³லி பூஜிதனாகு³த
      மதிஹீனனாகி³ பா³ளுதலித்³த³ காகன்ன
      க³த லோசனன மாடி³ க்ஷிதிக³ட்டிதே³
      ஹிதவாகி³ ப³ந்த³ ப⁴ரதகெ³ ஹாவிகெ³ கொட்டு
      வ்ரதவ த⁴ரிஸித³ உன்னத மஹிமா
      பத²சாரனாகி³ ஶோபி⁴ஸுத த³ண்ட³காரண்ய
      யதிபுங்க³வ கும்ப⁴ஸுதன கண்டு³
      ப்ரதிரத²னாமா விஜயவிட்²ட²ல ரகு⁴ -
      பதி னீனெ உத்பத்தி ஸ்தி²தி லயகர்தனே ॥
