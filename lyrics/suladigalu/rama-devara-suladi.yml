verses:
  - type: None
    number: 1
    subtitle_kn: ಧ್ರುವತಾಳ
    subtitle_ta: த்⁴ருவதாள
    subtitle_hi: ध्रुवताळ
    subtitle_en: dhruvatāḷa
    kn: |
      ರಾಜ ರಾಜರಮಣಿ ರಾಜಶೇಖರ ವಿನುತಾ
      ರಾಜ ತೇಜೋನಿಧಿ ರಾಜಾಧೀಶ
      ರಾಜಹಂಸಾ ನಯನಾ ರಾಜಶೇಖರ ವಿ -
      ರಾಜಿತ ಕೀರ್ತಿ ಗಜರಾಜವರದಾ
      
      ರಾಜವದನಾ ರಿಪುರಾಜ ಮಸ್ತಕಶೂಲಾ
      ರಾಜರಾಜೋತ್ತುಮ ರಾಜವಿನುತಾ
      ರಾಜೀವದೊಳಗಿದ್ದ ರಾಜೀವನ ಪುಟ್ಟಿಸಿದ
      ರಾಜಮಾರ್ತಾಂಡ ದ್ವಿಜರಾಜಗಮನಾ
      
      ರಾಜ ರಾಜರು ನಿನ್ನ ರಾಜಿಸುವ ಚರಣ -
      ರಾಜೀವದಲ್ಲಿ ವಾಲಗ ಮಾಳ್ಪರೂ
      ರಾಜ ರಾಜಾಗ್ರಣ್ಯ ರಾಜಾಭಿಷೇಕಕ್ಕೆ
      ರಾಜ ನೀನಲ್ಲದೆ ರಾಜರುಂಟೇ
      
      ರಾಜ ಗಂಭೀರ ಅಪರಾಜಿತನಾಮ ನಮ್ಮ
      ವಿಜಯವಿಠ್ಠಲ ರಂಗರಾಜ
      ರಾಜ ಸಮುದ್ರರಾಜಶಯನನೇ ॥
      ராஜ ராஜரமணி ராஜஶேக²ர வினுதா
      ராஜ தேஜோனிதி⁴ ராஜாதீ⁴ஶ
      ராஜஹம்ஸா னயனா ராஜஶேக²ர வி -
      ராஜித கீர்தி க³ஜராஜவரதா³
      
      ராஜவத³னா ரிபுராஜ மஸ்தகஶூலா
      ராஜராஜோத்தும ராஜவினுதா
      ராஜீவதொ³ளகி³த்³த³ ராஜீவன புட்டிஸித³
      ராஜமார்தாண்ட³ த்³விஜராஜக³மனா
      
      ராஜ ராஜரு னின்ன ராஜிஸுவ சரண -
      ராஜீவத³ல்லி வாலக³ மாள்பரூ
      ராஜ ராஜாக்³ரண்ய ராஜாபி⁴ஷேகக்கெ
      ராஜ னீனல்லதெ³ ராஜருண்டே
      
      ராஜ க³ம்பீ⁴ர அபராஜிதனாம னம்ம
      விஜயவிட்²ட²ல ரங்க³ராஜ
      ராஜ ஸமுத்³ரராஜஶயனனே ॥
