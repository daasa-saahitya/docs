      ஆராத⁴னெய மாடெ³ ஸ்ரீராமனெந்தெ³ம்ப³வ -
      தாரவன்னு த⁴ரிஸித³ ரமாரமணனூ
      சாருகு³ண நிலய விஜயவிட்²ட²லரேயா 
      ஸாரித³வர மனோஹரவ தோருத்தா ॥
    hi: |
      मूरु गुणरहित मूरुति ईतन
      कारुण्यवन्नु इन्नारु बल्लवरिल्ल
      वारिजाद्यर सारेगेरदु श -
      रीरव तडवरिसि तारतम्यदिन्द
      भार एन्नदु एन्दु भरवसव इत्तु
      क्रूरनिन्दलि बन्द भार इळिसुवेनेन्दु
      धारुणियोळगित्त ईरैदु रथदवनु
      नारायणनु कुमारनागलेन्दू
      आराधनेय माडे श्रीरामनेन्देम्बव -
      तारवन्नु धरिसिद रमारमणनू
      चारुगुण निलय विजयविठ्ठलरेया 
      सारिदवर मनोहरव तोरुत्ता ॥
    en: |
      mūru guṇarahita mūruti ītana
      kāruṇyavannu innāru ballavarilla
      vārijādyara sāregeradu śa -
      rīrava taḍavarisi tāratamyadinda
      bhāra ennadu endu bharavasava ittu
      krūranindali banda bhāra iḷisuvenendu
      dhāruṇiyoḷagitta īraidu rathadavanu
      nārāyaṇanu kumāranāgalendū
      ārādhaneya māḍe śrīrāmanendembava -
      tāravannu dharisida ramāramaṇanū
      cāruguṇa nilaya vijayaviṭhṭhalarēyā 
      sāridavara manōharava tōruttā ॥

  - type: None
