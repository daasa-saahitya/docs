      மனவாகி³ போகு³த்த முனியாம் -
      க³னிய ஶாபவன்னெ தொட³தூ³ அனலா -
      க்ஷன த⁴னஸு முரிது³ னிக்கடி³ மாடி³
      ஜனகராயன னந்த³னிய னெரதூ³
      அனுவாரதொ³ளகெ³ பரு⁴கு³ தனுஜன்ன பொக்களலி
      த³னுஜ ஸேரிரலு பா³ணத³லி ஸத³தூ³
      தனகெ³ தானே லீலெ தோரித³ மஹதை³வ
      வாதனெ காணோ கோ³ஹித விஜயவிட்²ட²ல ராம ॥
