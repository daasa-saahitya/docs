    hi: |
      मोसद असुरिय मूगु कोय्दु खर
      दूषणाद्यरन्न कोन्दु गौतुमेयल्लि
      वासवागिद्द मारीच मायामृग
      वेषवागि बरे कोन्दु मार्गदल्लि
      घासियागिद्द विहङ्गन्न मन्निसि
      द्वेषि कबन्धन कडिदु शबरिय
      मीसल भकुतिगे हण्णुसविदु सं -
      तोषदिन्दलि तुङ्गातीरदल्लि पव -
      ना सूनु एरगलु एत्ति माताडि दि -
      नेश तनुजगे अभयवन्नु इत्तु
      बीसि वगदे काललि दुन्धुमारन्न
      नी सवरिदे एळु ताळुव ओम्मेले
      सासिरनामने विजयविठ्ठल नर -
      वेषव धरिसिद वैकुण्ठवास ॥
    en: |
      mōsada asuriya mūgu koydu khara
      dūṣaṇādyaranna kondu gautumeyalli
      vāsavāgidda mārīca māyāmṛga
      vēṣavāgi bare kondu mārgadalli
      ghāsiyāgidda vihaṅganna mannisi
      dvēṣi kabandhana kaḍidu śabariya
      mīsala bhakutige haṇṇusavidu saṃ -
      tōṣadindali tuṅgātīradalli pava -
      nā sūnu eragalu etti mātāḍi di -
      nēśa tanujage abhayavannu ittu
      bīsi vagade kālali dundhumāranna
      nī savaride ēḷu tāḷuva ommele
      sāsiranāmanē vijayaviṭhṭhala nara -
      vēṣava dharisida vaikuṇṭhavāsa ॥

