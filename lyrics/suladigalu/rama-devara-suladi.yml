    hi: |
      पितन मातनु मन्निसि सतिसहित भागी -
      रथिय दाटुतलि भकुतगोलिदू
      अतिशयवाद पर्वत चित्रकूटदलि 
      यतिगळिन्दलि पूजितनागुत
      मतिहीननागि बाळुतलिद्द काकन्न
      गत लोचनन माडि क्षितिगट्टिदे
      हितवागि बन्द भरतगे हाविगे कोट्टु
      व्रतव धरिसिद उन्नत महिमा
      पथचारनागि शोभिसुत दण्डकारण्य
      यतिपुङ्गव कुम्भसुतन कण्डु
      प्रतिरथनामा विजयविठ्ठल रघु -
      पति नीने उत्पत्ति स्थिति लयकर्तने ॥
    en: |
      pitana mātanu mannisi satisahita bhāgī -
      rathiya dāṭutali bhakutagolidū
      atiśayavāda parvata citrakūṭadali 
      yatigaḷindali pūjitanāguta
      matihīnanāgi bāḷutalidda kākanna
      gata lōcanana māḍi kṣitigaṭṭidē
      hitavāgi banda bharatage hāvige koṭṭu
      vratava dharisida unnata mahimā
      pathacāranāgi śōbhisuta daṇḍakāraṇya
      yatipuṅgava kumbhasutana kaṇḍu
      pratirathanāmā vijayaviṭhṭhala raghu -
      pati nīne utpatti sthiti layakartanē ॥

  - type: None
    number: 4
    subtitle_kn: ಅಟ್ಟತಾಳ
    subtitle_ta: அட்டதாள
    subtitle_hi: अट्टताळ
    subtitle_en: aṭṭatāḷa
    kn: |
      ಮೋಸದ ಅಸುರಿಯ ಮೂಗು ಕೊಯ್ದು ಖರ
      ದೂಷಣಾದ್ಯರನ್ನ ಕೊಂದು ಗೌತುಮೆಯಲ್ಲಿ
      ವಾಸವಾಗಿದ್ದ ಮಾರೀಚ ಮಾಯಾಮೃಗ
      ವೇಷವಾಗಿ ಬರೆ ಕೊಂದು ಮಾರ್ಗದಲ್ಲಿ
      ಘಾಸಿಯಾಗಿದ್ದ ವಿಹಂಗನ್ನ ಮನ್ನಿಸಿ
      ದ್ವೇಷಿ ಕಬಂಧನ ಕಡಿದು ಶಬರಿಯ
      ಮೀಸಲ ಭಕುತಿಗೆ ಹಣ್ಣುಸವಿದು ಸಂ -
      ತೋಷದಿಂದಲಿ ತುಂಗಾತೀರದಲ್ಲಿ ಪವ -
      ನಾ ಸೂನು ಎರಗಲು ಎತ್ತಿ ಮಾತಾಡಿ ದಿ -
      ನೇಶ ತನುಜಗೆ ಅಭಯವನ್ನು ಇತ್ತು
      ಬೀಸಿ ವಗದೆ ಕಾಲಲಿ ದುಂಧುಮಾರನ್ನ
      ನೀ ಸವರಿದೆ ಏಳು ತಾಳುವ ಒಮ್ಮೆಲೆ
      ಸಾಸಿರನಾಮನೇ ವಿಜಯವಿಠ್ಠಲ ನರ -
      ವೇಷವ ಧರಿಸಿದ ವೈಕುಂಠವಾಸ ॥
      மோஸத³ அஸுரிய மூகு³ கொய்து³ க²ர
      தூ³ஷணாத்³யரன்ன கொந்து³ கௌ³துமெயல்லி
      வாஸவாகி³த்³த³ மாரீச மாயாமருக³
      வேஷவாகி³ ப³ரெ கொந்து³ மார்க³த³ல்லி
      கா⁴ஸியாகி³த்³த³ விஹங்க³ன்ன மன்னிஸி
      த்³வேஷி கப³ந்த⁴ன கடி³து³ ஶப³ரிய
      மீஸல ப⁴குதிகெ³ ஹண்ணுஸவிது³ ஸம் -
      தோஷதி³ந்த³லி துங்கா³தீரத³ல்லி பவ -
      னா ஸூனு எரக³லு எத்தி மாதாடி³ தி³ -
      னேஶ தனுஜகெ³ அப⁴யவன்னு இத்து
      பீ³ஸி வக³தெ³ காலலி து³ந்து⁴மாரன்ன
      னீ ஸவரிதெ³ ஏளு தாளுவ ஒம்மெலெ
      ஸாஸிரனாமனே விஜயவிட்²ட²ல னர -
      வேஷவ த⁴ரிஸித³ வைகுண்ட²வாஸ ॥
