    hi: |
      दशशिरनेम्बुवनु असम वीरनागि
      बिसिनिधि मध्यदल्लि त्रिदशर शेरे इडलु
      दशदिक्किन ओळगे पेसरागि पसरिसुत
      पशुपन वरदिन्द कुसियदलिरुतिरे
      असुरन उपहतिगे वसुधि भारवागे
      बिसिजाभव सुमनसरेल्लरु पोगि
      बिसिजदळनयन वसुधि संरक्षकने
      असुरर शिक्षकने आ समय बन्दिदे
      देशेगेट्टवर पालिसबेकेन्देनुत
      शिशुगळोदरिदन्ते एसदु मोरेयिडलु
      वृषभनामकदेव विजयविठ्ठलरेयन 
      बिसिज चरणदल्लि हसनागि बिन्नैसे ॥
    en: |
      daśaśiranembuvanu asama vīranāgi
      bisinidhi madhyadalli tridaśara śere iḍalu
      daśadikkina oḷage pesarāgi pasarisuta
      paśupana varadinda kusiyadalirutirē
      asurana upahatige vasudhi bhāravāge
      bisijābhava sumanasarellaru pōgi
      bisijadaḷanayana vasudhi saṃrakṣkanē
      asurara śikṣkane ā samaya bandide
      deśegeṭṭavara pālisabēkendenuta
      śiśugaḷodaridante esadu moreyiḍalu
      vṛṣabhanāmakadēva vijayaviṭhṭhalarēyana 
      bisija caraṇadalli hasanāgi binnaisē ॥

  - type: None
    number: 3
    subtitle_kn: ರೂಪಕತಾಳ
    subtitle_ta: ரூபகதாள
    subtitle_hi: रूपकताळ
    subtitle_en: rūpakatāḷa
    kn: |
      ಮೂರು ಗುಣರಹಿತ ಮೂರುತಿ ಈತನ
      ಕಾರುಣ್ಯವನ್ನು ಇನ್ನಾರು ಬಲ್ಲವರಿಲ್ಲ
      ವಾರಿಜಾದ್ಯರ ಸಾರೆಗೆರದು ಶ -
      ರೀರವ ತಡವರಿಸಿ ತಾರತಮ್ಯದಿಂದ
      ಭಾರ ಎನ್ನದು ಎಂದು ಭರವಸವ ಇತ್ತು
      ಕ್ರೂರನಿಂದಲಿ ಬಂದ ಭಾರ ಇಳಿಸುವೆನೆಂದು
      ಧಾರುಣಿಯೊಳಗಿತ್ತ ಈರೈದು ರಥದವನು
      ನಾರಾಯಣನು ಕುಮಾರನಾಗಲೆಂದೂ
      ಆರಾಧನೆಯ ಮಾಡೆ ಶ್ರೀರಾಮನೆಂದೆಂಬವ -
      ತಾರವನ್ನು ಧರಿಸಿದ ರಮಾರಮಣನೂ
      ಚಾರುಗುಣ ನಿಲಯ ವಿಜಯವಿಠ್ಠಲರೇಯಾ 
      ಸಾರಿದವರ ಮನೋಹರವ ತೋರುತ್ತಾ ॥
      மூரு கு³ணரஹித மூருதி ஈதன
      காருண்யவன்னு இன்னாரு ப³ல்லவரில்ல
      வாரிஜாத்³யர ஸாரெகெ³ரது³ ஶ -
      ரீரவ தட³வரிஸி தாரதம்யதி³ந்த³
      பா⁴ர என்னது³ எந்து³ ப⁴ரவஸவ இத்து
      க்ரூரனிந்த³லி ப³ந்த³ பா⁴ர இளிஸுவெனெந்து³
      தா⁴ருணியொளகி³த்த ஈரைது³ ரத²த³வனு
      னாராயணனு குமாரனாக³லெந்தூ³
      ஆராத⁴னெய மாடெ³ ஸ்ரீராமனெந்தெ³ம்ப³வ -
      தாரவன்னு த⁴ரிஸித³ ரமாரமணனூ
      சாருகு³ண னிலய விஜயவிட்²ட²லரேயா 
      ஸாரித³வர மனோஹரவ தோருத்தா ॥
