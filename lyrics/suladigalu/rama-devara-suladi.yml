    hi: |
      भीति शून्यनाद पुरहूत मगन कोन्दु रवि
      जातगे पट्टवगट्टि प्रीतिदूत वायुजन्न
      आ सीते बळिगे कळुहे पोगि
      मातु तन्द पेळिदातगे वरवनित्तु
      कोति करडि सहितवागि सेतुवे बिगिसि बन्द
      नीत विभीषणन कूड कातुरदिन्दलि दाटि
      धूत रावणादिगळ यातनिगे बीळ्कोडिसि
      प्रीतियास्पदनाद दात विभीषणगे प्र -
      द्योत शशि उळ्ळनक भूतळदोळगे लङ्के -
      य तप्पदन्ते आळेन्दातगे पट्टवगट्टि
      सीते सहित बन्दु साकेतपुरदल्लि निन्दु
      धातादिगळ मनके प्रीति बडिसि शेरेय बिडिसि
      सीतेयरस विजयविठ्ठल भूत -
      नाथनिन्द बन्द मातु मन्निसिद महात्मा ॥
    en: |
      bhīti śūnyanāda purahūta magana kondu ravi
      jātage paṭṭavagaṭṭi prītidūta vāyujanna
      ā sīte baḷige kaḷuhē pōgi
      mātu tanda pēḷidātage varavanittu
      kōti karaḍi sahitavāgi sētuve bigisi banda
      nīta vibhīṣaṇana kūḍa kāturadindali dāṭi
      dhūta rāvaṇādigaḷa yātanige bīḷkoḍisi
      prītiyāspadanāda dāta vibhīṣaṇage pra -
      dyōta śaśi uḷḷanaka bhūtaḷadoḷage laṅke -
      ya tappadante āḷendātage paṭṭavagaṭṭi
      sīte sahita bandu sākētapuradalli nindu
      dhātādigaḷa manake prīti baḍisi śereya biḍisi
      sīteyarasa vijayaviṭhṭhala bhūta -
      nāthaninda banda mātu mannisida mahātmā ॥

  - type: None
    subtitle_kn: ಜತೆ
    subtitle_ta: ஜதெ
    subtitle_hi: जते
    subtitle_en: jate
    kn: |
      ಸಾರ್ವಭೌಮನೆ ರಾಮಾ ದುರುಳ ದೈತ್ಯ ವಿರಾಮಾ
      ಸರ್ವಯೋಗಿ ವಿನಿಶ್ರುತಾ ವಿಜಯವಿಠ್ಠಲ ॥
      ஸார்வபௌ⁴மனெ ராமா து³ருள தை³த்ய விராமா
      ஸர்வயோகி³ வினிஸ்ருதா விஜயவிட்²ட²ல ॥
    ta: |
      ஸார்வபௌ⁴மனெ ராமா து³ருள தை³த்ய விராமா
