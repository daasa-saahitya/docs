verses:
  - type: None
    number: 1
    subtitle_kn: ಧ್ರುವತಾಳ
    subtitle_ta: த்⁴ருவதாள
    subtitle_hi: ध्रुवताळ
    subtitle_en: dhruvatāḷa
    kn: |
      ಜಗವೆಲ್ಲಾ ವ್ಯಾಪಿಸಿದ ಬಲು ಅತೀಂದ್ರಿಯ ಪಾದ 
      ಪಗೆಗಳ ಮಸ್ತಕಾದ್ರಿಗೆ ವಜ್ರಪ್ರಹರ ಪಾದ 
      ಝಗಝಗಿಸುವ ಪರಮ ಮಂಗಳ ಖಣಿಯ ಪಾದ 
      ನಿಗಮಾವಳಿಗೆ ಇದು ನಿಲುಕದ ಪಾದ 
      ಅಗಣಿತ ಗುಣಪೂರ್ಣ ಸೌಮ್ಯ ಪಾದ 
      ತ್ರಿಗುಣಾತೀತವಾದ ಶೃಂಗಾರನಿಧಿ ಪಾದ 
      ಗಗನ ನದಿಯ ಪೆತ್ತ ಗಂಭೀರ ಪಾದ 
      ಖಗರಾಜನ ದಿವ್ಯ ಪೆಗಲಲ್ಲಿ ಪೊಳೆವ ಪಾದ 
      ಯುಗಯುಗದಲ್ಲಿ ಇಲ್ಲಿ ಪೂಜೆಗೊಂಬುವ ಪಾದ 
      ಬಗೆ ಬಗೆ ವರಗಳ ಕೊಡುವ ಪಾದ 
      ಮಿಗೆ ಸಹಾಸವುಳ್ಳ ಮಿಸಣಿಯಾಭರಣ ಪಾದ 
      ಅಘದೂರ ಪಾದ ಅತಿಚಿತ್ರ ಪಾದ 
      ನಗವೈರಿನುತ ನಮ್ಮ ವಿಜಯವಿಠ್ಠಲ ಪ -
    ta: |
      ஜக³வெல்லா வ்யாபிஸித³ ப³லு அதீந்த்³ரிய பாத³ 
      பகெ³க³ள மஸ்தகாத்³ரிகெ³ வஜ்ரப்ரஹர பாத³ 
      ஜ²க³ஜ²கி³ஸுவ பரம மங்க³ள க²ணிய பாத³ 
      நிக³மாவளிகெ³ இது³ நிலுகத³ பாத³ 
      அக³ணித கு³ணபூர்ண ஸௌம்ய பாத³ 
      த்ரிகு³ணாதீதவாத³ ஶருங்கா³ரனிதி⁴ பாத³ 
      க³க³ன நதி³ய பெத்த க³ம்பீ⁴ர பாத³ 
      க²க³ராஜன தி³வ்ய பெக³லல்லி பொளெவ பாத³ 
      யுக³யுக³த³ல்லி இல்லி பூஜெகொ³ம்பு³வ பாத³ 
      ப³கெ³ ப³கெ³ வரக³ள கொடு³வ பாத³ 
      மிகெ³ ஸஹாஸவுள்ள மிஸணியாப⁴ரண பாத³ 
      அக⁴தூ³ர பாத³ அதிசித்ர பாத³ 
      நக³வைரினுத நம்ம விஜயவிட்²ட²ல ப - 
      ந்னக³ஶாயிய பாத³ விஷ்ணுபாத³ ॥
    hi: |
      जगवेल्ला व्यापिसिद बलु अतीन्द्रिय पाद 
      पगेगळ मस्तकाद्रिगे वज्रप्रहर पाद 
      झगझगिसुव परम मङ्गळ खणिय पाद 
      निगमावळिगे इदु निलुकद पाद 
      अगणित गुणपूर्ण सौम्य पाद 
      त्रिगुणातीतवाद शृङ्गारनिधि पाद 
      गगन नदिय पेत्त गम्भीर पाद 
      खगराजन दिव्य पेगलल्लि पोळेव पाद 
      युगयुगदल्लि इल्लि पूजेगोम्बुव पाद 
      बगे बगे वरगळ कोडुव पाद 
      मिगे सहासवुळ्ळ मिसणियाभरण पाद 
      अघदूर पाद अतिचित्र पाद 
      नगवैरिनुत नम्म विजयविठ्ठल प - 
      न्नगशायिय पाद विष्णुपाद ॥
    en: |
      jagavellā vyāpisida balu atīndriya pāda 
      pagegaḷa mastakādrige vajraprahara pāda 
      jhagajhagisuva parama maṅgaḷa khaṇiya pāda 
      nigamāvaḷige idu nilukada pāda 
      agaṇita guṇapūrṇa saumya pāda 
      triguṇātītavāda śṛṅgāranidhi pāda 
      gagana nadiya petta gambhīra pāda 
      khagarājana divya pegalalli poḷeva pāda 
      yugayugadalli illi pūjegombuva pāda 
      bage bage varagaḷa koḍuva pāda 
      mige sahāsavuḷḷa misaṇiyābharaṇa pāda 
      aghadūra pāda aticitra pāda 
      nagavairinuta namma vijayaviṭhṭhala pa - 
      nnagaśāyiya pāda viṣṇupāda ॥

  - type: None
    number: 2
    subtitle_kn: ಮಟ್ಟತಾಳ
    subtitle_ta: மட்டதாள
    subtitle_hi: मट्टताळ
    subtitle_en: maṭṭatāḷa
    kn: |
      ಧರ್ಮ ಶಿಲಿಯ ಮೇಲೆ ಮೆರೆವ ಮಣಿಯ ಪಾದ 
      ಕರ್ಮ ಖಂಡನೆ ಮಾಳ್ಪ ಕಲುಷ ವಿಗತ ಪಾದ 
      ಕರ್ಮವರ್ಮ ಮರ್ಮ ಕರ್ಮ ಸಂಗದ ಪಾದ 
      ಪೇರ್ಮೆಯುನ್ನತವಾದ ಪ್ರೇಮಭರಿತ ಪಾದ 
      ಕೂರ್ಮರೂಪ ನಮ್ಮ ವಿಜಯವಿಠ್ಠಲರೇಯನ
    ta: |
      த⁴ர்ம ஶிலிய மேலெ மெரெவ மணிய பாத³ 
      கர்ம க²ண்ட³னெ மாள்ப கலுஷ விக³த பாத³ 
      கர்மவர்ம மர்ம கர்ம ஸங்க³த³ பாத³ 
      பேர்மெயுன்னதவாத³ ப்ரேமப⁴ரித பாத³ 
      கூர்மரூப நம்ம விஜயவிட்²ட²லரேயன 
      த⁴ர்ம மூருதிய பாத³ ஸிரிபாத³ ॥
    hi: |
      धर्म शिलिय मेले मेरेव मणिय पाद 
      कर्म खण्डने माळ्प कलुष विगत पाद 
      कर्मवर्म मर्म कर्म सङ्गद पाद 
      पेर्मेयुन्नतवाद प्रेमभरित पाद 
      कूर्मरूप नम्म विजयविठ्ठलरेयन 
      धर्म मूरुतिय पाद सिरिपाद ॥
    en: |
      dharma śiliya mēle mereva maṇiya pāda 
      karma khaṇḍane māḷpa kaluṣa vigata pāda 
      karmavarma marma karma saṅgada pāda 
      pērmeyunnatavāda prēmabharita pāda 
      kūrmarūpa namma vijayaviṭhṭhalarēyana 
      dharma mūrutiya pāda siripāda ॥

  - type: None
    number: 3
    subtitle_kn: ತ್ರಿಪುಟತಾಳ
    subtitle_ta: த்ரிபுடதாள
    subtitle_hi: त्रिपुटताळ
    subtitle_en: tripuṭatāḷa
    kn: |
      ದಹರಾಕಾಶದಲ್ಲಿ ಮಿಂಚುವ ಘನಪಾದ 
      ಬಹುಗಮನವಾಗಿದ್ದ ಭಾಗ್ಯ ಪಾದ 
      ಅಹೋರಾತ್ರಿಯಲಿ ಬಿಡದೆ ಆನಂದದ ಪಾದ 
      ಮಹ ಪುಣ್ಯ ತಂದೀವ ಮಂತ್ರ ಪಾದ 
      ದ್ರೋಹಿ ಮಾನವರಿಗೆ ದೂರವಾದ ಪಾದ 
      ಗಹನವಾದ ಪಾದ ಗುಪ್ತಪಾದ 
      ಸ್ನೇಹಭಾವದಿಂದ ಸಾಕುವ ನಿಧಿ ಪಾದ 
      ರಾಹಸ್ಯವಾಗಿ ಜಪಿಸುವ ಪಾದ 
      ತ್ರಾಹಿ ತಾವರೆನಯನ ವಿಜಯವಿಠ್ಠಲ ಸರಸಿ -
    ta: |
      த³ஹராகாஶத³ல்லி மிஞ்சுவ க⁴னபாத³ 
      ப³ஹுக³மனவாகி³த்³த³ பா⁴க்³ய பாத³ 
      அஹோராத்ரியலி பி³ட³தெ³ ஆனந்த³த³ பாத³ 
      மஹ புண்ய தந்தீ³வ மந்த்ர பாத³ 
      த்³ரோஹி மானவரிகெ³ தூ³ரவாத³ பாத³ 
      க³ஹனவாத³ பாத³ கு³ப்தபாத³ 
      ஸ்னேஹபா⁴வதி³ந்த³ ஸாகுவ நிதி⁴ பாத³ 
      ராஹஸ்யவாகி³ ஜபிஸுவ பாத³ 
      த்ராஹி தாவரெனயன விஜயவிட்²ட²ல ஸரஸி - 
      ரூஹ போலுவ பாத³ ஆர்ஜவ பாத³ ॥
    hi: |
      दहराकाशदल्लि मिञ्चुव घनपाद 
      बहुगमनवागिद्द भाग्य पाद 
      अहोरात्रियलि बिडदे आनन्दद पाद 
      मह पुण्य तन्दीव मन्त्र पाद 
      द्रोहि मानवरिगे दूरवाद पाद 
      गहनवाद पाद गुप्तपाद 
      स्नेहभावदिन्द साकुव निधि पाद 
      राहस्यवागि जपिसुव पाद 
      त्राहि तावरेनयन विजयविठ्ठल सरसि - 
      रूह पोलुव पाद आर्जव पाद ॥
    en: |
      daharākāśadalli miñcuva ghanapāda 
      bahugamanavāgidda bhāgya pāda 
      ahōrātriyali biḍade ānandada pāda 
      maha puṇya tandīva mantra pāda 
      drōhi mānavarige dūravāda pāda 
      gahanavāda pāda guptapāda 
      snēhabhāvadinda sākuva nidhi pāda 
      rāhasyavāgi japisuva pāda 
      trāhi tāvarenayana vijayaviṭhṭhala sarasi - 
      rūha pōluva pāda ārjava pāda ॥

  - type: None
    number: 4
    subtitle_kn: ಅಟ್ಟತಾಳ
    subtitle_ta: அட்டதாள
    subtitle_hi: अट्टताळ
    subtitle_en: aṭṭatāḷa
    kn: |
      ಅಸುರಗಯನ ಶಿರದಲ್ಲಿ ನಿಂದ ಪಾದ 
      ಎಸೆವ ಹದಿನೆಂಟು ಪಾದದೊಳಿಪ್ಪ ಪಾದ 
      ಶಶಿಮುಖಿ ಗೋಪೇರ ಮನಕೆ ಮೋಹನ ಪಾದ 
      ವಶವಾಗಿ ಭಕ್ತರ ಬಳಿಯಲಿಪ್ಪ ಪಾದ 
      ವಿಷ ವರ್ಜಿತ ವಿಲಕ್ಷಣ ಪಾದ 
      ಬೆಸನೆ ಲಾಲಿಸಿ ಲಾಲನೆ ಮಾಡುವ ಪಾದ 
      ಅಸಮದೈವ ನಮ್ಮ ವಿಜಯವಿಠ್ಠಲರೇಯಾ
    ta: |
      அஸுரக³யன ஶிரத³ல்லி நிந்த³ பாத³ 
      எஸெவ ஹதி³னெண்டு பாத³தொ³ளிப்ப பாத³ 
      ஶஶிமுகி² கோ³பேர மனகெ மோஹன பாத³ 
      வஶவாகி³ ப⁴க்தர ப³ளியலிப்ப பாத³ 
      விஷ வர்ஜித விலக்ஷண பாத³ 
      பெ³ஸனெ லாலிஸி லாலனெ மாடு³வ பாத³ 
      அஸமதை³வ நம்ம விஜயவிட்²ட²லரேயா 
      பெஸராத³ பாத³ பரம ஸௌக்²ய பாத³ ॥
    hi: |
      असुरगयन शिरदल्लि निन्द पाद 
      एसेव हदिनेण्टु पाददोळिप्प पाद 
      शशिमुखि गोपेर मनके मोहन पाद 
      वशवागि भक्तर बळियलिप्प पाद 
      विष वर्जित विलक्षण पाद 
      बेसने लालिसि लालने माडुव पाद 
      असमदैव नम्म विजयविठ्ठलरेया 
      पेसराद पाद परम सौख्य पाद ॥
    en: |
      asuragayana śiradalli ninda pāda 
      eseva hadineṇṭu pādadoḷippa pāda 
      śaśimukhi gōpēra manake mōhana pāda 
      vaśavāgi bhaktara baḷiyalippa pāda 
      viṣa varjita vilakṣṇa pāda 
      besane lālisi lālane māḍuva pāda 
      asamadaiva namma vijayaviṭhṭhalarēyā 
      pesarāda pāda parama saukhya pāda ॥

  - type: None
    number: 5
    subtitle_kn: ಆದಿತಾಳ
    subtitle_ta: ஆதி³தாள
    subtitle_hi: आदिताळ
    subtitle_en: āditāḷa
    kn: |
      ಎಲ್ಲರಿಂದಲಿ ಪಿಂಡ ಹಾಕಿಸಿಕೊಂಬ ಪಾದ 
      ಮಲ್ಲ ಮೊದಲಾದವರ ಖಳರ ಜೈಸಿದ ಪಾದ 
      ಮೆಲ್ಲಮೆಲ್ಲನೆ ಶುದ್ಧ ಸ್ತೋತ್ರ ಕೈಕೊಂಬ ಪಾದ 
      ಸಲ್ಲಲಿತ ಪಾದ ಸರ್ವ ಸೌಕಾರ್ಯ ಪಾದ 
      ಎಲ್ಲೆಲ್ಲಿ ನೋಡಿದರೂ ವ್ಯಕ್ತವಾದ ಪಾದ 
      ಬಲ್ಲಿದ ಹರಿ ನಮ್ಮ ವಿಜಯವಿಠ್ಠಲರೇಯ
    ta: |
      எல்லரிந்த³லி பிண்ட³ ஹாகிஸிகொம்ப³ பாத³ 
      மல்ல மொத³லாத³வர க²ளர ஜைஸித³ பாத³ 
      மெல்லமெல்லனெ ஶுத்³த⁴ ஸ்தோத்ர கைகொம்ப³ பாத³ 
      ஸல்லலித பாத³ ஸர்வ ஸௌகார்ய பாத³ 
      எல்லெல்லி நோடி³த³ரூ வ்யக்தவாத³ பாத³ 
      ப³ல்லித³ ஹரி நம்ம விஜயவிட்²ட²லரேய 
      வல்லப⁴ன பாத³ வஜ்ராங்கித பாத³ ॥
    hi: |
      एल्लरिन्दलि पिण्ड हाकिसिकोम्ब पाद 
      मल्ल मोदलादवर खळर जैसिद पाद 
      मेल्लमेल्लने शुद्ध स्तोत्र कैकोम्ब पाद 
      सल्ललित पाद सर्व सौकार्य पाद 
      एल्लेल्लि नोडिदरू व्यक्तवाद पाद 
      बल्लिद हरि नम्म विजयविठ्ठलरेय 
      वल्लभन पाद वज्राङ्कित पाद ॥
    en: |
      ellarindali piṇḍa hākisikomba pāda 
      malla modalādavara khaḷara jaisida pāda 
      mellamellane śuddha stōtra kaikomba pāda 
      sallalita pāda sarva saukārya pāda 
      ellelli nōḍidarū vyaktavāda pāda 
      ballida hari namma vijayaviṭhṭhalarēya 
      vallabhana pāda vajrāṅkita pāda ॥

  - type: None
    subtitle_kn: ಜತೆ
    subtitle_ta: ஜதெ
    subtitle_hi: जते
    subtitle_en: jate
    kn: |
      ಫಲ್ಗುಣಿ ತೀರದಲಿ ಮೆರೆವ ಮಹತ್ತು ಪಾದ
    ta: |
      ப²ல்கு³ணி தீரத³லி மெரெவ மஹத்து பாத³ 
      ப²ல்கு³ண ஸாரதி² விஜயவிட்²ட²லன பாத³ ॥
    hi: |
      फल्गुणि तीरदलि मेरेव महत्तु पाद 
      फल्गुण सारथि विजयविठ्ठलन पाद ॥
    en: |
      phalguṇi tīradali mereva mahattu pāda 
      phalguṇa sārathi vijayaviṭhṭhalana pāda ॥

