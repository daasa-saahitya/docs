      tande śrī rāmacandra purandara viṭhala |
      ande ittanu bomma padavi hanumantage ||

  - type: None
    number: 4
    subtitle_kn: ಅಟ್ಟ ತಾಳ
    subtitle_ta: அட்ட தாள
    subtitle_hi: अट्ट ताळ
    subtitle_en: aṭṭa tāḷa
    kn: |
      ಹಬ್ಬಿದರ್ಜುನನ ಧ್ವಜಾಗ್ರಕ್ಕೆ |
      ಬೊಬ್ಬಿಟ್ಟು ಬಾಹ ಪರಬಲ ಬರಿದು ಮಾಡಿದ |
      ಸಬ್ಬಲ ಸೂರೆಗೊಂಡನು ಹನುಮಂತ |
      ಪುರಂದರ ವಿಠಲನ ಬಂಟ ಹನುಮಂತ ||
    ta: |
      ஹப்³பி³த³ர்ஜுனன த்⁴வஜாக்³ரக்கெ |
      பொ³ப்³பி³ட்டு பா³ஹ பரப³ல ப³ரிது³ மாடி³த³ |
      ஸப்³ப³ல ஸூரெகொ³ண்ட³னு ஹனுமந்த |
      புரந்த³ர விட²லன ப³ண்ட ஹனுமந்த ||
    hi: |
      हब्बिदर्जुनन ध्वजाग्रक्के |
      बोब्बिट्टु बाह परबल बरिदु माडिद |
      सब्बल सूरेगोण्डनु हनुमन्त |
      पुरन्दर विठलन बण्ट हनुमन्त ||
    en: |
      habbidarjunana dhvajāgrakke |
      bobbiṭṭu bāha parabala baridu māḍida |
      sabbala sūregoṇḍanu hanumanta |
      purandara viṭhalana baṇṭa hanumanta ||

  - type: None
    number: 5
    subtitle_kn: ಆದಿ ತಾಳ
    subtitle_ta: ஆதி³ தாள
    subtitle_hi: आदि ताळ
    subtitle_en: ādi tāḷa
    kn: |
      ರೋಮಕೋಟಿಲಿಂಗ ಹೇಮಕುಂಡಲಧರ |
      ಭೀಮ ಬೆಳೆದನು ಬ್ರಹ್ಮಾಂಡಕ್ಕೆ |
      ಸ್ವಾಮಿ ಪುರಂದರ ವಿಠಲರೇಯನ 
      ಬಲುಬಂಟ ಹನುಮಂತ, ಬಲುಬಂಟ ಹನುಮಂತ||
    ta: |
      ரோமகோடிலிங்க³ ஹேமகுண்ட³லத⁴ர |
      பீ⁴ம பெ³ளெத³னு ப்³ரஹ்மாண்ட³க்கெ |
      ஸ்வாமி புரந்த³ர விட²லரேயன 
      ப³லுப³ண்ட ஹனுமந்த, ப³லுப³ண்ட ஹனுமந்த||
    hi: |
      रोमकोटिलिङ्ग हेमकुण्डलधर |
      भीम बेळेदनु ब्रह्माण्डक्के |
      स्वामि पुरन्दर विठलरेयन 
      बलुबण्ट हनुमन्त, बलुबण्ट हनुमन्त||
    en: |
