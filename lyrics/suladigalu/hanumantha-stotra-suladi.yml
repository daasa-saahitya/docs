      ஹனுமந்தன ப³லகொ³ண்ட³ரெ, தாரதம்ய பஞ்சபே⁴த³
      தாரதம்ய பஞ்சபே⁴த³, க்³ஞான தொ³ரெகொம்பு³து³
      ஹனுமந்தன ப³லகொ³ண்ட³ரெ த³யதி³ந்த³ புரந்த³ர விட²ல 
      புரந்த³ர விட²ல, தா கை பிடி³வ ||
    hi: |
