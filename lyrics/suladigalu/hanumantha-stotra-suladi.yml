      ಹನುಮಂತನ ಬಲಗೊಂಡರೆ, ತಾರತಮ್ಯ ಪಂಚಭೇದ
      ತಾರತಮ್ಯ ಪಂಚಭೇದ, ಜ್ಞಾನ ದೊರೆಕೊಂಬುದು
      ಹನುಮಂತನ ಬಲಗೊಂಡರೆ ದಯದಿಂದ ಪುರಂದರ ವಿಠಲ 
      ಪುರಂದರ ವಿಠಲ, ತಾ ಕೈ ಪಿಡಿವ ||
