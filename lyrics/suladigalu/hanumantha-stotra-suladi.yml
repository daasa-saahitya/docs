    subtitle_hi: झम्पे ताळ
    subtitle_en: jhampe tāḷa
    kn: |
      ಎಂದೆಂದೂ ತನ್ನ ಮನವಗಲದೆ ಇರು ಎಂದು |
      ಅಂದೇ ಇತ್ತನು ಬೊಮ್ಮ ಪದವಿ ಹನುಮಂತಗೆ |
      ತಂದೆ ಶ್ರೀ ರಾಮಚಂದ್ರ ಪುರಂದರ ವಿಠಲ |
      ಅಂದೆ ಇತ್ತನು ಬೊಮ್ಮ ಪದವಿ ಹನುಮಂತಗೆ ||
    ta: |
      எந்தெ³ந்தூ³ தன்ன மனவக³லதெ³ இரு எந்து³ |
      அந்தே³ இத்தனு பொ³ம்ம பத³வி ஹனுமந்தகெ³ |
      தந்தெ³ ஸ்ரீ ராமசந்த்³ர புரந்த³ர விட²ல |
      அந்தெ³ இத்தனு பொ³ம்ம பத³வி ஹனுமந்தகெ³ ||
    hi: |
      एन्देन्दू तन्न मनवगलदे इरु एन्दु |
      अन्दे इत्तनु बोम्म पदवि हनुमन्तगे |
