      ವಿಜಯೀಭವ ಪುರಂದರ ವಿಠಲನ, ಬಲುಬಂಟ ಹನುಮಂತ ||
    ta: |
      விஜயீப⁴வ ஹனுமந்த விஜயீப⁴வ கு³ணவந்த |
      விஜயீப⁴வ புரந்த³ர விட²லன, ப³லுப³ண்ட ஹனுமந்த ||
    hi: |
