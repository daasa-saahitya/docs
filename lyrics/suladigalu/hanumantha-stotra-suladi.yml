      ಹನುಮಂತನ ಕಂಡು, ಸುಗ್ರೀವ ಬದುಕಿದ |
      ಹನುಮಂತನ ಪ್ರಿಯ, ಪುರಂದರ ವಿಠಲ ||
    ta: |
      ஹனுமந்தன காணதெ³, வாலி ப³ளலித³|
      ஹனுமந்தன கண்டு³, ஸுக்³ரீவ ப³து³கித³ |
      ஹனுமந்தன ப்ரிய, புரந்த³ர விட²ல ||
    hi: |
