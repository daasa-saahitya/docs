verses:
  - type: None
    number: 1
    subtitle_kn: ಧ್ರುವತಾಳ
    subtitle_ta: த்⁴ருவதாள
    subtitle_hi: ध्रुवताळ
    subtitle_en: dhruvatāḷa
    kn: |
      ದುರಿತವನಕುಠಾರಿ ದುರ್ಜನ ಕುಲವೈರಿ
      ಶರಣಾಗತವಜ್ರಪಂಜರ ಕುಂಜರ -
      ವರಸಂರಕ್ಷಕ ಜನ್ಮಮರಣರಹಿತ ಮಹಿತ
      ಪರಮಕರುಣಾ ಸಿಂಧು ಭಕುತಬಂಧು
      ಸ್ವರತ ಸ್ವತಂತ್ರ ಜಗದ್ಭರಿತ ಚಿತ್ಸುಖಪೂರ್ಣ
      ಹರಿಯೆ ಕ್ಷರಾಕ್ಷರಪುರುಷೋತ್ತಮ
      ಉರುಗಾಯ ವೈಕುಂಠವರಮಂದಿರ , ಚಂದಿರ -
      ತರಣಿಕೋಟಿಸಂಕಾಶ ವಿಮಲಕೇಶ
      ಧುರದೊಳಗರ್ಜುನನ ತುರಗನಡೆಸಿದ ಸಂ - 
      ಗರ ಭಯಂಕರ ಲೋಕೈಕವೀರ 
      ನರಸಿಂಹ ನಿನ್ನ ಪಾದಕ್ಕೆರಗಿ ಬಿನ್ನೈಸುವೆ
      ಮೊರೆಹೊಕ್ಕ ದಾಸಗೆ ಬಂದ ಭಯವ 
      ಪರಿಹರಿಸಿ ಸೌಖ್ಯವ ಕರುಣಿಸು ದಯದಿಂದ 
      ಸರ್ವರಂತರ್ಯಾಮಿ ಲೋಕಸ್ವಾಮಿ
      ಸ್ಮರಣೆ ಮಾತ್ರದಿ ಅಜಾಮಿಳಗೆ ಮುಕ್ತಿಯನಿತ್ತೆ
      ಅರಿದೆನೊ ನೀನೆಮ್ಮ ಪೊರೆವುದೀಗ
      ಸರುವಕಾಮದ ಜಗನ್ನಾಥವಿಠ್ಠಲ ಭಕ್ತ -
      ಪರಿಪಾಲಕನೆಂಬ ಬಿರುದು ನಿನ್ನದಲ್ಲವೇ ||
    ta: |
      து³ரிதவனகுடா²ரி து³ர்ஜன குலவைரி
      ஶரணாக³தவஜ்ரபஞ்ஜர குஞ்ஜர -
      வரஸம்ரக்ஷக ஜன்மமரணரஹித மஹித
      பரமகருணா ஸிந்து⁴ ப⁴குதப³ந்து⁴
      ஸ்வரத ஸ்வதந்த்ர ஜக³த்³ப⁴ரித சித்ஸுக²பூர்ண
      ஹரியெ க்ஷராக்ஷரபுருஷோத்தம
      உருகா³ய வைகுண்ட²வரமந்தி³ர , சந்தி³ர -
      தரணிகோடிஸங்காஶ விமலகேஶ
      து⁴ரதொ³ளக³ர்ஜுனன துரக³னடெ³ஸித³ ஸம் - 
      க³ர ப⁴யங்கர லோகைகவீர 
      நரஸிம்ஹ நின்ன பாத³க்கெரகி³ பி³ன்னைஸுவெ
      மொரெஹொக்க தா³ஸகெ³ ப³ந்த³ ப⁴யவ 
      பரிஹரிஸி ஸௌக்²யவ கருணிஸு த³யதி³ந்த³ 
      ஸர்வரந்தர்யாமி லோகஸ்வாமி
      ஸ்மரணெ மாத்ரதி³ அஜாமிளகெ³ முக்தியனித்தெ
      அரிதெ³னொ நீனெம்ம பொரெவுதீ³க³
      ஸருவகாமத³ ஜக³ன்னாத²விட்²ட²ல ப⁴க்த -
      பரிபாலகனெம்ப³ பி³ருது³ நின்னத³ல்லவே ||
    hi: |
      दुरितवनकुठारि दुर्जन कुलवैरि
      शरणागतवज्रपञ्जर कुञ्जर -
      वरसंरक्षक जन्ममरणरहित महित
      परमकरुणा सिन्धु भकुतबन्धु
      स्वरत स्वतन्त्र जगद्भरित चित्सुखपूर्ण
      हरिये क्षराक्षरपुरुषोत्तम
      उरुगाय वैकुण्ठवरमन्दिर , चन्दिर -
      तरणिकोटिसङ्काश विमलकेश
      धुरदोळगर्जुनन तुरगनडेसिद सं - 
      गर भयङ्कर लोकैकवीर 
      नरसिंह निन्न पादक्केरगि बिन्नैसुवे
      मोरेहोक्क दासगे बन्द भयव 
      परिहरिसि सौख्यव करुणिसु दयदिन्द 
      सर्वरन्तर्यामि लोकस्वामि
      स्मरणे मात्रदि अजामिळगे मुक्तियनित्ते
      अरिदेनो नीनेम्म पोरेवुदीग
      सरुवकामद जगन्नाथविठ्ठल भक्त -
      परिपालकनेम्ब बिरुदु निन्नदल्लवे ||
    en: |
      duritavanakuṭhāri durjana kulavairi
      śaraṇāgatavajrapañjara kuñjara -
      varasaṃrakṣka janmamaraṇarahita mahita
      paramakaruṇā sindhu bhakutabandhu
      svarata svatantra jagadbharita citsukhapūrṇa
      hariye kṣrākṣrapuruṣōttama
      urugāya vaikuṇṭhavaramandira , candira -
      taraṇikōṭisaṅkāśa vimalakēśa
      dhuradoḷagarjunana turaganaḍesida saṃ - 
      gara bhayaṅkara lōkaikavīra 
      narasiṃha ninna pādakkeragi binnaisuve
      morehokka dāsage banda bhayava 
      pariharisi saukhyava karuṇisu dayadinda 
      sarvarantaryāmi lōkasvāmi
      smaraṇe mātradi ajāmiḷage muktiyanitte
      arideno nīnemma porevudīga
      saruvakāmada jagannāthaviṭhṭhala bhakta -
      paripālakanemba birudu ninnadallavē ||

  - type: None
    number: 2
    subtitle_kn: ಮಟ್ಟತಾಳ
    subtitle_ta: மட்டதாள
    subtitle_hi: मट्टताळ
    subtitle_en: maṭṭatāḷa
    kn: |
      ವಿಧಿಪಿತ ನೀನಲ್ಲದೆ ನಿಧಿಪತಿಗಳು ಉಂಟೆ
      ಸಧನನಾಗಿ ಇಪ್ಪೆ ನಿನ್ನ ದಾಸರಿಗಾಗಿ
      ಮಧುಸೂದನ ಜಗನ್ನಾಥವಿಠ್ಠಲರೇಯ 
      ನಿಧನನೆನಿಸಿಕೊಂಡೆ ನಿನ್ನ ದ್ವೇಷಿಗಳಿಗೆ ||
    ta: |
      விதி⁴பித நீனல்லதெ³ நிதி⁴பதிக³ளு உண்டெ
      ஸத⁴னனாகி³ இப்பெ நின்ன தா³ஸரிகா³கி³
      மது⁴ஸூத³ன ஜக³ன்னாத²விட்²ட²லரேய 
      நித⁴னனெனிஸிகொண்டெ³ நின்ன த்³வேஷிக³ளிகெ³ ||
    hi: |
      विधिपित नीनल्लदे निधिपतिगळु उण्टे
      सधननागि इप्पे निन्न दासरिगागि
      मधुसूदन जगन्नाथविठ्ठलरेय 
      निधननेनिसिकोण्डे निन्न द्वेषिगळिगे ||
    en: |
      vidhipita nīnallade nidhipatigaḷu uṇṭe
      sadhananāgi ippe ninna dāsarigāgi
      madhusūdana jagannāthaviṭhṭhalarēya 
      nidhananenisikoṇḍe ninna dvēṣigaḷige ||

  - type: None
    number: 3
    subtitle_kn: ರೂಪಕತಾಳ
    subtitle_ta: ரூபகதாள
    subtitle_hi: रूपकताळ
    subtitle_en: rūpakatāḷa
    kn: |
      ಮೂರುಲೋಕಸ್ವಾಮಿ ಸರ್ವಜ್ಞ ಸುಖಪೂರ್ಣ
      ಪ್ರೇರಣಸಾಕ್ಷಿ ಕಾರಣಕಾರ್ಯ ದೋಷವಿ-
      ದೂರ ಸದ್ಗುಣಸಾಂದ್ರ ಸಜ್ಜನಾಂಬುಧಿಚಂದ್ರ
      ಭಾರಕರ್ತ ಜಗಕೆ ನೀನಿರೆ ಎಮ್ಮ ಮ-
      ನೋರಥ ಸಲಿಸುವುದೇನಸಾಧ್ಯವೊ ನಿನಗೆ;
      ಕ್ರೂರಮಾನವರ ಸಂಹಾರ ಮಾಡಿಸು ಗುರು -
      ಮಾರುತನಿಂದತಿ ಶೀಘ್ರವಾಗಿ
      ನೀ ರಕ್ಷಿಸೆಂದು ಪ್ರಾರ್ಥಿಸುವ ಭಕ್ತಗೆ ಭೂರಿ
      ಸಾರಭಾಗ್ಯವನಿತ್ತು ಕೃಪೆಮಾಡು ಅನುದಿನ
      ಶೂರ ಜಗನ್ನಾಥವಿಠ್ಠಲ ನೀನಲ್ಲದಿ-
      ನ್ನಾರು ಭಕ್ತರ ಕಾವ ಕರುಣಿಗಳು ಜಗದೀ ||
    ta: |
      மூருலோகஸ்வாமி ஸர்வக்³ஞ ஸுக²பூர்ண
      ப்ரேரணஸாக்ஷி காரணகார்ய தோ³ஷவி-
      தூ³ர ஸத்³கு³ணஸாந்த்³ர ஸஜ்ஜனாம்பு³தி⁴சந்த்³ர
      பா⁴ரகர்த ஜக³கெ நீனிரெ எம்ம ம-
      நோரத² ஸலிஸுவுதே³னஸாத்⁴யவொ நினகெ³;
      க்ரூரமானவர ஸம்ஹார மாடி³ஸு கு³ரு -
      மாருதனிந்த³தி ஶீக்⁴ரவாகி³
      நீ ரக்ஷிஸெந்து³ ப்ரார்தி²ஸுவ ப⁴க்தகெ³ பூ⁴ரி
      ஸாரபா⁴க்³யவனித்து கருபெமாடு³ அனுதி³ன
      ஶூர ஜக³ன்னாத²விட்²ட²ல நீனல்லதி³-
      ந்னாரு ப⁴க்தர காவ கருணிக³ளு ஜக³தீ³ ||
    hi: |
      मूरुलोकस्वामि सर्वज्ञ सुखपूर्ण
      प्रेरणसाक्षि कारणकार्य दोषवि-
      दूर सद्गुणसान्द्र सज्जनाम्बुधिचन्द्र
      भारकर्त जगके नीनिरे एम्म म-
      नोरथ सलिसुवुदेनसाध्यवो निनगे;
      क्रूरमानवर संहार माडिसु गुरु -
      मारुतनिन्दति शीघ्रवागि
      नी रक्षिसेन्दु प्रार्थिसुव भक्तगे भूरि
      सारभाग्यवनित्तु कृपेमाडु अनुदिन
      शूर जगन्नाथविठ्ठल नीनल्लदि-
      न्नारु भक्तर काव करुणिगळु जगदी ||
    en: |
      mūrulōkasvāmi sarvajñ sukhapūrṇa
      prēraṇasākṣi kāraṇakārya dōṣavi-
      dūra sadguṇasāndra sajjanāmbudhicandra
      bhārakarta jagake nīnire emma ma-
      nōratha salisuvudēnasādhyavo ninage;
      krūramānavara saṃhāra māḍisu guru -
      mārutanindati śīghravāgi
      nī rakṣisendu prārthisuva bhaktage bhūri
      sārabhāgyavanittu kṛpemāḍu anudina
      śūra jagannāthaviṭhṭhala nīnalladi-
      nnāru bhaktara kāva karuṇigaḷu jagadī ||

  - type: None
    number: 3
    subtitle_kn: ಝಂಪೆತಾಳ
    subtitle_ta: ஜ²ம்பெதாள
    subtitle_hi: झम्पेताळ
    subtitle_en: jhampetāḷa
    kn: |
      ಪಿತನಿಂದ ನೊಂದ ಪ್ರಹ್ಲಾದನ ಕಾಯ್ದೆ , ದೇ-
      ವತೆಗಳಿಗೆ ಬಂದ ಭಯ ಪರಿಹರಿಸಿ, ದಯದಿ ದ್ರೌ-
      ಪತಿಯ ಮೊರೆಕೇಳಿ ದಿವ್ಯಾಂಬರವ ಕರುಣಿಸಿದೆ
      ಕ್ಷಿತಿಜನಾಲಯದಿ ಬಳಲುವ ಬಾಲೆಯರ ದ್ವಾರಾ-
      ವತಿಗೆ ಕರೆದೊಯ್ದು ಒಲಿದವರ ಪೋಷಿಸಿದೆ ; ಮಾ-
      ರುತಿಯ ಕರದಿಂದ ಬೃಹದ್ರಥನ ಕುವರನ ಕೊಲಿಸಿ
      ಪೃಥಿವಿಪರ ಬಿಡಿಸಿ ಪಾಲಿಸಿದೆ ಕರುಣದಲಿ ; ಕುರು-
      ಪೃತನೆಯೊಳು ಪಾಂಡವರ ಗೆಲಿಸಿ ಕೀರ್ತಿಯನಿತ್ತೆ
      ಶತಮೋದನಾಸ್ತ್ರದಿಂದಲಿ ಗರ್ಭದೊಳಗೆ ಪೀ-
      ಡಿತನಾದ ಶಿಶುಪರೀಕ್ಷಿತನ ಸಂತೈಸಿದೆ
      ಶಿತಿಕಂಠಗೊಲಿದು ಸಾಯಕನಾಗಿ ಮುಪ್ಪುರದ
      ಸತಿಯರನು ಒಲಿಸಿ ಕೀರುತಿಯಿತ್ತೆ ಭಕುತನಿಗೆ
      ಮಿತಿಯುಂಟೆ ನಿನ್ನ ಕರುಣಕ್ಕೆ ದೇವವರ್ಯ ಸಾಂ-
      ಪ್ರತ ಬೇಡಿಕೊಂಬೆ ಬಿನ್ನಪಕೇಳಜಸ್ರ ಸಂ-
      ಸ್ತುತಿಪ ಭಕುತರ ಮನೋರಥವ ಪೂರೈಸು ಸು-
      ವ್ರತನಾಮ ಶ್ರೀಜಗನ್ನಾಥವಿಠ್ಠಲ ಭಾಗ-
      ವತಜನಪ್ರೀಯ ನೀನೆ ಗತಿ ಎಮಗೆ ಇಹಪರದಿ ||
    ta: |
      பிதனிந்த³ நொந்த³ ப்ரஹ்லாத³ன காய்தெ³ , தே³-
      வதெக³ளிகெ³ ப³ந்த³ ப⁴ய பரிஹரிஸி, த³யதி³ த்³ரௌ-
      பதிய மொரெகேளி தி³வ்யாம்ப³ரவ கருணிஸிதெ³
      க்ஷிதிஜனாலயதி³ ப³ளலுவ பா³லெயர த்³வாரா-
      வதிகெ³ கரெதொ³ய்து³ ஒலித³வர போஷிஸிதெ³ ; மா-
      ருதிய கரதி³ந்த³ பரு³ஹத்³ரத²ன குவரன கொலிஸி
      பருதி²விபர பி³டி³ஸி பாலிஸிதெ³ கருணத³லி ; குரு-
      பருதனெயொளு பாண்ட³வர கெ³லிஸி கீர்தியனித்தெ
      ஶதமோத³னாஸ்த்ரதி³ந்த³லி க³ர்ப⁴தொ³ளகெ³ பீ-
      டி³தனாத³ ஶிஶுபரீக்ஷிதன ஸந்தைஸிதெ³
      ஶிதிகண்ட²கொ³லிது³ ஸாயகனாகி³ முப்புரத³
      ஸதியரனு ஒலிஸி கீருதியித்தெ ப⁴குதனிகெ³
      மிதியுண்டெ நின்ன கருணக்கெ தே³வவர்ய ஸாம்-
      ப்ரத பே³டி³கொம்பெ³ பி³ன்னபகேளஜஸ்ர ஸம்-
      ஸ்துதிப ப⁴குதர மனோரத²வ பூரைஸு ஸு-
      வ்ரதனாம ஸ்ரீஜக³ன்னாத²விட்²ட²ல பா⁴க³-
      வதஜனப்ரீய நீனெ க³தி எமகெ³ இஹபரதி³ ||
    hi: |
      पितनिन्द नोन्द प्रह्लादन काय्दे , दे-
      वतेगळिगे बन्द भय परिहरिसि, दयदि द्रौ-
      पतिय मोरेकेळि दिव्याम्बरव करुणिसिदे
      क्षितिजनालयदि बळलुव बालेयर द्वारा-
      वतिगे करेदोय्दु ओलिदवर पोषिसिदे ; मा-
      रुतिय करदिन्द बृहद्रथन कुवरन कोलिसि
      पृथिविपर बिडिसि पालिसिदे करुणदलि ; कुरु-
      पृतनेयोळु पाण्डवर गेलिसि कीर्तियनित्ते
      शतमोदनास्त्रदिन्दलि गर्भदोळगे पी-
      डितनाद शिशुपरीक्षितन सन्तैसिदे
      शितिकण्ठगोलिदु सायकनागि मुप्पुरद
      सतियरनु ओलिसि कीरुतियित्ते भकुतनिगे
      मितियुण्टे निन्न करुणक्के देववर्य सां-
      प्रत बेडिकोम्बे बिन्नपकेळजस्र सं-
      स्तुतिप भकुतर मनोरथव पूरैसु सु-
      व्रतनाम श्रीजगन्नाथविठ्ठल भाग-
      वतजनप्रीय नीने गति एमगे इहपरदि ||
    en: |
      pitaninda nonda prahlādana kāyde , dē-
      vategaḷige banda bhaya pariharisi, dayadi drau-
      patiya morekēḷi divyāmbarava karuṇiside
      kṣitijanālayadi baḷaluva bāleyara dvārā-
      vatige karedoydu olidavara pōṣiside ; mā-
      rutiya karadinda bṛhadrathana kuvarana kolisi
      pṛthivipara biḍisi pāliside karuṇadali ; kuru-
      pṛtaneyoḷu pāṇḍavara gelisi kīrtiyanitte
      śatamōdanāstradindali garbhadoḷage pī-
      ḍitanāda śiśuparīkṣitana santaiside
      śitikaṇṭhagolidu sāyakanāgi muppurada
      satiyaranu olisi kīrutiyitte bhakutanige
      mitiyuṇṭe ninna karuṇakke dēvavarya sāṃ-
      prata bēḍikombe binnapakēḷajasra saṃ-
      stutipa bhakutara manōrathava pūraisu su-
      vratanāma śrījagannāthaviṭhṭhala bhāga-
      vatajanaprīya nīne gati emage ihaparadi ||

  - type: None
    number: 3
    subtitle_kn: ತ್ರಿಪುಟತಾಳ
    subtitle_ta: த்ரிபுடதாள
    subtitle_hi: त्रिपुटताळ
    subtitle_en: tripuṭatāḷa
    kn: |
      ನೀ ಸಲಹಲಿನ್ಯಾರು ಬಂದ-
      ಡ್ಡೈಸುವರು ಮೂಲೋಕದೊಳಹೊರ-
      ಗೀ ಸಮಸ್ತ ದಿವೌಕಸರು ನಿನ -
      ಗೆ ಸಮರ್ಪಕವಾದ ಕಾರ್ಯ ಮ-
      ಹಾಸುಖದಿ ನಡೆಸುವರು ನಿರುತ ಲಕ್ಷ್ಮೀ
      ದಾಸಿ ಎಂದೆನಿಪಳು ನಿನ್ನರಮನೆಯಲ್ಲಿ
      ದೇಶಕಾಲಗುಣಕರ್ಮಾದಿಗಳು ನಿನಗಾ-
      ವಾಸಯೋಗ್ಯಸ್ಥಾನವೆಂದೆನಿಪವು
      ಈಶಲೋಕತ್ರಯಕೆ ಲೇಸಾಯಾಸ ಕಾಣೆನೋ ಕರು-
      ಣಾಸಮುದ್ರನೆ ಒಲಿದು ಎಮ್ಮ ಅಭಿ-
      ಲಾಷೆ ಪೂರೈಸೆಂದು ಬೇಡಿಕೊಂಬೆನೋ ; ವೇದ-
      ವ್ಯಾಸ ಕೀಟಗೆ ನೀನೇ ಒಲಿದು ಕೊಟ್ಟೆ ಮ -
      ಹಾಸಿಂಹಾಸನವನೇರಿಸಿ ಪೊರೆದೆಯೋ ಪ-
      ರಾಶರಾತ್ಮಜ ನಿನ್ನ ಗುಣಗಣಬಣ್ಣಿಸೆ
      ನಾ ಸಮರ್ಥನೆ ಎಂದಿಗಾದರು ದೇವ
      ನೀ ಸುಲಭನೆಂದಾಶ್ರಯಿಸಿಂದು ನಾ ಬಿ -
      ನ್ನೈಸಿದೆನೊ ಈ ರೀತಿಯಲ್ಲಿ ಸ-
      ರ್ವಾಸುನಿಲಯ ಜಗನ್ನಾಥವಿಠಲರೇಯ 
      ಈಸು ಮಾತುಗಳ್ಯಾಕೆ ಮನ್ಮನ -
      ದಾಸೆ ಪೂರ್ತಿಯ ಮಾಡಿ ಎಮ್ಮನು-
      ದಾಸಿಸದೆ ದಯದಿಂದ ನೋಳ್ಪುದು ||
    ta: |
      நீ ஸலஹலின்யாரு ப³ந்த³-
      ட்³டை³ஸுவரு மூலோகதொ³ளஹொர-
      கீ³ ஸமஸ்த தி³வௌகஸரு நின -
      கெ³ ஸமர்பகவாத³ கார்ய ம-
      ஹாஸுக²தி³ நடெ³ஸுவரு நிருத லக்ஷ்மீ
      தா³ஸி எந்தெ³னிபளு நின்னரமனெயல்லி
      தே³ஶகாலகு³ணகர்மாதி³க³ளு நினகா³-
      வாஸயோக்³யஸ்தா²னவெந்தெ³னிபவு
      ஈஶலோகத்ரயகெ லேஸாயாஸ காணெனோ கரு-
      நாஸமுத்³ரனெ ஒலிது³ எம்ம அபி⁴-
      லாஷெ பூரைஸெந்து³ பே³டி³கொம்பெ³னோ ; வேத³-
      வ்யாஸ கீடகெ³ நீனே ஒலிது³ கொட்டெ ம -
      ஹாஸிம்ஹாஸனவனேரிஸி பொரெதெ³யோ ப-
      ராஶராத்மஜ நின்ன கு³ணக³ணப³ண்ணிஸெ
      நா ஸமர்த²னெ எந்தி³கா³த³ரு தே³வ
      நீ ஸுலப⁴னெந்தா³ஸ்ரயிஸிந்து³ நா பி³ -
      ந்னைஸிதெ³னொ ஈ ரீதியல்லி ஸ-
      ர்வாஸுனிலய ஜக³ன்னாத²விட²லரேய 
      ஈஸு மாதுக³ள்யாகெ மன்மன -
      தா³ஸெ பூர்திய மாடி³ எம்மனு-
      தா³ஸிஸதெ³ த³யதி³ந்த³ நோள்புது³ ||
    hi: |
      नी सलहलिन्यारु बन्द-
      ड्डैसुवरु मूलोकदोळहोर-
      गी समस्त दिवौकसरु निन -
      गे समर्पकवाद कार्य म-
      हासुखदि नडेसुवरु निरुत लक्ष्मी
      दासि एन्देनिपळु निन्नरमनेयल्लि
      देशकालगुणकर्मादिगळु निनगा-
      वासयोग्यस्थानवेन्देनिपवु
      ईशलोकत्रयके लेसायास काणेनो करु-
      णासमुद्रने ओलिदु एम्म अभि-
      लाषे पूरैसेन्दु बेडिकोम्बेनो ; वेद-
      व्यास कीटगे नीने ओलिदु कोट्टे म -
      हासिंहासनवनेरिसि पोरेदेयो प-
      राशरात्मज निन्न गुणगणबण्णिसे
      ना समर्थने एन्दिगादरु देव
      नी सुलभनेन्दाश्रयिसिन्दु ना बि -
      न्नैसिदेनो ई रीतियल्लि स-
      र्वासुनिलय जगन्नाथविठलरेय 
      ईसु मातुगळ्याके मन्मन -
      दासे पूर्तिय माडि एम्मनु-
      दासिसदे दयदिन्द नोळ्पुदु ||
    en: |
      nī salahalinyāru banda-
      ḍḍaisuvaru mūlōkadoḷahora-
      gī samasta divaukasaru nina -
      ge samarpakavāda kārya ma-
      hāsukhadi naḍesuvaru niruta lakṣmī
      dāsi endenipaḷu ninnaramaneyalli
      dēśakālaguṇakarmādigaḷu ninagā-
      vāsayōgyasthānavendenipavu
      īśalōkatrayake lēsāyāsa kāṇenō karu-
      ṇāsamudrane olidu emma abhi-
      lāṣe pūraisendu bēḍikombenō ; vēda-
      vyāsa kīṭage nīnē olidu koṭṭe ma -
      hāsiṃhāsanavanērisi poredeyō pa-
      rāśarātmaja ninna guṇagaṇabaṇṇise
      nā samarthane endigādaru dēva
      nī sulabhanendāśrayisindu nā bi -
      nnaisideno ī rītiyalli sa-
      rvāsunilaya jagannāthaviṭhalarēya 
      īsu mātugaḷyāke manmana -
      dāse pūrtiya māḍi emmanu-
      dāsisade dayadinda nōḷpudu ||

  - type: None
    number: 4
    subtitle_kn: ಅಟ್ಟತಾಳ
    subtitle_ta: அட்டதாள
    subtitle_hi: अट्टताळ
    subtitle_en: aṭṭatāḷa
    kn: |
      ನಿಗಮತತಿಗಳಿಗೆ ವೇದ್ಯವಾದ ನಿನ್ನ
      ಅಗಣಿತ ಮಹಿಮೆ ಲಕುಮಿಬೊಮ್ಮಭವಾ -
      ದಿಗಳು ತಾವರಿಯರು ಸಾಕಲ್ಯದಿ ಮಂದಜೀ -
      ವಿಗಳಿಗೆ ಗೋಚರಿಸುವುದೆ ನಿನ್ನ ರೂಪ
      ಭಗವಂತ ನೀನೆ ದಯಾಳು ಎಂದರಿದು ನಾ
      ಪೊಗಳಿದೆನೊ ಯಥಾಮತಿಯೊಳಗೆ ಲೇಶ
      ಬಗೆಯದಿರೆನ್ನಪರಾಧಕೋಟಿಗಳ
      ಜಗತ್ಪತಿ ತನ್ನ ಮಗುವಿನ ತೊದಲು ಮಾ - 
      ತುಗಳನೆ ಕೇಳಿ ತಾ ನಗುತಲಿ ಕಾಮಿತ
      ಬಗೆಬಗೆಯಿಂದ ಪೂರ್ತಿಸಿ ಮಿಗೆ ಹರುಷದಿ
      ಬಿಗಿದಪ್ಪಿ ಮೋದಿಪನಲ್ಲದೆ ಶಿಶುವನು
      ತೆಗೆದು ಬಿಸುಟು ಮತ್ತೆ ಹಗೆಗೊಂಬನೇನೋ ತ್ರೈ - 
      ಯುಗನೆ ಬಿಡದೆ ಪಾಡಿ ಪೊಗುಳುವ ದಾಸಗೀ - 
      ಬಗೆ ಬಡತನವ್ಯಾಕೊ ಸಂಸಾರದೊಳಗೆ ನಾ - 
      ಲ್ಮೊಗನಯ್ಯ ಅರ್ಥಕಾಮಗಳೊಳಗಿಪ್ಪ ಈ -
      ರ್ವಗೆರೂಪ ಒಂದಾಗೆ ಆವುದಸಾಧ್ಯವೊ
      ಗಗನಭೂಪಾತಾಳವ್ಯಾಪ್ತರೂಪನೆ ಕರ
      ಮುಗಿವೆ ಗೋಚರಿಸೆನ್ನ ದೃಗುಯುಗಗಳಿಗಿಂದು 
      ಯುಗಕರ್ತ ಶ್ರೀಜಗನ್ನಾಥವಿಠಲ ನರ -
      ಮೃಗನಾಗಿ ಸ್ತಂಭದಿಂದೊಗೆದು ಬಂದೊದಗಿದೆ ||
    ta: |
      நிக³மததிக³ளிகெ³ வேத்³யவாத³ நின்ன
      அக³ணித மஹிமெ லகுமிபொ³ம்மப⁴வா -
      தி³க³ளு தாவரியரு ஸாகல்யதி³ மந்த³ஜீ -
      விக³ளிகெ³ கோ³சரிஸுவுதெ³ நின்ன ரூப
      ப⁴க³வந்த நீனெ த³யாளு எந்த³ரிது³ நா
      பொக³ளிதெ³னொ யதா²மதியொளகெ³ லேஶ
      ப³கெ³யதி³ரென்னபராத⁴கோடிக³ள
      ஜக³த்பதி தன்ன மகு³வின தொத³லு மா - 
      துக³ளனெ கேளி தா நகு³தலி காமித
      ப³கெ³ப³கெ³யிந்த³ பூர்திஸி மிகெ³ ஹருஷதி³
      பி³கி³த³ப்பி மோதி³பனல்லதெ³ ஶிஶுவனு
      தெகெ³து³ பி³ஸுடு மத்தெ ஹகெ³கொ³ம்ப³னேனோ த்ரை - 
      யுக³னெ பி³ட³தெ³ பாடி³ பொகு³ளுவ தா³ஸகீ³ - 
      ப³கெ³ ப³ட³தனவ்யாகொ ஸம்ஸாரதொ³ளகெ³ நா - 
      ல்மொக³னய்ய அர்த²காமக³ளொளகி³ப்ப ஈ -
      ர்வகெ³ரூப ஒந்தா³கெ³ ஆவுத³ஸாத்⁴யவொ
      க³க³னபூ⁴பாதாளவ்யாப்தரூபனெ கர
      முகி³வெ கோ³சரிஸென்ன தரு³கு³யுக³க³ளிகி³ந்து³ 
      யுக³கர்த ஸ்ரீஜக³ன்னாத²விட²ல நர -
      மருக³னாகி³ ஸ்தம்ப⁴தி³ந்தொ³கெ³து³ ப³ந்தொ³த³கி³தெ³ ||
    hi: |
      निगमततिगळिगे वेद्यवाद निन्न
      अगणित महिमे लकुमिबोम्मभवा -
      दिगळु तावरियरु साकल्यदि मन्दजी -
      विगळिगे गोचरिसुवुदे निन्न रूप
      भगवन्त नीने दयाळु एन्दरिदु ना
      पोगळिदेनो यथामतियोळगे लेश
      बगेयदिरेन्नपराधकोटिगळ
      जगत्पति तन्न मगुविन तोदलु मा - 
      तुगळने केळि ता नगुतलि कामित
      बगेबगेयिन्द पूर्तिसि मिगे हरुषदि
      बिगिदप्पि मोदिपनल्लदे शिशुवनु
      तेगेदु बिसुटु मत्ते हगेगोम्बनेनो त्रै - 
      युगने बिडदे पाडि पोगुळुव दासगी - 
      बगे बडतनव्याको संसारदोळगे ना - 
      ल्मोगनय्य अर्थकामगळोळगिप्प ई -
      र्वगेरूप ओन्दागे आवुदसाध्यवो
      गगनभूपाताळव्याप्तरूपने कर
      मुगिवे गोचरिसेन्न दृगुयुगगळिगिन्दु 
      युगकर्त श्रीजगन्नाथविठल नर -
      मृगनागि स्तम्भदिन्दोगेदु बन्दोदगिदे ||
    en: |
      nigamatatigaḷige vēdyavāda ninna
      agaṇita mahime lakumibommabhavā -
      digaḷu tāvariyaru sākalyadi mandajī -
      vigaḷige gōcarisuvude ninna rūpa
      bhagavanta nīne dayāḷu endaridu nā
      pogaḷideno yathāmatiyoḷage lēśa
      bageyadirennaparādhakōṭigaḷa
      jagatpati tanna maguvina todalu mā - 
      tugaḷane kēḷi tā nagutali kāmita
      bagebageyinda pūrtisi mige haruṣadi
      bigidappi mōdipanallade śiśuvanu
      tegedu bisuṭu matte hagegombanēnō trai - 
      yugane biḍade pāḍi poguḷuva dāsagī - 
      bage baḍatanavyāko saṃsāradoḷage nā - 
      lmoganayya arthakāmagaḷoḷagippa ī -
      rvagerūpa ondāge āvudasādhyavo
      gaganabhūpātāḷavyāptarūpane kara
      mugive gōcarisenna dṛguyugagaḷigindu 
      yugakarta śrījagannāthaviṭhala nara -
      mṛganāgi stambhadindogedu bandodagide ||

  - type: None
    number: 5
    subtitle_kn: ಏಕತಾಳ
    subtitle_ta: ஏகதாள
    subtitle_hi: एकताळ
    subtitle_en: ēkatāḷa
    kn: |
      ಶ್ರೀನಿಧಿ ಪ್ರತಿದೇಹಂಗಳಲ್ಲಿ ಗತಿ
      ನೀನಲ್ಲದೆ ಎನಗಾರಿಹಪರದಲ್ಲಿ
      ಆ ನಳಿನಭವಾದ್ಯನಿಮಿಷ - 
      ರಾ ನಿಜಾನಂದವರಿತು ಫಲಗಳ ಕೊಡುವಿ ಮ -
      ಹಾನುಭಾವ ಎಮ್ಮಭಿಮತ ಸಲಿಸುವು
      ದೇನಚ್ಚರಿ ನಿನ್ನರಸಿ ಲಕುಮಿ ಕಡೆ -
      ಗಾಣಳು ಪರಮೈಶ್ವರ್ಯದ ಪ್ರಾಂತ ಚಿ -
      ದಾನಂದಮಯನೆ ಪ್ರಣತರ ಅಧಿಕಾ -
      ರಾನುಸಾರ ಸುಖವನಧಿಯೊಳೋಲ್ಯಾಡಿಸುವಿ
      ದಾನಿಗಳರಸ ಮನಾದಿಕರಣಗಳಗಭಿ -
      ಮಾನಿಗಳಿಗೊಡೆಯನೆನಿಸುವ ಮುಖ್ಯ -
      ಪ್ರಾಣಪತಿಗೆ ನೂತನ ವಿಜ್ಞಾಪನ -
      ವೇನುಂಟಿನ್ನನುದಿನದಲಿ ಮಾಳ್ಪುದು
      ಮಾನದ ಗುರು ಜಗನ್ನಾಥವಿಠ್ಠಲ ಕರು -
      ಣಾನಿಧಿ ಸರ್ವದಾ ಸುಲಭ ನೀನಲ್ಲವೆ ||
    ta: |
      ஸ்ரீனிதி⁴ ப்ரதிதே³ஹங்க³ளல்லி க³தி
      நீனல்லதெ³ எனகா³ரிஹபரத³ல்லி
      ஆ நளினப⁴வாத்³யனிமிஷ - 
      ரா நிஜானந்த³வரிது ப²லக³ள கொடு³வி ம -
      ஹானுபா⁴வ எம்மபி⁴மத ஸலிஸுவு
      தே³னச்சரி நின்னரஸி லகுமி கடெ³ -
      கா³ணளு பரமைஶ்வர்யத³ ப்ராந்த சி -
      தா³னந்த³மயனெ ப்ரணதர அதி⁴கா -
      ரானுஸார ஸுக²வனதி⁴யொளோல்யாடி³ஸுவி
      தா³னிக³ளரஸ மனாதி³கரணக³ளக³பி⁴ -
      மானிக³ளிகொ³டெ³யனெனிஸுவ முக்²ய -
      ப்ராணபதிகெ³ நூதன விக்³ஞாபன -
      வேனுண்டின்னனுதி³னத³லி மாள்புது³
      மானத³ கு³ரு ஜக³ன்னாத²விட்²ட²ல கரு -
      நானிதி⁴ ஸர்வதா³ ஸுலப⁴ நீனல்லவெ ||
    hi: |
      श्रीनिधि प्रतिदेहङ्गळल्लि गति
      नीनल्लदे एनगारिहपरदल्लि
      आ नळिनभवाद्यनिमिष - 
      रा निजानन्दवरितु फलगळ कोडुवि म -
      हानुभाव एम्मभिमत सलिसुवु
      देनच्चरि निन्नरसि लकुमि कडे -
      गाणळु परमैश्वर्यद प्रान्त चि -
      दानन्दमयने प्रणतर अधिका -
      रानुसार सुखवनधियोळोल्याडिसुवि
      दानिगळरस मनादिकरणगळगभि -
      मानिगळिगोडेयनेनिसुव मुख्य -
      प्राणपतिगे नूतन विज्ञापन -
      वेनुण्टिन्ननुदिनदलि माळ्पुदु
      मानद गुरु जगन्नाथविठ्ठल करु -
      णानिधि सर्वदा सुलभ नीनल्लवे ||
    en: |
      śrīnidhi pratidēhaṅgaḷalli gati
      nīnallade enagārihaparadalli
      ā naḷinabhavādyanimiṣa - 
      rā nijānandavaritu phalagaḷa koḍuvi ma -
      hānubhāva emmabhimata salisuvu
      dēnaccari ninnarasi lakumi kaḍe -
      gāṇaḷu paramaiśvaryada prānta ci -
      dānandamayane praṇatara adhikā -
      rānusāra sukhavanadhiyoḷōlyāḍisuvi
      dānigaḷarasa manādikaraṇagaḷagabhi -
      mānigaḷigoḍeyanenisuva mukhya -
      prāṇapatige nūtana vijñāpana -
      vēnuṇṭinnanudinadali māḷpudu
      mānada guru jagannāthaviṭhṭhala karu -
      ṇānidhi sarvadā sulabha nīnallave ||

  - type: None
    subtitle_kn: ಜತೆ
    subtitle_ta: ஜதெ
    subtitle_hi: जते
    subtitle_en: jate
    kn: |
      ಚಟುಲಕಾರ್ಯಗಳ ಸಂಘಟನೆ ಮಾಡಿಸುವಿ ನಿ -
      ಷ್ಕುಟಿಲ ಶ್ರೀಜಗನ್ನಾಥವಿಠ್ಠಲ ದೇವೋತ್ತಮ ||
    ta: |
      சடுலகார்யக³ள ஸங்க⁴டனெ மாடி³ஸுவி நி -
      ஷ்குடில ஸ்ரீஜக³ன்னாத²விட்²ட²ல தே³வோத்தம ||
    hi: |
      चटुलकार्यगळ सङ्घटने माडिसुवि नि -
      ष्कुटिल श्रीजगन्नाथविठ्ठल देवोत्तम ||
    en: |
      caṭulakāryagaḷa saṅghaṭane māḍisuvi ni -
      ṣkuṭila śrījagannāthaviṭhṭhala dēvōttama ||

