# Daasa Saahitya - lyrics (aligned by scripts/align.py)

title_kn: ಮಂಗಳಗೌರಿಯ ಪೂಜಿಪ ಬನ್ನಿ
author_kn: ಮಧ್ವೇಶ ಕೃಷ್ಣ ದಾಸರು
category: [Dasara Pada]
on_who: [Parvati]
types: []
festivals: [Mangala Gowri]
raga_kn: ಹಿಂದೋಳ
tala_kn: ಆದಿ
ankita_kn: ಮಧ್ವೇಶ ಕೃಷ್ಣ
verses:
  - type: ''
    number: 1
    kn: |
      ಮಂಗಳ ಗೌರಿಯ ಪೂಜಿಪ ಬನ್ನಿ
      ಮಂಗಳ ಗೌರಿಯ ಧ್ಯಾನಿಪ ಬನ್ನಿ
      ಮಂಗಳ ಪದಗಳ ಹಾಡುವ ಬನ್ನಿ
      ಮಂಗಳಾರತಿಯ ಬೆಳಗುವ ಬನ್ನಿ ||

  - type: ''
    number: 2
    kn: |
      ಮನೆಯ ಸಾರಿಸಿ ರಂಗವಾಲಿಗಳಹಾಕಿ
      ಪೀಠವ ತಂದಿಟ್ಟು ವಸ್ತ್ರವ ಪರಚಿ
      ತಂಡುಲವ ಹಾಕಿ ಗೌರಿಯನಿಟ್ಟು
      ಶ್ರಧ್ಧೆಯಿಂದಲಿ ಅಣಿಮಾಡಿ ||

  - type: ''
    number: 3
    kn: |
      ಭಕ್ತಿ ಶ್ರಧ್ಧೆಯಿಂದ ಪೂಜೆಗೆನುತ
      ಪರಿಪರಿ ಪುಷ್ಪಗಳ ತಂದಿರಿಸಿ
      ಕ್ಯಾದಿಗಿ ಕುಸುಮ ಮಲ್ಲಿಗೆ ಪತ್ರ
      ಫಲಗಳ ಬ್ಯಾಗದಿಂದಲಿ ತಂದಿರಿಸಿ ||

  - type: ''
    number: 4
    kn: |
      ಜೋಡು ದೀಪಗಳಹಚ್ಚಿ ಕಡ್ಡಿ ಬತ್ತಿಯ
      ಸಹಿತನಾರಿಕೇಳವ ಇಡುತ್ತಲಿ
      ಅರಿಷಿಣ ಕುಂಕುಮ ಗೆಜ್ಜೆ ವಸ್ತ್ರ
      ಏರಿಸಿ ಅಡಕೆ ವೀಳೆದೆಲೆ  ಇಡುತತಲಿ ||

  - type: ''
    number: 5
    kn: |
      ಗಂಧ ಕುಂಕುಮ ದೀಪ ಧೂಪದಿ
      ಪುಜಿಸಿ ಕಡ್ಡಿಬತ್ತಿ ಆರತಿಮಾಡಿ
      ಕಪ್ಪನೆ ಹಿಡಿದು ಒಪ್ಪಾಗಿ ತಂದು
      ಮುತೈದೆಯರಿಗೆ ನೀಡುತ್ತಲಿ ||

  - type: ''
    number: 6
    kn: |
      ಐದು ಹೂರಣದ ಆರತಿಮಾಡಿ
      ಐದು ಗಂಟಿನ ದಾರ ಕಟ್ಟಿ
      ಮುತೈದೆತನವು ಸ್ಥಿರವಾಗಿ ಇರಲೆಂದು
      ಮಧ್ವೇಶಕೃಷ್ಣನ  ಬೇಡುತ್ತಲಿ ||
