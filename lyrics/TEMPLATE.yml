# ──────────────────────────────────────────────────────────────────
# Daasa Saahitya - Lyrics Template
#
# INSTRUCTIONS:
# 1. Copy this file to the appropriate folder (e.g., dasara_padagalu/lakshmi_devi/)
# 2. Rename it to your song name in kebab-case (e.g., bhagyada-lakshmi.yml)
# 3. Fill in the _kn fields with Kannada text
# 4. Tamil, Devanagari, IAST are auto-generated (or override manually)
# 5. Delete any sections you don't need
# ──────────────────────────────────────────────────────────────────

# === SONG METADATA ===
title_kn: # e.g., ಭಾಗ್ಯದ ಲಕ್ಷ್ಮಿ ಬಾರಮ್ಮ
author_kn: # e.g., ಪುರಂದರದಾಸ
raga_kn: # e.g., ಮಧ್ಯಮಾವತಿ
tala_kn: # e.g., ಆದಿ
description_kn: # e.g., ದಾಸರ ಪದ

# === OPTIONAL: Manual overrides (leave blank for auto-transliteration) ===
# title_ta:
# title_hi:
# title_en:
# raga_ta:      # Use this if auto-transliteration is wrong

# === VERSES ===
verses:
  # ─── OPTION A: For regular songs (Dasara Padagalu) ───

  - type: pallavi
    kn: |
      # Pallavi lyrics here

  - type: anupallavi
    kn: |
      # Anupallavi lyrics here

  # Optional: Add a section heading
  - type: subtitle
    subtitle_kn: ಚರಣಗಳು

  - type: charana
    number: 1
    kn: |
      # Charana 1 lyrics here

  - type: charana
    number: 2
    kn: |
      # Charana 2 lyrics here

