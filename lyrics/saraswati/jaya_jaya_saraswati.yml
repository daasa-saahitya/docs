# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ಜಯ ಜಯ ಸರಸ್ವತಿ
author_kn: ಕಾಖಂಡಕಿ ಶ್ರೀ ಮಹಿಪತಿರಾಯರು
category: [Dasara Pada]
on_who: [Saraswati]
types: []
festivals: [Saraswati Pooja]
raga_kn: ಹಮೀರ್ ಕಲ್ಯಾಣಿ
tala_kn: ಧ್ರುವ ತಾಳ
ankita_kn: ಮಹಿಪತಿ
verses:
  - type: pallavi
    kn: |
      ಜಯ ಜಯ ಸರಸ್ವತಿ ಜಯವರ ಪೂರಣಮತಿ
      ತ್ರೈಲೋಕ್ಯದಲಿ ಖ್ಯಾತಿ ಜಯ ಸುಕೀರ್ತಿ ||
  - type: charana
    number: 1
    kn: |
      ವಿದ್ಯಾವರದಾಯಿನಿ ಸಿದ್ಧಿಗೆ ಶಿಖಾಮಣಿ
      ಬುದ್ಧಿ ಪ್ರಕಾಶಿನಿ ಸದ್ಭೂಷಿಣಿ ||

  - type: ''
    number: 2
    kn: |
      ಕರಕಮಲದಲಿ ವೀಣೆ ಸುರಸ ಅಮೃತವಾಣಿ
      ವರವಿದ್ಯದಲಿ ದಾನಿ ಸುಪ್ರವೀಣೆ || 

  - type: ''
    number: 3
    kn: |
      ಪ್ರಸನ್ನವದನಿ ವಿಶ್ವದಲಿ ನೀ ಪೂರ್ಣೆ
      ಹಂಸವಾಹಿನಿ ಪೂರ್ಣಿ ಸ್ವಸಿದ್ಧಿಣಿ || 

  - type: ''
    number: 4
    kn: |
      ಸದಾ ಸದ್ಗುರುಸ್ತುತಿ ಒದುಗುವ್ಹಾಂಗ ಸ್ಫೂರ್ತಿ
      ಇದೇ ಮಹಿಪತಿ ಕುರ್ತಿ ಬೋಧಿಸು ಮತಿ || 
