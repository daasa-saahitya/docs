# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ದಯಮಾಡೆ ದಯಮಾಡೆ ತಾಯೆ ವಾಗ್ದೇವಿ
author_kn: ಜಗನ್ನಾಥ ದಾಸರು
category: [Dasara Pada]
on_who: [Saraswati]
types: [Dayamadu / Karunisu]
festivals: [Saraswati Pooja]
raga_kn: ಮಧ್ಯಮಾವತಿ
tala_kn: ಆದಿ ತಾಳ
ankita_kn: ಜಗನ್ನಾಥ ವಿಠಲ
verses:
  - type: pallavi
    kn: |
      ದಯಮಾಡೆ ದಯಮಾಡೆ ತಾಯೆ ವಾಗ್ದೇವಿ
      ದಯದಿಂದ ನೀನೆನ್ನ ನೋಡೆ ವಾಗ್ದೇವಿ ||

  - type: charana
    number: 1
    kn: |
      ಹಿತದಿ ಸನ್ಮತಿಯ ಶ್ರೀಮತಿದೇವಿ ನೀಡೆ
      ವ್ರತತಿಜನೇತ್ರೆ ಭಾರತಿ ನೀ ದಯಮಾಡೆ ||

  - type: ''
    number: 2
    kn: |
      ಸುಮುಖೀ ತ್ವಚ್ಚರಣಾಬ್ಜದ್ರುಮಛಾಯಶ್ರಿತರ
      ಸುಮತಿಗಳೊಳಗಿಟ್ಟು ಮಮತೆಯಿಂ ಸಲಹೆ ||

  - type: ''
    number: 3
    kn: |
      ಜಗನ್ನಾಥವಿಠಲನಂಘ್ರಿಗಳ ಸೇವೆಯೊಳು ಸು
      ಗುಣೆ ಸನ್ಮತಿಕೊಟ್ಟು ಬೇಗನೆ ಸಲಹೆ||
