# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ಮಂಗಳಂ ಸರಸ್ವತಿದೇವಿಗೆ
author_kn: ಹರಿದಾಸಿನಿ ಯದುಗಿರಿಯಮ್ಮ
category: [Dasara Pada]
on_who: [Saraswati]
types: []
festivals: [Saraswati Pooja]
raga_kn: ಆರಭಿ
tala_kn: ಆದಿ ತಾಳ
ankita_kn: ವೆಂಕಟ / ವೆಂಕಟಕೃಷ್ಣ / ಶ್ರೀನಿವಾಸ
verses:
  - type: pallavi
    kn: |
      ಮಂಗಳಂ ಸರಸ್ವತಿದೇವಿಗೆ ಜಯ
      ಮಂಗಳಂ ಸರಸಿಜೋದ್ಭವನರಸಿಗೆ
  - type: charana
    number: 1
    kn: |
      ಸತ್ಯಲೋಕವ ಬಿಟ್ಟು ಅತ್ಯಂತಹರುಷದಿ
      ಭಕ್ತರಿಗೆ ತಾನೊಲಿದು ಬಂದು |
      ಮತ್ತೆ ಶೃಂಗೇರಿಯ ರತ್ನದ ಪೀಠದಿ
      ಪ್ರತ್ಯಕ್ಷಳಾದ ಶಾರದದೇವಿಗೆ ||

  - type: ''
    number: 2
    kn: |
      ರತ್ನದಕಿರೀಟ ಮುತ್ತಿನಬಟ್ಟು 
      ಮುಕುರವನಿಟ್ಟು ಮುತ್ತಿನವಾಲೆ |
      ಮೇಲಾದ ಕೇದಗೆ ರಾಗಟೆಹೆರಳು 
      ಬಂಗಾರಗುಂಡುಗಳಿಟ್ಟ ಶಾರದದೇವಿಗೆ ||

  - type: ''
    number: 3
    kn: |
      ಕೆತ್ತನೆ ಅಡ್ಡಿಕೆ ಮುತ್ತಿನಕಟ್ಟಾಣಿ 
      ಹಸ್ತಕಡಗ ಹರಡಿ ವಂಕಿನಿಟ್ಟು |
      ಮತ್ತೆ ಕಮಲ ಗಿಣಿ ಪುಸ್ತಕಕಂಠವು 
      ಭಕ್ತರಿಗಭಯವ ತೋರುವ ದೇವಿಗೆ ||

  - type: ''
    number: 4
    kn: |
      ಚಂದದ ಪೀತಾಂಬರ ಕುಂದಣದೊಡ್ಯಾಣ 
      ಅಂದುಗೆ ಗೆಜ್ಜೆ ಪಾಡಗವನಿಟ್ಟ |
      ಬಂದಭಕ್ತರಿಗೆ ಇಷ್ಟಾರ್ಥವ ಕೊಡುತಿರ್ಪ
      ಇಂದಿರೆರಮಣನಸೊಸೆ ಶಾರದೆಗೆ ||

  - type: ''
    number: 5
    kn: |
      ಯಾವಾಗಲು ಎನ್ನ ನಾಲಗೆಯಲಿ ನಿಂದು 
      ನಾರಾಯಣನ ನಾಮವ ನುಡಿಸಿ |
      ಕಾಮ ಕ್ರೋಧ ಲೋಭ ಮೋಹ ಬಿಡಿಸಿ
      ಶ್ರೀನಿವಾಸನಪಾದ ತೋರ್ಪ ಶಾರದೆಗೆ ||