# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ದಯಮಾಡೊ ರಂಗ ದಯಮಾಡೊ
author_kn: ಪುರಂದರ ದಾಸರು
category: [Haadu]
on_who: [Ranga]
types: [Dayamadu / Karunisu]
festivals: []
raga_kn: ಕಲ್ಯಾಣಿ
tala_kn: ಆದಿ ತಾಳ
ankita_kn: ಪುರಂದರ ವಿಠ್ಠಲ

verses:
  - type: pallavi
    kn: |
      ದಯಮಾಡೊ ರಂಗ ದಯಮಾಡೊ
      ದಯಮಾಡೊ ನಿನ್ನ ದಾಸನು ನಾನೆಂದು

  - type: anupallavi
    kn: |
      ಹಲವು ಕಾಲದಿ ನಿನ್ನ ಹಂಬಲು ಎನಗೆ |
      ಒಲಿದು ಪಾಲಿಸಬೇಕು ವಾರಿಜನಾಭ ||

  - type: charana
    kn: |
      ಇಹಪರಗತಿ ನೀನೆ ಇಂದಿರಾರಮಣ
      ಭಯವೇಕೊ ನೀನಿರಲು ಭಕ್ತರಭಿಮಾನಿ |
      ಕರಿರಾಜವರದನೆ ಕಾಮಿತ ಫಲದ
      ಪುರಂದರವಿಠಲನೆ ಹರಿಸಾರ್ವಭೌಮ ||
