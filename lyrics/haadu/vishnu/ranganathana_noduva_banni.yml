# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ರಂಗನಾಥನ ನೋಡುವ ಬನ್ನಿ
author_kn: ಶ್ರೀಪಾದರಾಜರು
category: [Dasara Pada]
on_who: [Ranga]
types: []
festivals: []
raga_kn: unknown
tala_kn: unknown
ankita_kn: ರಂಗ ವಿಠಲ
verses:
  - type: pallavi
    kn: |
      ರಂಗನಾಥನ ನೋಡುವ ಬನ್ನಿ|
      ಶ್ರೀರಂಗನ ದಿವ್ಯ ವಿಮಾನದಲ್ಲಿಹನ ||

  - type: charana
    number: 1
    kn: |
      ಕಮನೀಯಗಾತ್ರನ ಕರುಣಾಂತರಂಗನ
      ಕಾಮಿತಾರ್ಥವೀವ ಕಲ್ಪವೃಕ್ಷನ |
      ಕಮಲದಳ ನೇತ್ರನ ಕಸ್ತೂರಿರಂಗನ
      ಕಾಮಧೇನು ಕಾವೇರಿರಂಗನ ||

  - type: ''
    number: 2
    kn: |
      ವಾಸುಕಿಶಯನನ ವಾರಿಧಿನಿಲಯನ
      ವಾಸುದೇವ ವಾರಿಜನಾಭನ |
      ವಾಸವಾದಿ ಭಕ್ತ ಹೃದಯಾಂಬುಜದಲ್ಲಿ
      ವಾಸವಾಗಿರುತಿಹ ವಸುದೇವಸುತನ ||

  - type: ''
    number: 3
    kn: |
      ಮಂಗಳಗಾತ್ರನ ಮಂಜುಳಭಾಷನ
      ಗಂಗಾಜನಕನ ಅಜಪಿತನ |
      ಸಂಗೀತಲೋಲನ ಸಾಧುಸಮ್ಮತನ
      ರಂಗವಿಠ್ಠಲನ ರಾಜೀವನೇತ್ರನ ||
