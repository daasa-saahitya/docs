# Daasa Saahitya - lyrics (aligned by scripts/align.py)

title_kn: ಜಯರಾಯರ ನೋಡಿರೋ
author_kn: ವಿಜಯ ದಾಸರು
category: [Dasara Pada]
on_who: [Jayateertharu]
types: []
festivals: []
raga_kn: ಹಂಸದ್ವನಿ
tala_kn: ಆದಿ
ankita_kn: ವಿಜಯ ವಿಠಲ
verses:
  - type: pallavi
    kn: |
      ಜಯರಾಯರ ನೋಡಿರೋ ಸಜ್ಜನರೆಲ್ಲ
      ಜಯರಾಯರ ನೋಡಿರೋ ||

  - type: anupallavi
    kn: |
      ಜಯರಾಯರ ನೋಡಿ ಜಪಿಸಿ ಮನದಿ ಪಾಡಿ |
      ಜಯವಾಗುವುದು ನಿಮಗೆ ಭಯನಾಶ ಸಂತತ ||

  - type: charana
    number: 1
    kn: |
      ದುರುಳಮತವೆಂಬೊ ಕರಿಗೆ ಅಂಕುಶವಿತ್ತು
      ಸುರಸಾದ ಗ್ರಂಥ ಆನಂದಮುನಿ |
      ವಿರಚಿಸಿ ಇರಲಾಗಿ ಪರಮಭಕ್ತಿಯಿಂದ ವಿ
      ಸ್ತರ ಮಾಡಿದಾ ಕರದ ಕನ್ನಡಿಯಂತೆ ||

  - type: ''
    number: 2
    kn: |
      ವಾದಿಗಳನ್ನೆಲ್ಲಾ ಜೈಸಿ ಡಂಗುರ ಹೊಯ್ಸಿ
      ಭೇದಾರ್ಥ ಸುಜ್ಞಾನ ಸತ್ಯವೆನಿಸಿ |
      ಈ ಧರಿಯೊಳಗೆ ಹರಿಪರ ದೈವವೆಂದು
      ಸಾಧಿಸಿ ಉದ್ದಂಡವಾದ ಗುರುತಿಲಕ ||

  - type: ''
    number: 3
    kn: |
      ಅಕ್ಷೋಭ್ಯತೀರ್ಥರ ಕರದಿಂದ ಜನಿಸಿ
      ಮೋಕ್ಷಕೆ ಜಯ ಪತ್ರಿಕೆ ಕೊಡಿಸಿ |
      ಪಕ್ಷಿವಾಹನ ಸಿರಿ ವಿಜಯವಿಠ್ಠಲನನ್ನ
      ನೀಕ್ಷಿಸುವದಕೆ ಉಪದೇಶ ಕೊಡುವ ಋಷಿ ||
