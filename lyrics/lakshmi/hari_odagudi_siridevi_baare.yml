# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ಹರಿಯೊಡಗೂಡಿ ಸಿರಿದೇವಿ ಬಾರೆ
author_kn: ವಿಜಯರಾಘವ ದಾಸರು
category: [Dasara Pada]
on_who: [Lakshmi]
types: [Naivedya]
festivals: [Varamahalakshmi]
raga_kn: ಮೋಹನ
tala_kn: ಆದಿ
ankita_kn: ವಿಜಯರಾಘವ
verses:
  - type: pallavi
    kn: |
      ಹರಿಯೊಡಗೂಡಿ ಸಿರಿದೇವಿ ಬಾರೆ |
      ಹರಿಗೆ ನೈವೇದ್ಯವ ನೀನಿಡು ಬಾರೆ ॥

  - type: charana
    number: 1
    kn: |
      ಸುವರ್ಣ ಪಾತ್ರೆಯೋಳ್ ಸಣ್ಣಕ್ಕಿ ಅನ್ನ |
      ಬೆಳ್ಳಿಯ ತಟ್ಟೆಯೊಳು ಬಗೆ ಬಗೆ ಭಕ್ಷ್ಯ ||
      ಚಿನ್ನದ್ದರಿವಾಣದಿ | ಚಿತ್ರಾನ್ನ ಶಾಲ್ಯಾನ್ನ |
      ರಜತ ಪಾತ್ರೆಯೊಳು ಪರಮಾನ್ನ ||

  - type: ''
    number: 2
    kn: |
      ಬೆಳ್ಳಿಯ ಗಿಂಡಿಲಿ ಪನ್ನೀರು ನೀರು |
      ಚಿನ್ನದ ದೊನ್ನೆಲಿ ಪಾನಕ ಖೀರು ||
      ಚಿತ್ತಾರದ ಬಟ್ಟಲೊಳು ಕಟ್ಟಿನ ಸಾರು |
      ಚಿನ್ಮಯರೂಪಗೆ ದೇಂಡಿಯ ಮೊಸರು ||

  - type: ''
    number: 3
    kn: |
      ವಿವಿಧ ಅಡಿಗೆಗಳು ವಿಧ ವಿಧ ತಿನಿಸು |
      ವಿವಿಧ ಫಲಗಳು ಮಾವು ಹಲಸು ॥
      ವಿಜಯರಾಘವಗೆ ವಿಶ್ವಾಸದಿ ಬಡಿಸು |
      ವೀಳ್ಯ ತಾಂಬೂಲವ ನೀಡಿ ಆದರಿಸು ||
