# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ಪತ್ರವ ಕಳುಹಿದಳಾ ರುಕ್ಮಿಣಿದೇವಿ
author_kn: ವ್ಯಾಸರಾಜರು
category: [Dasara Pada]
on_who: [Krishna, Lakshmi]
types: []
festivals: []
raga_kn: ಮುಖಾರಿ
tala_kn: ಚಾಪು ತಾಳ
ankita_kn: ಶ್ರೀ ಕೃಷ್ಣ
verses:
  - type: pallavi
    kn: |
      ಪತ್ರವ ಕಳುಹಿದಳಾ ರುಕ್ಮಿಣಿದೇವಿ 
      ಪತ್ರವ ಕಳುಹಿದಳು ರುಕ್ಮಿಣಿದೇವಿ

  - type: anupallavi
    kn: |
      ಪತ್ರ ನೋಡಿ ಗೌರಿ ಯಾತ್ರಾ ಕಾಲದಿ ಕೃಷ್ಣ
      ಗಾತ್ರ ಪವಿತ್ರ ಮಂಗಳಸೂತ್ರ ಕಟ್ಟೆಂದು ॥

  - type: charana
    number: 1
    kn: |
      ನಮ್ಮಣ ನಮ್ಮ ತಂದೆಯ ಮಾತು ಕೇಳದೆ
      ನಿಮ್ಮ ದೂಷಿಸಿ ನೀಚೆಗೆ 
      ನಮ್ಮನ್ನು ಇತ್ತು ಮೂರೇಳು ಕುಲಗಳನು
      ಘಮ್ಮನೆ ನರಕದೊಳ್ ಮುಣುಗಿಸುತ್ತನೆಂದು ॥

  - type: ''
    number: 2
    kn: |
      ಸುಣ್ಣ ಜಾಜಿಗಳಿಂದ ಗ್ರಾಮಗಾಮಗಳ ಪೂಸಿ
      ರನ್ನದ ತೋರಣಗಳ ಕಟ್ಟಿ
      ಪುಣ್ಯವಾಚನ ಮಾಡಿಸಿ ವಿಪ್ರರಿಂದ 
      ಪೂರ್ಣಫಲ ಮಂಟಪ ಸ್ವಾಪವಾಯಿತೆಂದು  ॥

  - type: ''
    number: 3
    kn: |
      ನೀ ಬಾರದಿದ್ದರೆ ಹಬ್ಬ ಸೂರಾಯಿತು
      ತಬ್ಬಿಬ್ಬು ಆಗೋದು ಕುಲಕೆಲ್ಲ
      ಅಬ್ಬರದಿಂದ ಗರುಡಗಮನ ಬಂದು 
      ತಬ್ಬಿಬ್ಬುಕೊಂಡೊಯ್ಯೊ ಶ್ರೀಕೃಷ್ಣ ಬೇಗ ॥
