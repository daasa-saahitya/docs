# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ಎತ್ತಿರೇ ನವರತ್ನದಾರುತಿ ಕರ್ತೃರಂಗನ ರಾಣಿಗೆ
author_kn: ಹರಪನಹಳ್ಳಿ ಭೀಮವ್ವ
category: [Dasara Pada]
on_who: [Lakshmi]
types: [Aarati]
festivals: [Vara Mahalakshmi]
raga_kn: ಕಲ್ಯಾಣಿ
tala_kn: ಆದಿ
ankita_kn: ಭೀಮೇಶಕೃಷ್ಣ
verses:
  - type: pallavi
    kn: |
      ಎತ್ತಿರೇ ನವರತ್ನದಾರುತಿ ಕರ್ತೃರಂಗನ ರಾಣಿಗೆ ||
      ಉತ್ತಮೋತ್ತಮಲೋಲನಾದ ವಿಷ್ಣುವಿನ ಕಲ್ಯಾಣಿಗೆ ||

  - type: charana
    number: 1
    kn: |
      ಶುದ್ಧ ಸ್ನಾನವ ಮಾಡಿ ನದಿಯಲಿ ವಜ್ರಪೀಠದಿ ಕುಳಿಸಿರೇ |
      ತಿದ್ದಿ ತಿಲಕವ ತೀಡಿದಂಥ ಮುದ್ದು ಮಂಗಳಗೌರಿಗೆ ||

  - type: ''
    number: 2
    kn: |
      ಎರೆದು ಪೀತಾಂಬರವನುಡಿಸಿ ಸರ್ವಾಭರಣವನಿಡಿಸಿರೇ |
      ಹರಳಿನೋಲೆ ಮೂಗುತಿ ಇಟ್ಟ ಮುದ್ದು ಮಹಾಲಕ್ಷ್ಮೀ ದೇವಿಗೆ ||

  - type: ''
    number: 3
    kn: |
      ಅಚ್ಚಮಲ್ಲಿಗೆ ಲಕ್ಷ ಸಂಪಿಗೆ ಎತ್ತಿರೇ ನಿಮ್ಮ ಪಾದಕೆ |
      ಉತ್ತಮೋತ್ತಮಲೋಲನಾದ ವಿಷ್ಣುವಿನ ಕಲ್ಯಾಣಿಗೆ ||

  - type: ''
    number: 4
    kn: |
      ಹರಿಯ ವಂಚಿಸಿ ಕರವೀರದೊಳು ಭರದಿ ಸ್ಥಿರವಾಗಿರುವೊಳೇ |
      ಪರಮಭಕ್ತರಿಗೆ ವರವ ಕೊಡುವ ನಿಗರ್ವಿಗೊಲಿಯುವ ದೇವಿಗೆ ||

  - type: ''
    number: 5
    kn: |
      ಹುಟ್ಟು ಬಡವಿಯ ಕಷ್ಟ ಕಳೆದು ಕೊಟ್ಟಳರಸನ ಸಿರಿಯನು |
      ಹೆತ್ತಕುವರನ ತೋರಿದಂಥ ಶುಕ್ರವಾರದ ಗೌರಿಗೆ ||

  - type: ''
    number: 6
    kn: |
      ನಿಗಮವೇದ್ಯಳೇ ನಿನ್ನ ಮಹಿಮೆಯ ಬಗೆಬಗೆಯಿಂದಲಿ ಪೊಗಳುವೆ 
      ತೆರೆದು ಭಾಗ್ಯವ ನೀಡುವಂಥ ಭೀಮೇಶಕೃಷ್ಣನ ಮಡದಿಗೆ ||
