# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ತಾಯೇ ನಿನ ಪದತೋಯಜ
author_kn: ತಪ್ರಾಣೇಶ ದಾಸರು
category: [Dasara Pada]
on_who: [Lakshmi]
types: [Namaskaara]
festivals: [Varamahalakshmi]
raga_kn: ಸೆಂಜುರುಟ್ಟಿ
tala_kn: ಆದಿ
ankita_kn: ಪ್ರಾಣೇಶ ವಿಠ್ಠಲ
verses:
  - type: pallavi
    kn: |
      ತಾಯೇ ನಿನ ಪದತೋಯಜಕೆರಗುವೆ |
      ಮಾಯದೇವಿ ಹರಿಕಾಯನಿವಾಸೆ |

  - type: charana
    number: 1
    kn: |
      ಬುದ್ಧಿಯ ಪ್ರೇರಿಸೆ ಪ್ರದ್ಯುಮ್ನನ ಸತಿ
      ಕರ್ದಮಜಾಲಯೆ ಭದ್ರಶರೀರೆ ||

  - type: ''
    number: 2
    kn: |
      ಇಂಗಡಲಾತ್ಮಜೆ ಅಂಗನಕುಲಮಣಿ
      ರಂಗನ ಪದಕಂಜಭೃಂಗೆ ಕರುಣದಿ ||

  - type: ''
    number: 3
    kn: |
      ಪ್ರಾಣೇಶವಿಠಲನ ಮಾನಿನಿ ಎನ್ನಯ
      ಹೀನತೆಯೆಣಿಸದೆ ಪೋಣಿಸಿಮತಿಯ||
