# Daasa Saahitya - lyrics (aligned by scripts/align.py)
title_kn: ರಕ್ಷಿಸೆನ್ನನು ನೀನು ಪಕ್ಷೀಂದ್ರನೆ
author_kn: ಶ್ಯಾಮ ಸುಂದರ ದಾಸರು
category: [Dasara Pada]
on_who: [Garuda]
types: []
festivals: [Garuda Panchami]
raga_kn: ಬಿಲಹರಿ
tala_kn: ಆದಿ
ankita_kn: ಶ್ಯಾಮ ಸುಂದರ ವಿಠಲನ
verses:
  - type: pallavi
    kn: |
      ರಕ್ಷಿಸೆನ್ನನು ನೀನು ಪಕ್ಷೀಂದ್ರನೆ

  - type: anupallavi
    kn: |
      ರಕ್ಷಿಸೆನ್ನನು | ಪಕ್ಷಿಪ ಕರುಣ ಕ
      ಟಾಕ್ಷದಿಂದೀಕ್ಷಿಸು | ತೀಕ್ಷಣ ಬಿಡದೆ

  - type: charana
    number: 1
    kn: |
      ತಂದೆಯನುಜ್ಞದಿ | ಸಿಂಧೂರ ಕೂರ್ಮ
      ದ್ವಂದ್ವ ಪ್ರಾಣಿಗಳ | ತಿಂದ ಮಹಾತ್ಮ
      ಅಂದು ಪೀಯೂಷವ | ತಂದು ಮಾತೆಯ
      ಬಂಧನ ಬಿಡಿಸಿದ ಬಂಧುರ ಮಹಿಮ

  - type: ''
    number: 2
    kn: |
      ಗಗನ ಗಮನ ಪನ್ನಗವಗೆ ಪ್ರಾರ್ಥಿಪೆ
      ಮಿಗೆ ಕರುಣದಿ ಯನ್ನಘ ದೂರೋಡಿಸಿ
      ಧಾರಣಿಯೊಳವತಾರ ರಹಿತ ಶೃಂ
      ಗಾರವಾದ ಬಂಗಾರ ಶರೀರ

  - type: ''
    number: 3
    kn: |
      ವಂದಿಪೆ ವಿನುತ ನಂದನ ಶಾಮ
      ಸುಂದರವಿಠಲನ | ಶ್ಯಂದನ ಶೂರ 
