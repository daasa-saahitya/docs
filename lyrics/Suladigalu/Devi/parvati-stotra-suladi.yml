title_kn: ಪಾರ್ವತಿ ದೇವಿ ಸ್ತೋತ್ರ ಸುಳಾದಿ
author_kn: ಅಭಿನವ ಪ್ರಾಣೇಶ ದಾಸರು

# OPTIONAL: Raga, Tala, Ankita
raga_kn: ಕಲ್ಯಾಣಿ
