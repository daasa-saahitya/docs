title_kn: ಹನುಮಂತ ಸ್ತೋತ್ರ ಸುಳಾದಿ
author_kn: ಪುರಂದರ ದಾಸರು
raga_kn: ಮೋಹನ

verses:
  - type: None
    number: 1
    subtitle_kn: ಧ್ರುವ ತಾಳ
    kn: |
      ಹನುಮಂತನ ಬಲಗೊಂಡರೆ, ಹರಿಪದಸೇವೆ ದೊರಕೊಂಬುದು|
      ಹನುಮಂತನ ಬಲಗೊಂಡರೆ, ನವವಿಧ ಭಕುತಿಯು ದೊರಕೊಂಬುದು|
      ಹನುಮಂತನ ಬಲಗೊಂಡರೆ, ತಾರತಮ್ಯ ಪಂಚಭೇದ
      ತಾರತಮ್ಯ ಪಂಚಭೇದ, ಜ್ಞಾನ ದೊರೆಕೊಂಬುದು
      ಹನುಮಂತನ ಬಲಗೊಂಡರೆ ದಯದಿಂದ ಪುರಂದರ ವಿಠಲ 
      ಪುರಂದರ ವಿಠಲ, ತಾ ಕೈ ಪಿಡಿವ ||

  - type: None
    number: 2
    subtitle_kn: ಮಟ್ಟ ತಾಳ
    kn: |
      ಹನುಮಂತನ ಕಾಣದೆ, ವಾಲಿ ಬಳಲಿದ|
      ಹನುಮಂತನ ಕಂಡು, ಸುಗ್ರೀವ ಬದುಕಿದ |
      ಹನುಮಂತನ ಪ್ರಿಯ, ಪುರಂದರ ವಿಠಲ ||

  - type: None
    number: 3
    subtitle_kn: ಝಂಪೆ ತಾಳ
    kn: |
      ಎಂದೆಂದೂ ತನ್ನ ಮನವಗಲದೆ ಇರು ಎಂದು |
      ಅಂದೇ ಇತ್ತನು ಬೊಮ್ಮ ಪದವಿ ಹನುಮಂತಗೆ |
      ತಂದೆ ಶ್ರೀ ರಾಮಚಂದ್ರ ಪುರಂದರ ವಿಠಲ |
      ಅಂದೆ ಇತ್ತನು ಬೊಮ್ಮ ಪದವಿ ಹನುಮಂತಗೆ ||

  - type: None
    number: 4
    subtitle_kn: ಅಟ್ಟ ತಾಳ
    kn: |
      ಹಬ್ಬಿದರ್ಜುನನ ಧ್ವಜಾಗ್ರಕ್ಕೆ |
      ಬೊಬ್ಬಿಟ್ಟು ಬಾಹ ಪರಬಲ ಬರಿದು ಮಾಡಿದ |
      ಸಬ್ಬಲ ಸೂರೆಗೊಂಡನು ಹನುಮಂತ |
      ಪುರಂದರ ವಿಠಲನ ಬಂಟ ಹನುಮಂತ ||

  - type: None
    number: 5
    subtitle_kn: ಆದಿ ತಾಳ
    kn: |
      ರೋಮಕೋಟಿಲಿಂಗ ಹೇಮಕುಂಡಲಧರ |
      ಭೀಮ ಬೆಳೆದನು ಬ್ರಹ್ಮಾಂಡಕ್ಕೆ |
      ಸ್ವಾಮಿ ಪುರಂದರ ವಿಠಲರೇಯನ 
      ಬಲುಬಂಟ ಹನುಮಂತ, ಬಲುಬಂಟ ಹನುಮಂತ||

  - type: None
    subtitle_kn: ಜತೆ
    kn: |
      ವಿಜಯೀಭವ ಹನುಮಂತ ವಿಜಯೀಭವ ಗುಣವಂತ |
      ವಿಜಯೀಭವ ಪುರಂದರ ವಿಠಲನ, ಬಲುಬಂಟ ಹನುಮಂತ ||

