title_kn: ತಿಳಿಯದೋ ನಿನ್ನಾಟ ತಿರುಪತಿಯ ವೆಂಕಟ
author_kn: ಕಲ್ಲೂರು ಸುಬ್ಬಣ್ಣ ದಾಸರು

# OPTIONAL: Raga, Tala, Ankita
raga_kn:
